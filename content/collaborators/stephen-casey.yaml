bio: >-
  Stephen Casey is a Philadelphia native, NYC transplant, and a freelance choreographer, director, and dance educator
  residing in Bucks County. He spent 16 seasons as the Resident Choreographer and Artistic Director of the Bucks County
  Playhouse, and his work has been presented at numerous professional regional theaters across the U.S. He is a proud
  recipient of three Philadelphia Barrymore Award nominations and is an adjunct instructor at DeSales University.
