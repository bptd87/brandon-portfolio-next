bio: >-
  Zachary Phelps is a costume designer who has worked on numerous productions for Rolla High School and Ozark Actors
  Theatre. His career began with designing costumes for junior high shows, and he later worked on productions like
  'Wizard of Oz', 'Dorothy in Wonderland', 'Rumors', and 'Gatsby'. He plans to pursue further education in costume
  design and construction at Stephens College.
