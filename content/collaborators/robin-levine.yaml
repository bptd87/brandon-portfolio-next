bio: >-
  Robin Levine is a New York City-based director, choreographer, and educator with a BFA from The University of
  Illinois. She has extensive experience in Off-Broadway, regional, cruise ship, and higher education productions, and
  was the Associate Director/Choreographer for Tim Rice’s From Here To Eternity. A former Broadway performer in Mamma
  Mia, she is also a member of A Broken Umbrella Theatre and the Society of Stage Directors and Choreographers.
