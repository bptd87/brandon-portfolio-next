bio: >-
  Courtney Ryan Crouse is a theatre director and educator with an MFA in Directing from Western Illinois University and
  a BFA from Stephens College. He currently serves as Artistic Director at the Clinton Area Showboat Theatre and is an
  Adjunct Professor of Acting at Stephens College, where he also directs. Crouse is a versatile artist with experience
  in acting, directing, playwriting, and audiobook production.
