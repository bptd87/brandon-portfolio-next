bio: >-
  James Zager is a distinguished theatre director, choreographer, and educator with over two decades of experience in
  professional, regional, and university theatre. He holds an MFA in Theatre for Youth: Directing/Playwriting from
  Arizona State University and currently serves as a Full Professor of Theatre and Dance at Carroll University. His
  extensive body of work includes collaborations with notable companies such as Milwaukee Rep, Milwaukee Ballet, and
  Milwaukee Opera Theatre, and he is the author of several published youth plays.
