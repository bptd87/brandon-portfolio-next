bio: >-
  Janice L. Goldberg is an award-winning theatre director and playwright, recognized with the Kennedy Center Gold
  Medallion Award for her dedication to new plays. Based in New York, she has directed over 75 new works, spanning from
  university productions to Off-Broadway, and served as Producing Artistic Co-Director of AND Theatre Company,
  overseeing the development of over 100 new plays. Her extensive career also includes over 15 years as a director and
  dramaturg in NYU’s Graduate Playwriting Lab, where she guided students in developing their work.
