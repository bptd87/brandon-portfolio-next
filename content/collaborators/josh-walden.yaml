bio: >-
  Josh Walden is a director and choreographer known for their work as Associate Director/Associate Choreographer for the
  Tony-nominated Broadway Revival of Ragtime and for choreographing an episode of Disney+'s Encore. Their extensive
  credits include directing and choreographing productions such as Camelot, Smokey Joe's Cafe, and A Chorus Line at
  various regional theaters, and performing in Broadway revivals like 42nd Street and La Cage aux Folles.
