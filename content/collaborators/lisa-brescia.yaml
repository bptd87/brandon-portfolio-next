bio: >-
  Lisa Brescia is a celebrated theatre director and actress known for her extensive work on Broadway, including roles in
  Dear Evan Hansen, Mamma Mia!, and Wicked. She is currently an Associate Professor of Acting and Chair of Performance
  at Stephens College Conservatory for the Performing Arts, where she also directs.
