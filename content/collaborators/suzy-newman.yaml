bio: >-
  Suzy Newman is an actor and theatre director based in San Luis Obispo, CA. She earned her MFA in Acting from the
  University of Alabama and has worked in regional theatres throughout the country, including serving as Company Manager
  at The Great American Melodrama and Vaudeville and Development Coordinator for PCPA – Pacific Conservatory Theatre.
