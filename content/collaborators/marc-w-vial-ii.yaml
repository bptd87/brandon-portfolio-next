bio: >-
  Marc W. Vital II is an Assistant Professor of Costume Design at the University of Missouri, holding a BA from the
  University of Alabama and an MFA from the University of Missouri-Kansas City. He is recognized for his work on
  productions such as 'The Prom,' 'Ragtime,' and 'Luchadora,' and actively promotes inclusion as Vice Chair of
  Representation, Equity, and Diversity for KCACTF Region 5.
