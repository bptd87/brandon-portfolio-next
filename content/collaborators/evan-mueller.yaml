bio: >-
  Evan Mueller is a theatre artist and educator, currently serving as Artistic Director of American Theater Northwest
  and teaching Acting and Voice & Speech at Western Washington University. He is a co-founder of New York's Strange Sun
  Theater and has taught at institutions including New York University and Rutgers University, Mason Gross School of the
  Arts. As a professional actor and director, he has worked with numerous theatre companies across the country.
