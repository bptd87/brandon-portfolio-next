bio: >-
  Dr. Brandon V. Riley is an Assistant Professor at Southern Illinois University Edwardsville in the department of
  Theater and Dance. He earned his PhD in Theatre & Performance Studies from the University of Missouri in 2025. He is a
  professional director, performer, and choreographer, and has received several recognitions from KCACTF in directing,
  choreography, and acting.
