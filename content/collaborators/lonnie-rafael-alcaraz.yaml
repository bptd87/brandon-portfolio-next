bio: >-
  Lonnie Rafael Alcaraz is a professional lighting designer and Professor at UC Irvine, where he heads the lighting
  program. He has designed for numerous regional theatres, including the Oregon Shakespeare Festival and South Coast
  Repertory, and his notable international work includes Beitak Productions in Oman and Universal Studios Japan.
