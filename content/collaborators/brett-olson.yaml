bio: >-
  Brett John Olson is a multidisciplinary storyteller and educator, currently serving as Assistant Professor of Musical
  Theatre at the University of Wisconsin-Parkside. His extensive career includes over 100 credits in theatre, film, and
  television, with professional work spanning regional, national, and NYC-based productions. He is a proud member of
  AEA, SDC, IDC, and SAFD, and has received multiple KC/ACTF Meritorious Awards for Direction, Choreography, and
  Ensemble Work.
