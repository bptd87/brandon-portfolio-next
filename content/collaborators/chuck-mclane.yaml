bio: >-
  Chuck McLane is an accomplished actor with a career spanning regional theatre productions. He has performed in
  numerous roles, including Duke of Norfolk in "Richard III" at the Utah Shakespeare Festival, Charlie Cowell in "The
  Music Man," and Jacob Marley in "A Christmas Carol" at the Great American Melodrama and Vaudeville. His affiliations
  include PCPA Theaterfest and The Western Stage.
