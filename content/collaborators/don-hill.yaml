bio: >-
  Don Hill is a seasoned theatre professional with a thirty-two year career as an actor, stage manager, production
  manager, director, producer, and union negotiator. He has held significant roles at institutions such as the Los
  Angeles Actors' Theatre, Long Beach Civic Light Opera, and the Claire Trevor School of the Arts at UCI, where he was
  voted Outstanding Professor of the Year multiple times. His career highlights include working with notable
  personalities like Carol Burnett and Patti Lupone, and serving on the board of LA Stage Alliance, contributing to the
  creation of the Ovation Awards.
