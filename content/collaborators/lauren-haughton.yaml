bio: >-
  Lauren Haughton Gillis is an international director and choreographer with extensive experience in musical theatre,
  having worked on Broadway National Touring companies for shows like Hamilton and Wicked. She currently serves as the
  BFA Director of Music Theatre at Florida State University and is a proud member of Actors Equity Association, also
  holding the position of Head of Dance/Vice President of Conferences for Musical Theatre Educators' Alliance
  International.
