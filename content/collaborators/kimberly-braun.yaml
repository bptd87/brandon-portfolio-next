bio: >-
  Kimberly Braun is a singer, writer, teaching artist, and director with a Bachelor's of Music in Vocal Arts from the
  University of Southern California and a Master of Arts in Theater Arts from San Jose State University. She has acted
  professionally at Folger Theatre, Barter Theatre, and Texas Shakespeare Festival, and has taught at Guthrie Theatre
  and CalArts. Kimberly is a proud member of Actors Equity Association and Director of the Denali Film Festival.
