bio: >-
  Guo Ningru is a sound designer with over a decade of experience in local and regional productions. She holds a degree
  in Technical Theatre Arts from LASALLE College of the Arts and an MFA in Sound Design from the University of
  California Irvine, where she graduated in 2019. Her work explores multidirectional audio and time-based localization
  to create immersive and hyperrealistic aural experiences.
