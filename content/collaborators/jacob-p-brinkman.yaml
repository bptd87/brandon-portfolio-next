bio: >-
  Jacob P. Brinkman is a Graduate of Fredonia University where he received his BFA in Theatrical Production and Design.
  Amid the COVID-19 Pandemic, he graduated from the University of California, Irvine with his MFA in Lighting Design.
  Currently, Jake is working for Walt Disney Imagineering in the Anaheim office where he gets to 'play' in Walt's park
  doing what he loves most.
