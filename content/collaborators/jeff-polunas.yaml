bio: >-
  Jeff Polunas is an Assistant Professor of Sound Design at Kent State University. He holds an MFA in Sound Design from
  the University of California, Irvine, and has extensive experience as a Production Sound Supervisor at UC Irvine and
  Production Sound Engineer at Cal State Fullerton and PCPA Theaterfest, overseeing sound for numerous theatrical
  productions.
