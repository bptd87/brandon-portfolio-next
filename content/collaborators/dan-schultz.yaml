bio: >-
  Dan Schultz is a writer, actor, director, and arts administrator, formerly serving as Artistic Director for both the
  Great American Melodrama and Vaudeville and the Okoboji Summer Theatre. He has directed numerous productions,
  including The 39 Steps and Pump Boys and Dinettes, and is a proud member of Actors’ Equity Association, having
  performed at The Alabama Shakespeare Festival, The Public Theatre, and Phoenix Theatre.
