bio: >-
  Ashley Harrison earned a degree in fashion and costume design from Stephen's College in 2005. She has since designed
  costumes for film, dance, and theater, and works in costume shops as a pattern-maker, stitcher, cutter/draper, and
  shop manager. Harrison is also a founding member of Bellenwhissle Productions in Kansas City and teaches sewing at
  Stephen's College.
