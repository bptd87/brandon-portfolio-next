bio: >-
  Jesús Lopez is a visual artist, photographer, arts producer, writer/director, and educator. He holds an MFA in Stage
  Management from UCI and a BFA in Technical Theatre with a concentration in Stage Management & Lighting Design from UT
  at El Paso. He has worked internationally as a lighting designer and currently serves as the Director of Outreach for
  the New Swan Shakespeare Center and Production Coordinator for its Summer Shakespeare Festival.
