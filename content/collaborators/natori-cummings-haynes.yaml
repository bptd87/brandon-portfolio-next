bio: >-
  Natori Cummings-Haynes is a lighting designer based in Southern California, holding an MFA in Lighting Design from the
  University of California, Irvine. Her notable works include productions at Irvine Barclay Theatre and South Coast
  Repertory Theatre. She also has experience as a Lighting Supervisor for touring productions and as an Entertainment
  Stage Technician at Disneyland Resort.
