bio: >-
  Michael Bollinger is a seasoned director, actor, and producer with extensive experience in cultural arts. He has
  served as director for theaters and performing arts centers in Missouri, Virginia, New Jersey, and Tennessee,
  including the Lyceum Theatre and the Suffolk Center for Cultural Arts. His work has been honored with a Missouri Arts
  Award and a commendation from President Clinton.
