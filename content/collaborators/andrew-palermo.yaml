role: director
bio: >-
  Andrew Palermo is a director, choreographer, and creator of new works for the stage, known for his Broadway
  choreographic debut with Allegiance and his work on Nickel Mines. He has also choreographed for Moscow State Ballet
  Theatre and numerous regional and university productions. Palermo is a Professor of Drama at UC Irvine and co-founded
  dre.dance, a contemporary dance company.
