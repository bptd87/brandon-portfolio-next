bio: >-
  Jane Page is a professional director whose work is well known across the United States and abroad, including
  productions for the Colorado, Utah, Kentucky, and St. Louis Shakespeare Festivals, as well as international work in
  Vienna and Edinburgh. She is also a Professor of Directing, Emeritus, at the University of California, Irvine, where
  she was named Professor of the Year in 2015.
