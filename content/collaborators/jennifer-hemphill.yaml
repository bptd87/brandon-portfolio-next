bio: >-
  Jennifer Hemphill is a theatre director, choreographer, and educator with a two-decade career spanning Broadway,
  national tours, and regional theatres. She is a professor of Music Theatre at Baldwin Wallace University and a member
  of the Actors' Equity Association (AEA) and the Stage Directors and Choreographers Society (SDC).
