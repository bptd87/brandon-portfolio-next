bio: >-
  Karl Kippola is a theatre director, actor, and educator, serving as a full-time faculty member at American University
  since 2003 and as program director from 2016 to 2023. He has directed over a hundred productions and worked with
  notable theatres such as Everyman Theatre, Olney Theatre, and the Shakespeare Theatre. Kippola's academic research
  focuses on musical theatre history and the performance of masculinity on the nineteenth-century American stage.
