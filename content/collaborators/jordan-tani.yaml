bio: >-
  Jordan Tani is a sound designer and composer with an M.F.A. in sound design from the University of California, Irvine,
  and a background in music literature and technology from the University of California, San Diego. He has worked as a
  sound fellow with the CTC conservatory, designing sound for productions like 'One Arm' and 'Building the Wall,' and
  composing original music for 'Birthday Candles.' His experience also includes work at South Coast Repertory and Geffen
  Playhouse, and he has a strong interest in spatial audio, having contributed to projects and discussions in this
  field.
