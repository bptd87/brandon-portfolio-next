bio: >-
  Kathryn Poppen is a Los Angeles-based costume designer, serving as Costume Coordinator at the USC Glorya Kaufman
  School of Dance while also designing and assisting across Los Angeles and Orange County. She has contributed to
  numerous productions at esteemed institutions like Center Theatre Group and South Coast Repertory, with recent design
  credits including Junie B. Jones Is Not a Crook and Lost Tribes. Holding a BFA in Theatrical Design from the
  University of Southern California, she is a proud member of USA 829.
