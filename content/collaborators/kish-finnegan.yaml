role: costume_designer
bio: >-
  Kish Finnegan is a costume designer with a BFA in Performance Art and Design Technology from the California Institute
  of the Arts. She began her career designing for Team USA Synchronized Swimming and aquatic shows, later working on
  television and film sets, and for various theaters where she won a Dramalogue Award. Currently, she is the resident
  costume designer at the Arizona Theatre Company, with extensive credits in regional theater.
