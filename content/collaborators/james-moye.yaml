bio: >-
  James Moye is an Actor/Director based in New York City, with a career spanning ten Broadway shows, films, TV shows,
  commercials, and world premiere musicals and plays at many of America’s finest regional theaters. He is a member of
  Actor’s Equity Association and SAG-AFTRA, and a graduate of James Madison University, where he received the 2017
  Distinguished Alumni Award.
