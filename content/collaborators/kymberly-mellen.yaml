bio: >-
  Kymberly Mellen is an Assistant Professor of Acting at UNLV, with previous professorships at the University of
  Wisconsin – Whitewater, The Theatre School at DePaul University, and BYU. She is an accomplished actor and director,
  with extensive experience in regional theatre, including the Utah Shakespeare Festival, and has been recognized with
  two Jeff awards and named the Chicago Tribune's 2003 Theatre "Chicagoan of the Year". Her diverse career also includes
  work in film, commercials, voice-overs, and narrated books.
