bio: >-
  Beth Leonard is an Emeritus Professor of Theatre at Western Washington University and previously served as the Dean of
  the School of Performing Arts at Stephens College. She has extensive experience in both professional and academic
  theatre, having acted and directed throughout the Midwest, including serving as Artistic Director of the Okoboji
  Summer Theatre for fifteen years. She is also a produced playwright and voice-over talent.
