bio: >-
  Matthew Darryl Martinez aspired to be like his mother from a young age. He wanted to be creative and make beautiful
  things just like she did. He started dancing and singing lessons when he was 7. He stepped into theatre as a performer
  at 16. In high school he was in show choir where his love for musical theatre grew. With an infatuation for fashion,
  he went into costume design during his undergrad years at the University of New Mexico, and designed his first main
  stage production. He studied Costume Design at The University of California, Irvine, where he recently designed
  “Hoodoo Love”.
