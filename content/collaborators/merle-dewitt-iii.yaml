bio: >-
  Merle DeWitt III is a theatrical projection designer, lighting designer and media artist currently based out of Long
  Beach, CA, USA. Merle has designed and assisted both nationally and internationally with some of his recent credits
  including Assistant Projections Designer for David Murikami on Flaming Arrow, (Saudi Arabia, December 2022) &
  Projections Designer on Curie, Curie (Amsterdam, January 2022). Merle has his M.F.A. in Drama for Lighting Design from
  the University of California, Irvine, and his B.F.A. in Theatre Design and Technology from the University of Texas at
  El Paso.
