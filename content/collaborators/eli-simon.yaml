bio: >-
  Eli Simon is a Chancellor's Professor of Drama at the University of California, Irvine, and the founding Artistic
  Director of the New Swan Shakespeare Festival. He has directed numerous productions across the country and overseas,
  specializing in American classics, Shakespeare, musicals, and original clown shows. Simon is also the author of "The
  Art of Clowning" and "Masking Unmasked."
