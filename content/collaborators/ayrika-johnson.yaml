bio: >-
  Ayrika Johnson is a costume designer with a Bachelor's of Arts from the University of Northern Colorado and an MFA
  from the University of California-Irvine. Her experience spans repertory theatre, dance concerts, and indie film
  productions, complemented by her published historical fashion research. She focuses on social history to create
  designs reflective of the narratives and people she encounters.
