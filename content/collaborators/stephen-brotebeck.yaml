bio: >-
  Stephen Brotebeck is the Director of the School of Theatre, Television, and Film and a Professor of Musical Theatre at
  San Diego State University. He has served as Interim Artistic Director of Diversionary Theatre and former Artistic
  Director of the Okoboji Summer Theatre. On Broadway, he was the Movement Associate for "Peter and the Starcatcher" and
  Assistant Director for "Ghost The Musical."
