bio: >-
  Cheryl Black is a distinguished Professor of Theatre and the Catherine Paine Middlebush Chair of Fine and Performing
  Arts at the University of Missouri, holding a Ph.D. in Theatre History, Theory and Criticism. Her extensive career
  encompasses roles as an actress, director, and playwright, with notable affiliations including the Actors Equity
  Association, Screen Actors Guild, and the College of Fellows of the American Theatre. She has made significant
  contributions to professional, regional, and university theatre through her academic work and artistic endeavors.
