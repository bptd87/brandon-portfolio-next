bio: >-
  Jennifer Clark is a costume designer and stylist based on the West Coast, originally from St. Louis, Missouri. She has
  designed for various theatrical productions, including The Amish Project and As You Like It, and was a finalist in the
  National Her Universe Fashion Design Competition. Jennifer holds an MFA in Costume Design from the University of
  California, Irvine, and also styles commercial and editorial photoshoots.
