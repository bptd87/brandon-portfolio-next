bio: >-
  David Crespy is a professor of playwriting, acting, and dramatic literature at the University of Missouri, where he
  founded and co-directs the Writing for Performance program and serves as the Artistic Director of the Missouri
  Playwrights Workshop. A recipient of the 2017 Gold Medallion from the Kennedy Center American College Theatre Festival
  and an inductee into the College of Fellows of the American Theatre, he is also a working actor and President of the
  Edward Albee Society.
