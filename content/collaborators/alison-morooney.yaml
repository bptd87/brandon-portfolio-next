bio: >-
  Alison Morooney is a director, choreographer, and educator with an MFA in Directing from Penn State University. She
  has a background as a professional musical theatre performer, including national tours and regional productions, and
  is currently an Assistant Professor of Musical Theatre at Wilkes University. Her work includes directing productions
  such as The Wild Party, Assassins, and Pippin.
