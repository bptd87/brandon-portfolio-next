bio: >-
  Rob Salas is a Mexican-American director and producer based in Orange County, CA, known for his work in professional,
  regional, and university theatre. He has directed numerous productions including As You Like It, All’s Well That Ends
  Well, and Alice’s Wonderland, and was a founding Artistic Director of Davis Shakespeare Festival. Currently, he serves
  as a Producing Associate at South Coast Repertory, holding a BA from Harvard and an MFA from UC Irvine.
