bio: >-
  Dr. Joy Powell is an Associate Teaching Professor of Musical Theatre and Artistic Director of the Larry D. Clark
  Summer Repertory Theatre at the University of Missouri. With a career spanning since 2003, she has directed, produced,
  and choreographed over 50 musicals and plays, working with professional theatres such as the St. Louis MUNY and
  Tuacahn Center for the Arts.
