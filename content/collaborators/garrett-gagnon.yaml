bio: >-
  Garrett Gagnon is a musician, sound designer, and sound engineer based in Southern California. He earned his MFA in
  Sound Design from the University of California, Irvine in June of 2021, after studying music, composition, and audio
  engineering at Western Michigan University. He has worked as a Sound Designer for local theatres and in corporate
  audio, combining his passion for music and theatre.
