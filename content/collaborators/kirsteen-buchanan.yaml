bio: >-
  Kirsteen Buchanan is a thoughtful fashion and surface designer, fashion educator, and imaginative maker based in
  Columbia, MO. She holds a B.F.A. from Stephens College and an M.A. from the University of Missouri–Columbia. Her work
  encompasses surface pattern design, blending hand and digital techniques, and fashion design informed by market and
  trend research.
