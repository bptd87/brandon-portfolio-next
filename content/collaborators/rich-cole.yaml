bio: >-
  Rich Cole is a theatre director and casting director with an MA in Directing from Penn State University. He is a
  member of the Stage Directors and Choreographers Society (SDC) and has served as an Adjunct Professor of Acting at
  Fairleigh Dickinson University. His career includes work with the University of Alabama/Alabama Shakespeare Festival
  and the University Resident Theatre Association.
