bio: >-
  Millie Garvey is an independent director and choreographer based in St. Louis, with extensive experience in
  professional, regional, and university theatre. She has served as a resident choreographer at The Little Theatre-On
  The Square for many years and has directed numerous productions, including for Stephens College and Washington
  University. Garvey is also a proud member of Actors' Equity.
