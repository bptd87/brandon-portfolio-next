bio: >-
  Karyn D. Lawrence is an award-winning lighting designer based in Los Angeles, holding an MFA in Lighting Design from
  the University of California, Irvine. She has received four Los Angeles Ovation Nominations and a 2016 NAACP Theater
  Award for Best Lighting for her work on various regional and local theater productions. In addition to her design
  work, she teaches lighting design at California State University Los Angeles and is the lead lighting designer for
  Universal Studios' Halloween Horror Nights.
