bio: >-
  Lennox Emery is a Lighting Designer based in New York City. She received her BFA in Technical Theatre & Stage
  Management from the Conservatory of the Arts at Stephens College, where she discovered her passion for lighting
  design. She has designed lighting for numerous productions, including *9 to 5: The Musical*, *Our Town*, and *Side by
  Side by Sondheim*.
