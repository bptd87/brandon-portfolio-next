bio: >-
  Cherie Sampson is an intermedia artist and educator with a three-decade career in performance, installation, and new
  media art, alongside extensive university teaching. She has presented her work widely across the U.S. and
  internationally, and her site-based work created in Finland is part of the permanent collection of the Pori Museum of
  Art. Her current solo project, "every.single.one," portrays personal and familial experiences with hereditary breast
  cancer.
