bio: >-
  Lamby Hedge is a highly experienced theatre director and educator, with a career spanning over three decades in
  professional, regional, and university theatre. She is an Associate Professor of Theatre at Stephens College, where
  she has directed over 300 shows, and has also served as Artistic Director for the Summer Theatre Institute and worked
  with the Okoboji Summer Theatre. Her diverse background includes acting, casting, and running her own theatre company.
