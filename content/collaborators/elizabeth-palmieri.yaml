bio: >-
  Elizabeth Braaten Palmieri is a director, actor, writer, and arts facilitator based in Columbia, Missouri. As
  Co-Founder and Artistic Director of GreenHouse Theatre Project, her work focuses on physical theatre in site-specific
  spaces, devising new projects, and adapting classic works. She has taught masterclasses internationally and holds a
  degree in Theatre from St. Olaf College.
