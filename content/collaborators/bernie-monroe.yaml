bio: >-
  Bernard Monroe is a Director/Choreographer and a member of SDC, the Stage Director and Choreographer’s union. He has
  worked extensively with regional theatres such as Mill Mountain Theatre, The Fulton Theatre, and Okoboji Summer
  Theatre, and has directed or choreographed main stage productions at Wagner College, Stephen’s College, and Doane
  University. He is also a judge for the internationally known Dance Organization American Dance Awards.
