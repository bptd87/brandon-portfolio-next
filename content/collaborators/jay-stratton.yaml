bio: >-
  Jay Stratton is a theatre professor at UTEP, having previously worked for 17 years as a professional actor in New York
  City. He has directed acclaimed productions at UTEP, including 'A Christmas Carol en la Frontera' and 'Bloody
  Shakespeare!', and professionally at The Monomoy Theatre and Chester Theatre Company.
