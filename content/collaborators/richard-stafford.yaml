bio: >-
  Richard Stafford is a highly accomplished theatre director, choreographer, and educator with extensive experience
  across Broadway, Off-Broadway, national tours, and regional theatre. He has choreographed for Broadway productions
  such as In My Life and Aspects of Love, and served as dance supervisor for CATS. Stafford has also directed and
  choreographed numerous regional productions at prestigious venues like the Walnut Street Theatre and North Carolina
  Theatre, and he is an educator at institutions such as NYU.
