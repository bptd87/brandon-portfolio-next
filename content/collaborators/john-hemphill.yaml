bio: >-
  John Hemphill is an accomplished actor with extensive credits in Broadway productions such as Dear Evan Hansen, School
  of Rock, and Mamma Mia!, as well as numerous film and television appearances. He serves as an Assistant Professor of
  Acting at Stephens College, holding an M.F.A. from the institution. Hemphill also has a directing credit for the
  theatre production Women Fully Clothed in Older & Hotter (2011).
