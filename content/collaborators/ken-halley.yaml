bio: >-
  Ken Halley is an actor, dancer, comedian, and musician, currently pursuing a BFA in Acting at Texas Christian
  University. He has served as President of the theatre fraternity Alpha Psi Omega and is a member of TCU’s improv team,
  Senseless Acts of Comedy. Halley is preparing to relocate to New York to further his career in performance.
