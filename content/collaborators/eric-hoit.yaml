bio: >-
  Eric Hoit is a seasoned theatre director, artistic director, writer, and mentor, primarily associated with The Great
  American Melodrama since 1980. His extensive career includes directing and choreographing numerous productions, with
  notable work at PCPA Theaterfest, Marriott Theatre, and international engagements in Australia and Uruguay. He has
  also contributed as a performer and adapted plays.
