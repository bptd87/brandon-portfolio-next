bio: >-
  Jana Robbins is a Tony, Olivier, and Drama Desk Award-winning producer, actress, and director with extensive
  experience on Broadway, Off-Broadway, and West End stages. Her notable producing credits include "Little Women,"
  "Ragtime," and "Company," while her acting career features leading roles in productions such as "Gypsy" and "Crimes of
  the Heart." She has also directed multiple theatre productions.
