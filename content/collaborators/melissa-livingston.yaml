bio: >-
  Melissa Livingston is a director, playwright, and educator, currently serving as Assistant Professor of Theater at
  Lafayette College. She holds an M.F.A. in Directing from the University of California, Irvine, and has served as
  Associate Artistic Director of Theatre SilCo. Her directing credits span regional, university, and independent
  theaters, and she co-founded a chick & a dude productions in Austin, Texas, which received multiple awards.
