bio: >-
  Richard Biever is a theatre director, music director, and educator with an MFA in Directing for the Musical Stage from
  Penn State University. He has music directed national and international tours of shows like West Side Story and Little
  Shop of Horrors, and has directed numerous productions including Assassins and Sunday in the Park with George.
  Currently, he serves as the Music Director of Musical Theatre at Baldwin Wallace University, having previously taught
  at Penn State, Wichita State, and Nazareth Universities.
