bio: >-
  Allison Watrous is the Executive Director of Education at the Denver Center for the Performing Arts, where she has
  served as an educator, actor, and director for 20 years. She is a collaborative leader and innovative teacher, having
  developed curriculum and taught at numerous institutions including The New Victory Theatre and the University of
  Denver. Her extensive directing credits include productions at the Arvada Center for the Arts and Humanities, Boulder
  Ensemble Theatre Company, and Denver School of the Arts.
