bio: >-
  Andre Rodriguez is a student designer from McAllen, Texas, currently studying interior design and theatre at Texas
  State University, with an anticipated graduation in May 2028. He is a state and nationally recognized artist, a
  scholar of the Majestic Empire Foundation, and a cohort member of the Cody Renard Richard Scholarship Program. Andre
  plans to pursue an MFA in Scene Design, aiming to become a professional theatre artist and advocate for
  underrepresented voices through his designs.
