bio: >-
  Aerik Harbert is a sound designer based out of Los Angeles by way of Pasadena, Maryland. He holds an MFA in Sound
  Design from the University of California, Irvine, and currently teaches, mentors, and designs at California State
  University, Fullerton while freelancing around the greater Los Angeles/Orange County area. His work focuses on
  crafting immersive ambiances and supplementing sound designs with original compositions.
