bio: >-
  David Davalos is a theatre director and playwright who earned his BFA in Theatre from the University of Texas at
  Austin and his MFA in Theatre from Ohio University. He has worked as an actor, director, and writer in New York City,
  with notable acting credits at the Cleveland Play House and Utah Shakespearean Festival, and directing credits at the
  University of Hartford and The Public Theatre in Lewiston, Maine.
