bio: >-
  Michael Jenkinson is a distinguished theatre director and choreographer, serving as a Resident Artist at PCPA
  Theaterfest. His extensive work includes directing and choreographing productions for renowned institutions such as
  The Old Globe, Alliance Theatre, Geva Theatre Center, and Oregon Cabaret Theatre. Notably, he has directed productions
  like "Fun Home" and "Newsies."
