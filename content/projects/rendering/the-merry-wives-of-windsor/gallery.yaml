designNotes: >-
  Rendering study for The Merry Wives of Windsor — Stephens College (2022). The images stay light on their feet,
  emphasizing entrances, open playing space, and the social bounce that keeps the comedy moving.
bodySections:
  - heading: Comic Architecture
    paragraphs:
      - >-
        The room needs enough structure to support disguise, interruption, and momentum, but it cannot become so heavy
        that it slows the comedy down. The renderings therefore privilege openness, readable entrances, and a strong
        sense of shared public space.
      - >-
        That balance helps the production keep its wit alive. The environment supports the schemes instead of competing
        with them.
  - heading: Social Energy in the Layout
    paragraphs:
      - >-
        Shakespearean farce depends on who sees whom, who slips away, and how quickly the social picture can rearrange
        itself. The renderings make that visible through circulation and sightline clarity.
      - >-
        Used this way, the images become more than mood boards. They help test how the architecture will carry comic
        rhythm once actors and audience enter the space.
