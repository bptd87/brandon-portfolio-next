designNotes: >-
  Rendering sequence for Urinetown — University of Missouri (2024). The images treat the city as a theatrical machine,
  clarifying hierarchy, circulation, and the civic pressure that keeps the satire legible.
heroExcerpt: >-
  These images treat the world of Urinetown as an urban machine: funny in its exaggeration, severe in its logic, and
  always pressing back on the people inside it.
bodySections:
  - heading: Satire Through Infrastructure
    paragraphs:
      - >-
        The images were not meant to simply look dystopian. They needed to show a world whose pipes, platforms, and
        public systems feel so omnipresent that the city itself starts acting like an authority figure.
      - >-
        That approach helps the satire stay legible. The environment is exaggerated, but it is exaggerated with purpose,
        so the audience can feel how policy, scarcity, and spectacle are all working together.
  - heading: A City That Presses Back
    paragraphs:
      - >-
        The rendering composition leans on vertical pressure, exposed structure, and a sense of circulation that is
        always being managed from above. Characters should appear contained by the same mechanisms they are trying to
        survive.
      - >-
        What matters most is that the world feels theatrical and political at the same time. The room is funny until it
        stops being funny, and the design has to live right on that edge.
