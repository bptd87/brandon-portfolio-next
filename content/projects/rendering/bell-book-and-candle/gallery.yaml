designNotes: >-
  Rendering study for Bell, Book, and Candle — Okoboji Summer Theatre (2025). The image begins with a credible
  mid-century apartment, then lets palette and atmosphere introduce just enough tonal slippage for the room to feel
  charming, intimate, and slightly uncanny.
heroExcerpt: >-
  The images stay rooted in a believable interior, but they leave enough tonal slippage for the room to feel charming,
  uncanny, and emotionally mobile all at once.
bodySections:
  - heading: A Real Room First
    paragraphs:
      - >-
        The design works best when the apartment reads as a place people genuinely occupy, not as a decorative idea
        about magic. The rendering therefore starts with domestic credibility: scale, furniture logic, and a room you
        can imagine someone moving through every day.
      - >-
        Once that realism is in place, color and atmosphere can begin doing quieter conceptual work. The supernatural
        tone arrives through nuance rather than visual announcement.
  - heading: Mood Without Overstatement
    paragraphs:
      - >-
        A green-dominant palette and carefully tuned lighting give the space a subtle otherworldliness without severing
        it from the play’s wit and intimacy.
      - >-
        The rendering set is meant to show that the room can carry both flirtation and enchantment. It should remain
        approachable even as it starts to feel a little off-center.
