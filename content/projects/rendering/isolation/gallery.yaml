images: []
designNotes: >-
  Rendering study for Isolation — (2020). The image does its work through subtraction: quiet geometry, controlled
  palette, and enough negative space to make the solitude feel deliberate rather than empty.
heroExcerpt: The rendering keeps the space intentionally restrained so the emptiness reads as design intent, not just absence.
bodySections:
  - heading: Emptiness as Composition
    paragraphs:
      - >-
        The room works by withholding rather than adding. Negative space, simple geometry, and a quiet material palette
        do most of the emotional lifting.
      - >-
        That restraint keeps the image from turning abstract. It stays legible as a place someone inhabits, even as it
        makes that inhabitation feel lonely.
  - heading: Stillness With Intent
    paragraphs:
      - >-
        The production value of this kind of image comes from control. Nothing needs to shout, but every choice has to
        reinforce the sense of distance and separation.
      - >-
        The result is a rendering that feels calm on the surface and emotionally loaded underneath, which is where the
        piece needs to live.
