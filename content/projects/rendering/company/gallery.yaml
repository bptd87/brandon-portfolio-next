designNotes: >-
  Rendering sequence for Company — University of California Irvine (2019). The images use stoops, facades, and layered
  city access to test how architecture can carry comedy, movement, and emotional distance at the same time.
heroExcerpt: >-
  The image work balances urban energy with interior distance, so the architecture can support Company’s wit while still
  holding Bobby’s isolation in plain view.
bodySections:
  - heading: Public Life, Private Distance
    paragraphs:
      - >-
        The renderings needed to support a New York that feels shared, fast, and constantly in motion while still
        allowing the central loneliness of the piece to stay visible. That tension is built through layered exterior
        access, stacked sightlines, and a city that always seems to be happening just beyond reach.
      - >-
        Rather than illustrating a single realistic apartment, the images help describe a system of social spaces that
        Bobby moves through without fully inhabiting.
  - heading: Rhythm in the Architecture
    paragraphs:
      - >-
        Stoops, fire escapes, and linked facades help the rendering operate like a musical score. The eye keeps moving,
        but the structure also keeps revealing who is connected and who is left outside that connection.
      - >-
        That is the real value of the images here: they let the production test how architecture can carry comedy,
        movement, and emotional estrangement at the same time.
