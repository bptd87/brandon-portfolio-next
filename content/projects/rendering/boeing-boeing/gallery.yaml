designNotes: >-
  Rendering study for Boeing, Boeing — Stephens College (2023). The image is organized around doors, thresholds, and a
  crisp domestic layout so the room can absorb escalating farce without ever becoming visually confusing.
heroExcerpt: >-
  The room has to read cleanly at a glance and still have enough friction in the details for the comedy to keep
  escalating without confusion.
bodySections:
  - heading: Entrances as Choreography
    paragraphs:
      - >-
        This kind of farce lives or dies on circulation, so the rendering has to make doors, thresholds, and sightlines
        feel obvious and reliable. The audience should understand the room before the first scramble begins.
      - >-
        That clarity is what makes the comic timing work. Once the geography is legible, the pace can keep getting
        faster without the set turning into visual noise.
  - heading: A Room That Can Absorb Chaos
    paragraphs:
      - >-
        The apartment needs enough polish to feel credible, but not so much preciousness that it breaks when the plot
        starts piling on complications. The design keeps the domestic setting sturdy and practical.
      - >-
        In rendering terms, the job is to show a room that can take repeated collisions of character, timing, and
        misunderstanding and still read as the same place.
