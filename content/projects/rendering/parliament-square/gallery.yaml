designNotes: >-
  Rendering study for Parliament Square — University of California Irvine (2019). The frames stay restrained and
  procedural, using negative space and institutional calm to make the pressure in the room feel harder to ignore.
heroExcerpt: >-
  These renderings treat the room as an instrument of scrutiny: public enough to feel institutional, exposed enough to
  keep every conversation unstable.
bodySections:
  - heading: A Room Under Watch
    paragraphs:
      - >-
        The visual idea was restraint rather than spectacle. Parliament Square works when the space feels official,
        intelligible, and slightly unforgiving, so the audience senses how power circulates through the room before any
        overt conflict arrives.
      - >-
        That meant keeping the architecture clean and legible while letting the image carry pressure through emptiness,
        proportion, and the suggestion of surveillance.
  - heading: How Tension Holds
    paragraphs:
      - >-
        The rendering needed to show that this is a room built for procedure but vulnerable to intrusion. Composition,
        sightlines, and negative space all help support that contradiction.
      - >-
        Instead of overexplaining the concept, the image lets the institutional calm do the work. The tension comes from
        what the room refuses to soften.
