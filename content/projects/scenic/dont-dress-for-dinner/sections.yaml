- type: text
  content:
    - >-
      A restored French farmhouse became both romantic getaway and comic trap in Don't Dress for Dinner at
      Okoboji Summer Theatre. Exposed timber beams, textured plaster, and a grounded palette created warmth,
      age, and rural charm.
    - >-
      Farce depends on clarity, so the layout prioritized clean sightlines, purposeful door placement, and
      layered depth. The timber grid became both a visual anchor and a practical structure for defining
      playing areas without crowding the stage.
    - >-
      The design needed to look inviting while supporting escalating deception. By balancing authenticity with
      precision, the farmhouse could hold the play's romantic surface and the intricate comic machinery
      underneath it.
