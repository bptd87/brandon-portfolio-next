    - hoh-prod-2
- type: text
  heading: A Modular Party
  content:
    - >-
      The set was built to feel like an immersive party. Pop Art motifs, geometric shapes, and vivid neon-inspired
      colors formed a modular world that transformed fluidly between scenes. Instead of medieval architecture, we leaned
      into a playful mashup, columns glowing in electric pinks, castle facades borrowing from record-sleeve graphics
      rather than stone.
- type: gallery
  mediaIds:
    - hoh-prod-3
    - hoh-prod-4
- type: text
  heading: Pop, Motion, and Queer Joy
  content:
    - >-
      A custom high-saturation palette amplifies the show’s irreverent tone. Shifting panels, stylized platforms, and
      dynamic projection elements let each location evolve with the characters’ emotional arcs, creating a visual rhythm
      that matches the pulse of the Go-Go’s music.
    - >-
      The design honors transformation, identity, and freedom while keeping a pop sensibility that feels fresh and
      theatrical. Whether evoking a dance floor, a throne room, or a forest of fabulous confusion, the scenic world
      keeps its eye on the core: joy, rebellion, and love in all its forms.
    - >-
      Ultimately, the set acts as a visual celebration of queerness, musical energy, and theatre’s power to transport.
      This is not nostalgia; it is momentum in full technicolor.
