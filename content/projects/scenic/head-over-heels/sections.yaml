- type: text
  content:
    - >-
      The bold, unapologetic energy of the Go-Go's shaped Head Over Heels from the beginning. Working with
      director Josh Walden at Theatre SilCo, I reimagined Arcadia through 1980s club culture and the visual
      intensity of New York's Palladium.
    - >-
      Instead of medieval architecture, the set became an immersive party: Pop Art shapes, electric color,
      modular platforms, and stylized columns glowing in saturated pinks. The world transformed fluidly
      between scenes while keeping the visual energy high.
    - >-
      The goal was to give the production a scenic language that felt joyful, queer, and in motion.
      Projection, color, and flexible architecture let each location shift with the characters while keeping
      the stage alive with pulse and play.
