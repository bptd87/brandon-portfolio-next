- type: text
  heading: Arcadia in Club Color
  content:
    - >-
      For Head Over Heels, I partnered with director Josh Walden to channel the bold, unapologetic spirit of the Go-Go’s
      and reimagine ancient Arcadia through the lens of 1980s club culture. We drew from the visual language of New
      York’s Palladium, where theatre, fashion, and music collided under pulsing lights and graphic intensity.
