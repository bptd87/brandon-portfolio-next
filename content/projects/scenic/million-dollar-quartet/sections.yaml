- type: text
  content:
    - >-
      Sun Records was the heart of Million Dollar Quartet at South Coast Repertory. The scenic design invited
      audiences into the room on the day Elvis Presley, Johnny Cash, Jerry Lee Lewis, and Carl Perkins came
      together for their legendary jam session. Working with co-scenic designer Efren Delgadillo Jr., the
      space had to balance authenticity with theatrical voltage.
    - >-
      Wood floors, period recording equipment, gold records, and control-room windows grounded the studio in
      detail. At the same time, the illuminated SUN sign let the space become both a working room and a stage
      for myth.
    - >-
      The set was designed to keep the musicians facing one another so the performance felt shared, rhythmic,
      and alive. It is not just a backdrop for songs. It is a portrait of artists listening, pushing, and
      turning a recording studio into music history.
