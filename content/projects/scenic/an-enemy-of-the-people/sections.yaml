- type: text
  content:
    - >-
      The world of An Enemy of the People needed to feel stripped down, confrontational, and a little
      unstable. At Stephens College, I held the environment in grayscale, with architecture and floor treated
      almost like a three-dimensional drawing.
    - >-
      The inspiration came from spaces where perspective feels flattened and reality becomes slightly
      uncertain. Rough line work suggested walls and structure without offering comfort, which felt right for
      a play centered on truth, public scrutiny, and civic denial.
    - >-
      The only strong color came from the red furniture. Those pieces cut through the monochrome world like
      pressure points: danger, accusation, and interruption. The minimal palette forced attention onto the
      actors while making the room feel like an argument the audience could not step away from.
