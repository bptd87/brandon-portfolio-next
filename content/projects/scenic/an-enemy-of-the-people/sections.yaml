    - enemy-prod-2
- type: text
  heading: Architecture as Exposure
  content:
    - >-
      The backdrop included rough, sketch-like line work that suggested architecture without fully rendering it. It
      wasn’t about realism. It was about exposure. In a play centered on truth and public scrutiny, I didn’t want the
      room to provide comfort.
- type: gallery
  mediaIds:
    - enemy-prod-3
    - enemy-prod-4
- type: text
  heading: Design Goal
  content:
    - >-
      The only real color in the space came from the red furniture. Those pieces punctured the monochrome world. Red
      became a visual interruption: pressure, danger, accusation. It made the actors feel like they were standing inside
      an argument.
    - >-
      The minimal palette forced focus onto performance and language. There was nowhere to hide. The environment felt
      stark, almost clinical, but still theatrical. The design wasn’t decorative. It was a frame that amplified the
      play’s themes of power, resistance, and the cost of speaking out.
