- type: text
  heading: A New York Walk-Up
  content:
    - >-
      The design for Barefoot in the Park centered on a compact New York walk-up that amplifies the play’s emotional
      temperature through scale, proximity, and verticality. Tight architectural boundaries and selective furnishing
      choices helped stage the couple’s shifting rhythms while preserving clarity for fast comic timing.
- type: gallery
  mediaIds:
    - barefoot-prod-1
    - barefoot-prod-2
- type: text
  heading: Geometry for Comedy
  content:
    - >-
      Rather than over-rendering period detail, the scenic approach prioritized playable geometry and social pressure.
      Doors, stairs, and window relationships all functioned as storytelling tools, giving actors clean pathways for
      entrances, reversals, and escalating comic friction.
- type: gallery
  mediaIds:
    - barefoot-prod-3
    - barefoot-prod-4
- type: text
  heading: A Walk-Up with Pressure
  content:
    - >-
      The apartment needed to track the movement from romantic idealism to negotiated partnership without losing the wit
      of the play. The set works less as a realistic container than as a pressure system, shaping tempo, intimacy, and
      the comic stakes of everyday domestic life.
