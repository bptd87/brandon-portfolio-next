- type: text
  content:
    - >-
      A compact New York walk-up became the pressure point for Barefoot in the Park at Okoboji Summer Theatre.
      Scale, proximity, stairs, doors, and windows all shaped the scenic design's comic rhythm and emotional
      temperature.
    - >-
      Rather than over-rendering period detail, I prioritized playable geometry. The apartment needed to
      support quick entrances, reversals, intimacy, and friction while always remaining clear to the audience.
    - >-
      The design tracks the couple's movement from romantic idealism toward negotiated partnership. It works
      less as a neutral apartment and more as a pressure system, turning everyday domestic life into a precise
      comic engine.
