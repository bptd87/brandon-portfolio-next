- type: text
  heading: Invitation Through Space
  content:
    - >-
      Tomás and the Library Lady was designed to honor storytelling as an act of invitation. The scenic approach created
      warm, readable spaces that support bilingual performance, audience access, and fluid movement between domestic
      reality and imaginative expansion.
- type: gallery
  mediaIds:
    - tomas-prod-1
    - tomas-prod-2
- type: text
  heading: Libraries as Portals
  content:
    - >-
      Library architecture and visual motifs were treated as portals rather than static background. The goal was to give
      the production a sense of discovery while maintaining clarity for young audiences, creating an environment where
      movement, language, and image could work together without overcomplicating the stage picture.
- type: gallery
  mediaIds:
    - tomas-prod-3
    - tomas-prod-4
- type: text
  heading: Design Goal
  content:
    - >-
      The design reinforces the play’s core themes of literacy, belonging, and cultural memory. Warmth and legibility
      were essential, but so was the feeling that the world could open outward into imagination at any moment. The
      environment needed to welcome the audience in, then reward that openness with theatrical discovery.
