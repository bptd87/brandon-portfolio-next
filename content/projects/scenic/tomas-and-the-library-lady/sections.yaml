- type: text
  content:
    - >-
      Storytelling as invitation shaped Tomas and the Library Lady at Lake Dillon Theatre Company. The scenic
      design needed to feel warm, readable, and accessible for young audiences while supporting bilingual
      performance and imaginative movement.
    - >-
      Library architecture and visual motifs were treated as portals rather than static background. I wanted
      the stage to suggest discovery without overcomplicating the picture, letting language, movement, and
      image work together.
    - >-
      The design reinforced the play's themes of literacy, belonging, and cultural memory. It welcomed the
      audience into a clear room, then allowed that room to open outward into imagination.
