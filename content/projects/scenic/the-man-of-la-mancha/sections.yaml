    - lamancha-prod-2
- type: text
  heading: Industrial Ritual
  content:
    - >-
      The brick walls, exposed piping, and steel stair structure weren’t decorative. They grounded the room in something
      honest and industrial. At the center of the stage, a circular pattern scored into the floor created a playing
      arena that felt part ritual space and part proving ground. The musicians lived inside the environment rather than
      outside it, reinforcing the sense that this world was being made in real time.
- type: gallery
  mediaIds:
    - lamancha-prod-3
    - lamancha-prod-4
- type: text
  heading: Imagination Against the Real
  content:
    - >-
      Upstage, a windmill traced out of industrial pipe was never meant to feel literal. It worked more like an idea
      projected onto reality, the image of Quixote rather than an object itself. Distressed textures, modular crates,
      and repurposed materials let transformation come from performance and light rather than scene changes. The set
      didn’t illustrate fantasy; it asked the audience to create it with us.
- type: gallery
  mediaIds:
