- type: text
  heading: A World Built in Front of Us
  content:
    - >-
      For The Man of La Mancha at Lake Dillon Theatre Company, I didn’t want to build a picturesque Spain. The director
      and I talked early about the story living inside a warehouse, a space where actors could assemble the world in
      front of us. That idea shaped everything, making the environment feel raw, performative, and always on the edge of
      transformation.
