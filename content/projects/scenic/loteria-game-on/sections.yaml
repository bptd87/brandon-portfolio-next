- type: text
  content:
    - >-
      LOTERIA: GAME ON! began in the intimacy of a basement and expanded into the heightened logic of a game
      board. The scenic design needed to support family, ritual, competition, and transformation without
      losing clarity.
    - >-
      I treated the scenic world as something that could shift through play. Graphic forms, color, projection
      surfaces, and flexible architecture allowed the production to move between domestic storytelling and the
      larger visual language of Loteria.
    - >-
      The goal was to make the stage feel activated by memory and imagination. As the game took over, the
      environment could become more theatrical, letting cards, symbols, and family history occupy the same
      visual space.
