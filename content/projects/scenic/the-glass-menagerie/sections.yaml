- type: text
  heading: Design Goal
  content:
    - >-
      A key visual component was the memory wall, a collage of framed images depicting fragments of Tom and Laura's
      past. These images were intentionally vague, grayed photographs with subtle noise and muted color, designed to
      feel incomplete and unreliable. Rather than illustrating specific moments, they functioned as emotional echoes,
      reinforcing the idea that memory is selective, fragile, and shaped by longing.
    - >-
      Throughout the process, the design remained focused on supporting the actors and the text. The space was built to
      breathe, allowing lighting, movement, and performance to activate it. The production photographs reveal how the
      design held different scales of intimacy: close domestic exchanges, larger ensemble compositions, and moments
      where the architecture itself seemed to recede into memory. The world was never meant to be fully solid; it was
      meant to hold pressure and tenderness at the same time.
