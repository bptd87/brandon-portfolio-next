- type: text
  heading: Memory as Space
  content:
    - >-
      This production of The Glass Menagerie was grounded in the idea of the memory play, not as a literal
      reconstruction of the Wingfield apartment, but as a fluid, impressionistic landscape shaped by Tom's recollection.
      From the outset, the design sought to feel unstable and permeable, allowing memory to drift, overlap, and distort
      rather than lock the play into a fixed domestic realism.
