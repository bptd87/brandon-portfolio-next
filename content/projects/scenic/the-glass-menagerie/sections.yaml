- type: text
  heading: Platform and Threshold
  content:
    - >-
      The central scenic gesture was a large, elevated interior platform that defined the apartment's primary playing
      space. This platform functioned both practically and metaphorically: it created a clear home base for the action
      while reinforcing Tom's sense of entrapment within the last place he ever called home. The elevation subtly
      separated the family from the surrounding world, heightening the emotional pressure of scenes that unfold there.
    - >-
      Surrounding the platform, I developed a series of loosely defined architectural structures, brick fragments,
      doorways, and thresholds that suggested environment without enclosing it. These elements allowed actors to move
      freely through the space, supporting the play's fluid shifts between interior and exterior, past and present. The
      lack of complete walls was intentional; nothing in this world is fully contained.
- type: gallery
  mediaIds:
