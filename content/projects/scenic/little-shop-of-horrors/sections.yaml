- type: text
  content:
    - >-
      Little Shop of Horrors is funny, but I did not want the design to lean only into camp. At Okoboji Summer
      Theatre, Skid Row began as a worn urban storefront with brick, aging trim, patched surfaces, and
      practical doors so the stakes could feel real.
    - >-
      The flower shop sat inside a slightly compressed proscenium frame, giving Seymour's world a boxed-in
      quality before Audrey II made it dangerous. A gritty, desaturated palette let the plant and costumes
      carry contrast while keeping the environment honest.
    - >-
      The design supported the musical's humor by making the world believable first. That pressure made the
      plant's growth feel more invasive, turning a small shop into a space where desire, desperation, and
      horror could keep tightening.
