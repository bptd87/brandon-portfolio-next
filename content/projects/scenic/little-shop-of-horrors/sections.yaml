- type: text
  heading: A Grounded Skid Row
  content:
    - >-
      For Little Shop of Horrors at Okoboji Summer Theatre, I didn't want to lean into camp. The script is funny, but
      the stakes are real. The design was grounded in a worn, urban storefront that felt structurally honest: brick,
      aging trim, patched surfaces, and practical doors that made the space believable.
- type: gallery
  mediaIds:
    - little-shop-prod-1
    - little-shop-prod-2
- type: text
  heading: Pressure Inside the Shop
  content:
    - >-
      The flower shop sat inside a slightly compressed proscenium frame, giving the environment a boxed-in quality. That
      pressure mattered. Seymour's world needed to feel small before Audrey II made it feel dangerous. The palette
      stayed gritty and desaturated so the plant and costumes could carry visual contrast while the realism gave the
      horror weight.
- type: gallery
  mediaIds:
    - little-shop-prod-3
    - little-shop-prod-4
- type: text
  heading: Design Goal
  content:
    - >-
      Details were specific: layered brick texture, working windows, period signage, and practical counters that allowed
      choreography to move cleanly through the shop. The goal wasn't nostalgia for a 1960s musical. It was tension. As
      the plant grew, the environment didn't become bigger. It became more claustrophobic.
