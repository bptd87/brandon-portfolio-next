- type: text
  heading: Compressing the Proscenium
  content:
    - >-
      For Last Train to Nibroc, scale was the first problem to solve. The script is intimate. The proscenium was not. I
      built a smaller, textured frame inside the larger architecture using reclaimed Kentucky barn wood, immediately
      compressing the stage into a world that felt personal rather than theatrical.
- type: gallery
  mediaIds:
