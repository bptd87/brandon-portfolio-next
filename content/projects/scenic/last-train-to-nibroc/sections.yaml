    - nibroc-prod-2
- type: text
  heading: Warmth, Sightlines, and Quiet Tension
  content:
    - >-
      The stage was raked slightly to focus sightlines and give the environment a gentle push forward. It added subtle
      tension without feeling stylized. The barn wood brought warmth and history into the room, something grounded and
      honest that reflected the play's rural setting and emotional vulnerability.
- type: gallery
  mediaIds:
    - nibroc-prod-3
    - nibroc-prod-4
- type: text
  heading: Design Goal
  content:
    - >-
      A 30-foot backdrop carried the journey between locations, allowing transitions to remain fluid without breaking
      the rhythm of the characters' conversations. This design wasn't about spectacle. It was about proximity. The
      architecture supported stillness, and the materials carried nostalgia without becoming sentimental.
