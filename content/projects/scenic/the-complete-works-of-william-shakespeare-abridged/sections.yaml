- type: text
  heading: A Modular World for Comic Velocity
  content:
    - >-
      For The Complete Works of William Shakespeare (abridged) at Okoboji Summer Theatre, the scenic design embraced the
      playful and irreverent spirit of the show. The set was conceived as a modular comic machine, able to pivot quickly
      through Shakespeare's iconic works without slowing the production's momentum or flattening its theatrical humor.
- type: gallery
  mediaIds:
