- type: text
  content:
    - >-
      Speed drove the scenic design for The Complete Works of William Shakespeare (abridged) at Okoboji Summer
      Theatre. The set became a modular comic machine that could pivot quickly through Shakespeare's worlds
      without slowing the actors down.
    - >-
      Because the piece shifts constantly in style, reference, and performance mode, the environment
      prioritized flexibility and legibility. Bold visual elements and clear staging zones gave the performers
      room for physical comedy and improvisational energy.
    - >-
      The goal was not to illustrate every play literally. It was to provide a scenic structure that could
      absorb chaos, parody, and theatrical invention while keeping the audience oriented and the comedy
      moving.
