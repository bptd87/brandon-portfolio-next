- type: text
  heading: A Ritual Rather Than a Reconstruction
  content:
    - >-
      When I first read Xiomara Cornejo’s Romero, I knew the design had to hold more than history; it had to hold
      ghosts. Set in the final hours of Archbishop Óscar Romero’s life, the play bends time and invites the dead to
      speak. It is not realism. It is ritual.
- type: gallery
  mediaIds:
