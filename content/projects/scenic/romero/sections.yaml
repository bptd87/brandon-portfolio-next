    - rom-prod-2
- type: text
  heading: Sacredness and Rupture
  content:
    - >-
      The scenic world emerged from the tension between sacredness and rupture. At the center stood a cruciform arch,
      part cathedral and part memory portal. Below it, a fractured platform and a textured black floor marked with
      five-point stars anchored the action in both earth and spirit.
    - >-
      The play’s nonlinear structure demanded a space that could shift between a beach, a church, a war zone, and the
      afterlife without literal transitions. Projection surfaces echoed the altar at Hospital de la Divina Providencia,
      while lighting and media traced the line between past and present.
- type: gallery
  mediaIds:
    - rom-prod-3
    - rom-prod-4
- type: text
  heading: Design Goal
  content:
    - >-
      Puppeteer Lil Lamberta’s masks and oversized figures punctured realism, while Cherie Sampson’s layered projections
      grounded each moment in living memory. The entire design was built to support rupture, allowing sudden shifts in
      tone, time, and identity while still holding the audience.
    - >-
      This was not a play about one man. It was about a nation in spiritual reckoning. Designing Romero meant listening,
      holding space, and letting the silence speak.
