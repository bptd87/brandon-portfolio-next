- type: text
  heading: A Town Built for Gathering
  content:
    - >-
      The design needed to balance festive spectacle with the intimacy of a small-town celebration. Rather than
      overwhelm the story with decoration, the goal was to create a setting that felt welcoming and communal, allowing
      the production's music, choreography, and seasonal sentiment to emerge inside a world of believable Christmas
      cheer.
- type: gallery
  mediaIds:
