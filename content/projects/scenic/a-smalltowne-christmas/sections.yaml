- type: text
  heading: Holiday Warmth and Small-Town Memory
  content:
    - >-
      A Smalltowne Christmas was designed to capture the charm of a community gathering around shared holiday
      traditions. The scenic world leaned into familiarity, warmth, and seasonal texture, creating an environment where
      nostalgia and performance could live side by side without losing theatrical clarity.
