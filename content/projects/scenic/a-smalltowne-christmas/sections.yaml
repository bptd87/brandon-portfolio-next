- type: text
  content:
    - >-
      A Smalltowne Christmas was built around the feeling of a community gathering for shared holiday
      traditions. The scenic design leaned into warmth, seasonal texture, and small-town familiarity, creating
      a world that felt welcoming without becoming overly decorative.
    - >-
      The challenge was balancing festive spectacle with the intimacy of a local celebration. I wanted the
      environment to support music, choreography, and nostalgia while still leaving room for the performers to
      define the heart of the evening.
    - >-
      Rather than treating Christmas as surface decoration, the design used recognizable holiday details to
      create a sense of place. The result was a scenic world that felt communal, bright, and theatrical, but
      still grounded in the emotional simplicity of people coming together.
