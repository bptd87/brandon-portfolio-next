- type: text
  heading: A Penthouse as Emotional Armor
  content:
    - >-
      For Rich Girl at Okoboji Summer Theatre, the scenic design centered on a contemporary Manhattan penthouse that
      visually embodied privilege, polish, and emotional distance. The environment drew from high-end real estate
      staging and luxury interior publications: sleek lines, controlled color, and carefully selected furnishings that
      suggested generational wealth without clutter.
- type: gallery
  mediaIds:
    - rich-girl-prod-1
    - rich-girl-prod-2
- type: text
  heading: Scale, Exposure, and Detail
  content:
    - >-
      The architecture emphasized openness and scale, allowing the actors to move through a space that felt expansive
      yet psychologically exposed. Large window framing implied skyline views, reinforcing the urban setting and social
      status of the characters. A faux palm tree, later replaced by a Christmas tree, became a subtle marker of Eve's
      cultivated taste and the passage of time.
- type: gallery
  mediaIds:
    - rich-girl-prod-3
    - rich-girl-prod-4
- type: text
  heading: Wealth, Distance, and Exposure
  content:
    - >-
      Minimalism became a dramaturgical tool. The restraint of the set contrasted with the emotionally charged
      relationships unfolding within it. The result was a scenic design that balanced refinement with vulnerability, an
      elegant architectural shell that amplified the fractures beneath its glossy surface.
