- type: text
  content:
    - >-
      A contemporary Manhattan penthouse shaped Rich Girl around privilege, polish, and emotional distance. At
      Okoboji Summer Theatre, the scenic design drew from luxury interiors and high-end real estate staging,
      using restraint to suggest wealth without clutter.
    - >-
      Open architecture, large window framing, sleek lines, and carefully selected furnishings gave the actors
      a space that felt expansive but exposed. A faux palm tree, later replaced by a Christmas tree, quietly
      marked taste, season, and time.
    - >-
      Minimalism became part of the dramaturgy. The penthouse looked controlled, but that control created
      distance around the relationships, letting emotional volatility play against a room designed to appear
      effortless.
