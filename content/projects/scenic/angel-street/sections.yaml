- type: text
  content:
    - >-
      A Victorian drawing room can be beautiful and threatening at the same time. That tension shaped Angel
      Street at Okoboji Summer Theatre, where domestic polish, period detail, and psychological control needed
      to exist in the same frame.
    - >-
      Wainscoting, decorative trim, a functional staircase, period furniture, and practical lighting
      established a formal interior shaped by observation. As the story tightened, the same details that made
      the room believable also reinforced a growing sense of confinement.
    - >-
      The design supported the performers by keeping the world stable while power and perception shifted
      inside it. The drawing room became an active container for the play's tension, where order,
      manipulation, and fear could sit in plain sight.
