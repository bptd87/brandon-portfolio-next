- type: text
  content:
    - >-
      Green Day's raw energy pushed the American Idiot scenic design toward a world of suburban monotony,
      urban decay, and post-9/11 disconnection. On the Claire Trevor Theatre stage at UC Irvine, I wanted the
      environment to feel unyielding, like a concrete landscape the characters were fighting to survive.
    - >-
      A pedestrian bridge in Irvine became the starting image. Its concrete forms and institutional permanence
      suggested a Southern California version of alienation, one that felt familiar, public, and emotionally
      suffocating.
    - >-
      Rather than leaning on the Broadway production's heavy media wall, we built a more immersive frame where
      projection could move through the architecture. The result was a minimalist scenic world with enough
      resistance for the music, movement, and rebellion to hit harder.
