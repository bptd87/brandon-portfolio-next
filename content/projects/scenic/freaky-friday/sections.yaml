- type: text
  heading: Transformation in Motion
  content:
    - >-
      Freaky Friday required a scenic system capable of fast identity shifts, tonal contrast, and high-energy ensemble
      flow. The design strategy emphasized modular zones and legible transitions so the audience could instantly read
      changing contexts while performers maintained pace through musical numbers and dialogue scenes.
- type: gallery
  mediaIds:
    - freaky-prod-1
    - freaky-prod-2
- type: text
  heading: Zones for Comedy and Pace
  content:
    - >-
      The visual language was built around contemporary domestic and school-world cues, with flexible units supporting
      both intimacy and spectacle. Scenic logic had to stay clear even as the show bounced between emotional sincerity,
      comic confusion, and ensemble-driven momentum.
- type: gallery
  mediaIds:
    - freaky-prod-3
    - freaky-prod-4
- type: text
  heading: A Stage That Can Switch on Cue
  content:
    - >-
      The modular layout keeps the story moving fast, letting each location read instantly even as identities and
      emotional stakes flip underneath it.
    - >-
      That agility gives the production room for comic chaos without losing the family relationships at the center of
      the show.
