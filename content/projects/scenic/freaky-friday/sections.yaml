- type: text
  content:
    - >-
      Freaky Friday required a scenic system that could handle fast identity shifts, tonal changes, and
      high-energy ensemble movement. The design emphasized modular zones and clear transitions so the audience
      could read each location instantly.
    - >-
      Contemporary domestic and school-world cues gave the production recognizable anchors, while flexible
      units supported both intimate family scenes and larger musical moments. The scenic logic had to stay
      simple even as the story became more chaotic.
    - >-
      That agility was the point. The design gave the production room for comic confusion, quick location
      changes, and emotional sincerity without losing the relationships at the center of the show.
