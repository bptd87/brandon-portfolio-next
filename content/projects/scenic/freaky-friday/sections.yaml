    - freaky-prod-2
- type: text
  heading: Zones for Comedy and Pace
  content:
    - >-
      The visual language was built around contemporary domestic and school-world cues, with flexible units supporting
      both intimacy and spectacle. Scenic logic had to stay clear even as the show bounced between emotional sincerity,
      comic confusion, and ensemble-driven momentum.
- type: gallery
  mediaIds:
    - freaky-prod-3
    - freaky-prod-4
- type: text
  heading: Design Goal
  content:
    - >-
      The set was tuned for transformation: spaces had to feel stable enough for character stakes while remaining agile
      enough for the show’s body-swap mechanics. Rather than locking scenes into realism, the design focused on clarity,
      speed, and contrast so each shift could land instantly.
