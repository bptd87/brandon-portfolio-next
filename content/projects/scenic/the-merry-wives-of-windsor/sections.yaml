- type: text
  heading: A Shakespeare Sitcom
  content:
    - >-
      The Merry Wives of Windsor was approached through the lens of a campy 1950s sitcom. Rather than treating Windsor
      as a purely historical townscape, the design leaned into bright theatrical framing, heightened perspective, and a
      comic visual language that could support quick reversals, overheard schemes, and the playful energy of the
      production.
- type: gallery
  mediaIds:
    - wives-prod-1
    - wives-prod-2
- type: text
  heading: Color, Portals, and Transitions
  content:
    - >-
      A central green wall with a circular portal created the primary visual anchor of the set, giving actors a clean,
      memorable entrance point at center while reinforcing the graphic, stylized tone of the world. To help the show
      feel more cinematic, each scene was marked by a different brightly colored door that could fly in, turning
      transitions into part of the theatrical joke rather than something to hide.
    - >-
      Those flown doors gave each location its own comic identity while keeping the stage open and flexible. The effect
      was playful and crisp: scenes could shift quickly, rhythms could stay alive, and the visual world kept reinforcing
      the sitcom energy of the production.
- type: gallery
  mediaIds:
    - wives-prod-3
    - wives-prod-4
- type: text
  heading: Design Goal
  content:
    - >-
      The goal was to make the production feel nimble, campy, and audience-facing without losing the mechanics of
      Shakespeare’s comedy. Scenic composition had to support eavesdropping, concealment, and surprise, but it also
      needed to deliver a bold visual joke the moment a new scene arrived.
    - >-
      By combining the flown color doors, the central portal wall, and a heightened 1950s perspective, the set created a
      world that felt theatrical, witty, and immediately legible. The comedy could move fast, and the design moved with
      it.
