- type: text
  heading: A School Gym with Stakes
  content:
    - >-
      For The 25th Annual Putnam County Spelling Bee at Stephens College, the scenic design transformed the stage into a
      recognizable middle school gymnasium, functional, slightly outdated, and brimming with community pride. The
      architecture leaned into wood-paneled walls, acoustic panels, mounted basketball hoops, and practical overhead
      fixtures to evoke the institutional tone of a multipurpose school space.
- type: gallery
  mediaIds:
    - spelling-prod-1
    - spelling-prod-2
- type: text
  heading: Ceremony and Sincerity
  content:
    - >-
      The composition centered on a raised platform framed by a bold competition banner, allowing the spelling bee to
      feel both ceremonial and modest. A recessed upstage area created depth while providing flexible staging for
      musical numbers and ensemble moments. Chairs, tables, and sponsor signage reinforced the local, volunteer-driven
      atmosphere of the event.
- type: gallery
  mediaIds:
    - spelling-prod-3
    - spelling-prod-4
- type: text
  heading: Design Goal
  content:
    - >-
      Material choices were intentionally straightforward: durable finishes, painted surfaces, and clear graphic
      elements that echoed the sincerity of a school environment. This grounded realism provided contrast to the
      musical’s vibrant costumes and emotional arcs.
    - >-
      The scenic design supported fast transitions and character-driven comedy while maintaining a cohesive visual
      world, nostalgic, playful, and rooted in everyday Americana.
- type: gallery
  mediaIds:
