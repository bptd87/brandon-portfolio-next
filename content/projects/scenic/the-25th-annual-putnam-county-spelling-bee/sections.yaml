- type: text
  content:
    - >-
      A recognizable middle school gym gave The 25th Annual Putnam County Spelling Bee its world at Stephens
      College. The scenic design needed to feel functional, slightly outdated, and full of community pride.
    - >-
      Wood-paneled walls, acoustic panels, basketball hoops, practical fixtures, and sponsor signage gave the
      room an institutional familiarity. A raised platform and bold competition banner made the spelling bee
      feel both ceremonial and modest.
    - >-
      The design needed to hold comedy and vulnerability in the same space. By grounding the event in a
      believable school environment, the production could let the characters' anxieties, ambitions, and small
      acts of bravery feel immediate.
