- type: text
  content:
    - >-
      The Marvelous Wonderettes: Dream On is set at a reunion, but the design was really about time. At
      Okoboji Summer Theatre, I built the world around a recognizable high school gym stage with wood
      paneling, risers, school signage, and mid-century basketball backboards.
    - >-
      The structure stayed the same between acts. What changed was tone. Act One leaned into early 1960s
      polish with tinsel, clean lines, and a crescent motif that made the performers feel almost like a
      televised variety act.
    - >-
      By Act Two, the space loosened into warmer color, balloon arches, and deeper saturation. The gym aged
      with the characters, allowing nostalgia to become active rather than decorative.
