- type: text
  heading: A Gym as a Memory Container
  content:
    - >-
      For The Marvelous Wonderettes: Dream On at Okoboji Summer Theatre, the setting is a reunion, but it is really
      about time. The design was built around a recognizable high school gym stage: wood paneling, risers, school
      signage, and those rectangular basketball backboards that immediately signal mid-century Americana.
- type: gallery
  mediaIds:
    - wonderettes-prod-1
    - wonderettes-prod-2
- type: text
  heading: The Structure Stayed, the Tone Shifted
  content:
    - >-
      The structure did not change between acts. The gym stayed the gym. What changed was tone. Act One leaned into the
      early 1960s with clean lines, controlled color, and a polished reunion atmosphere framed by tinsel and a crescent
      motif that made the performers feel almost like a televised variety act.
    - >-
      By Act Two, the space loosened. The palette warmed, balloon arches appeared, and the lighting embraced deeper
      saturation. The 1970s energy felt more personal and less formal, allowing the environment to age with the
      characters without needing a complete scenic transformation.
- type: gallery
  mediaIds:
    - wonderettes-prod-3
    - wonderettes-prod-4
- type: text
  heading: Nostalgia with a Pulse
  content:
    - >-
      I was not interested in parodying the decades. The goal was for the audience to recognize the space immediately
      and then feel it evolve. The gym became a container for memory, structured, familiar, and slowly shifting as the
      Wonderettes revisited who they were and who they became.
