- type: text
  content:
    - >-
      Precision was the first rule for Dial M for Murder at Okoboji Summer Theatre. The play is about control:
      who has it, who loses it, and how long the illusion lasts, so Tony and Margot's apartment needed to look
      composed, almost curated.
    - >-
      Clean architectural lines, paneled walls, balanced bookcases, and a centered fireplace created a sense
      of order. Around that order, darkness became pressure, isolating the apartment and making the room feel
      suspended and exposed.
    - >-
      The floor plan was built around suspense. Doors, thresholds, furniture, and sightlines all supported the
      mechanics of the plot: who can see, who can hear, who can hide, and who is trapped inside someone else's
      plan.
