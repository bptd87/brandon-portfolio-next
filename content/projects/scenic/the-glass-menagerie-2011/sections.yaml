- type: text
  content:
    - >-
      Memory shaped the Wingfield apartment in the 2011 Okoboji Summer Theatre production of The Glass
      Menagerie. The space needed to feel present enough for the family drama to land, but unstable enough to
      carry longing, distance, and recollection.
    - >-
      Memory-inspired scrim walls made the apartment feel enclosed and permeable at the same time. As
      sightlines shifted, the city beyond could appear through the architecture, extending the family's
      emotional world rather than acting as a simple backdrop.
    - >-
      The goal was to support Tennessee Williams' fragile emotional architecture with a setting that could
      hold nostalgia, pressure, intimacy, and escape. The environment stayed playable for domestic scenes
      while remaining haunted by everything outside the room.
