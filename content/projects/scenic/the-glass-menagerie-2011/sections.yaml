- type: text
  heading: A Memory Space for Longing and Escape
  content:
    - >-
      This production of The Glass Menagerie was designed as a world shaped by memory rather than strict realism. The
      domestic environment needed to feel present enough for the family drama to land, but also unstable enough to
      suggest the emotional filtering of recollection, longing, and distance.
- type: gallery
  mediaIds:
    - glass-2011-prod-1
    - glass-2011-prod-2
- type: text
  heading: Scrim Walls and the City Beyond
  content:
    - >-
      Memory-inspired scrim walls allowed the apartment to feel both enclosed and permeable. As sightlines shifted, the
      city beyond could emerge through the scenic architecture, reinforcing the play's tension between confinement and
      escape. That revealed urban layer extended the emotional world of the family rather than acting as a simple
      background image.
- type: gallery
  mediaIds:
    - glass-2011-prod-3
    - glass-2011-prod-4
- type: text
  heading: Design Goal
  content:
    - >-
      The goal was to support Tennessee Williams' fragile emotional architecture with a setting that felt haunted by
      memory but still playable for intimate domestic scenes. The environment needed to hold nostalgia, pressure, and
      the desire to leave, allowing the scenic world to echo the play's central tension without overwhelming it.
