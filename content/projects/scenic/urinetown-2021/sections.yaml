- type: text
  heading: Brecht and Expressionism as Musical Satire
  content:
    - >-
      This 2021 production of Urinetown was built around the collision of theatrical satire and authoritarian
      architecture. The design drew from Brechtian staging and German Expressionist distortion, creating a world of
      angular forms, hard textures, and visible theatricality that could support both the show's comedy and its
      political edge.
- type: gallery
  mediaIds:
    - urinetown-2021-prod-1
    - urinetown-2021-prod-2
- type: text
  heading: Concrete, Symbol, and Social Pressure
  content:
    - >-
      Concrete textures and exaggerated structural rhythms helped make the city feel oppressive without pinning the
      production to literal realism. The environment needed to function as a symbolic civic machine, one where
      authority, scarcity, and public control could all be felt spatially, while still leaving enough openness for
      movement, choreography, and comic address.
- type: gallery
  mediaIds:
    - urinetown-2021-prod-3
    - urinetown-2021-prod-4
- type: text
  heading: Satire That Still Feels Close
  content:
    - >-
      The goal was to create a stage world that sharpened the musical's dystopian absurdity while giving performers a
      strong graphic environment to play against. By combining angular composition, raw surfaces, and symbolic lighting,
      the set reinforced the production's satirical critique without flattening its humor or musical vitality.
