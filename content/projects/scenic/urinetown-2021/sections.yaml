- type: text
  content:
    - >-
      The 2021 Okoboji Summer Theatre production of Urinetown was built around the collision of theatrical
      satire and authoritarian architecture. Brechtian staging and German Expressionist distortion shaped a
      world of angular forms, hard textures, and visible theatricality.
    - >-
      Concrete textures and exaggerated structural rhythms made the city feel oppressive without pinning it to
      literal realism. The environment functioned as a symbolic civic machine where scarcity, authority, and
      public control could be felt spatially.
    - >-
      The goal was to sharpen the musical's dystopian absurdity while giving performers a strong graphic world
      to play against. The design stayed open enough for movement and comic address, but hard enough to keep
      the politics present.
