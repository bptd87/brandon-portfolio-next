- type: text
  heading: A Memory Space for Penelope and the Maids
  content:
    - >-
      The Penelopiad was conceived as a layered memory space where testimony, ritual, and counter-narrative could
      coexist. Rather than locating the story in a literal reconstruction of ancient Greece, the design framed the stage
      as a world of witness, one where Penelope and the maids could occupy the same visual architecture while speaking
      from different positions of power.
- type: gallery
  mediaIds:
    - penelopiad-prod-1
    - penelopiad-prod-2
- type: text
  heading: Chorus Visibility and Flexible Geometry
  content:
    - >-
      A central concern was chorus visibility. The scenic composition needed to support group presence without
      flattening the action, so the environment used open geometry and layered playing levels that could expand into
      epic framing or compress into intimate address. That flexibility allowed the production to move fluidly between
      narrative distance and emotional immediacy.
- type: gallery
  mediaIds:
    - penelopiad-prod-3
    - penelopiad-prod-4
- type: text
  heading: Design Goal
  content:
    - >-
      Material language balanced austerity with symbolic texture, supporting the work's interrogation of authorship,
      gendered history, and inherited myth. The set functioned as both container and witness, giving Penelope and the
      maids equal visual authority inside the same world while maintaining theatrical tension across the evening.
