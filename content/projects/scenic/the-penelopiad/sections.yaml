- type: text
  content:
    - >-
      The Penelopiad became a layered memory space where testimony, ritual, and counter-narrative could
      coexist. At UC Irvine, the scenic design avoided reconstructing ancient Greece and instead framed the
      stage as a world of witness.
    - >-
      A major concern was chorus visibility. The composition needed to support group presence without
      flattening the action, so open geometry and layered levels allowed the world to expand into epic framing
      or compress into intimate address.
    - >-
      The material language balanced austerity with symbolic texture. The design gave Penelope and the maids a
      shared architecture while making the imbalance of power, authorship, and inherited myth visible.
