- type: text
  content:
    - >-
      The Pajama Game needed a world that could move as fast as the score. At UC Irvine, bold signage and
      shifting factory elements framed the Sleep-Tite Pajama Factory, giving the stage a clear graphic
      identity and room for dance.
    - >-
      The story balances romance with a labor dispute, so the world had to support both pleasure and pressure.
      Repeating structures, workplace signage, and a vibrant period palette suggested postwar optimism while
      keeping the conflict over wages visible.
    - >-
      A modular approach allowed quick transformations from intimate encounters to full-ensemble numbers. The
      result was a scenic world that felt playful and pointed, period-specific and theatrical at the same
      time.
