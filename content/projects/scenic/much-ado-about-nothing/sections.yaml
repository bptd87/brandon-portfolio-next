- type: text
  content:
    - >-
      A Western lens opened up Much Ado About Nothing for New Swan Shakespeare Festival. The scenic design
      needed the social openness of a frontier town and the theatrical precision to support banter,
      eavesdropping, and public performance.
    - >-
      Saloon architecture, warm wood, and frontier texture gave the stage a recognizable vocabulary without
      locking it into strict realism. The design used porches, platforms, and thresholds to create places for
      watching and being watched.
    - >-
      That mattered for a play built on overheard conversations and shifting reputations. The scenic world
      gave the comedy a physical arena where wit, pride, romance, and mischief could all happen in full view.
