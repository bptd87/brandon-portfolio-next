- type: text
  heading: Shakespeare Through a Western Lens
  content:
    - >-
      This Wild West–inspired production of Much Ado About Nothing, directed by Eli Simon, reimagined Shakespeare’s
      comedy through the lens of the spaghetti western. The design embraced the grit and romance of the American
      frontier while staying flexible enough to work within New Swan’s repertory conditions.
- type: gallery
  mediaIds:
    - man-prod-1
    - man-prod-2
- type: text
  heading: Saloon Architecture and Frontier Texture
  content:
    - >-
      The primary backdrop was a saloon interior, with red wallpaper created using a hand-painted roller to achieve an
      authentic period texture. At the center stood a bar built from rough wood slabs and barrels, complete with
      swinging saloon doors, giving the stage a clear focal point that could be quickly struck or reconfigured as the
      story moved.
    - >-
      Antique signage, weathered finishes, and layered frontier details grounded the world in both history and cinematic
      influence. The environment needed to hold wit, pursuit, deception, and music without becoming overbuilt, so each
      scenic element had to do multiple jobs at once.
- type: gallery
  mediaIds:
    - man-prod-3
    - man-prod-4
- type: text
  heading: Design Goal
  content:
    - >-
      By merging Shakespeare’s battles of love and misunderstanding with the visual language of western cinema, the
      design aimed to create a world that felt playful, textured, and theatrically legible. The saloon backdrop, bar,
      and signage invited the audience into a dust-filled landscape of gamblers, gunfighters, and lovers while still
      leaving space for performance to lead.
- type: gallery
  mediaIds:
    - man-prod-5
