    - vanya-prod-2
- type: text
  heading: Warmth, Detail, and Generational Weight
  content:
    - >-
      The architecture leaned into traditional American detailing: warm wood tones, practical molding, and grounded
      proportions that suggested generational stability. A garden bench constructed from scrap lumber introduced a
      subtle handmade quality, underscoring the lived-in authenticity of the home and the play's quiet relationship to
      nostalgia.
- type: gallery
  mediaIds:
    - vanya-prod-3
    - vanya-prod-4
- type: text
  heading: Comedy Inside a Fading House
  content:
    - >-
      Spatially, the design allowed for layered staging. Intimate conversations near the porch edge contrasted with
      broader ensemble moments in the shared living area. The environment held comedic energy without becoming
      caricature, instead providing a restrained, elegant frame that let Christopher Durang's humor and emotional
      undercurrents unfold naturally.
