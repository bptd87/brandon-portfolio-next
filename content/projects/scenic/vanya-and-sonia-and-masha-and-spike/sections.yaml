- type: text
  heading: A Porch as Sanctuary and Constraint
  content:
    - >-
      For Vanya and Sonia and Masha and Spike at Stephens College, the scenic design drew from the architectural charm
      of a Bucks County country home, comfortable, rooted, and steeped in familiarity. The porch became the visual and
      dramaturgical anchor of the space, operating as both an extension of the interior and a threshold to the outside
      world.
- type: gallery
  mediaIds:
