- type: text
  content:
    - >-
      A circular stone path cutting through the stage anchored Parliament Square at UC Irvine. That image gave
      the scenic design a sense of repetition and ritual, echoing cycles of social struggle and Kat's movement
      toward her final act of protest.
    - >-
      Concrete, fractured surfaces, and a cold gray palette stripped comfort from the room. The environment
      felt public and isolating at the same time, pressing political action against private despair.
    - >-
      By keeping the design minimal, the stage could hold a meditative rhythm with a sharp edge. The stone
      circle, decayed textures, and empty space became more than backdrop; they gave sacrifice, resilience,
      and institutional pressure a physical form.
