- type: text
  heading: Midwestern Winter Vernacular
  content:
    - >-
      Material and texture choices were built around Midwestern winter vernacular, with surfaces suggesting wear,
      weather, and local history rather than caricature. The design needed to feel specific to place and season while
      still supporting the comic energy of the piece.
- type: gallery
  mediaIds:
    - goi-prod-3
    - goi-prod-4
- type: text
  heading: Design Goal
  content:
    - >-
      The larger goal was to ground the humor in a recognizable world. By keeping the environment legible and specific,
      the production could hold both the exaggerated rhythms of musical comedy and the quieter emotional texture of
      friendship, ritual, and community.
