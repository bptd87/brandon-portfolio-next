- type: text
  heading: A Frozen-Lake Playing Space
  content:
    - >-
      For Guys on Ice, the scenic design focused on creating a playable frozen-lake environment that could support both
      broad comedy and moments of quiet sincerity. The composition balances a strong horizon line and open negative
      space with practical ice-fishing architecture so performers can move cleanly while the audience always reads
      relationship dynamics.
