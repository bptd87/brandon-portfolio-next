- type: text
  content:
    - >-
      A frozen lake can be empty, funny, lonely, and familiar all at once. For Guys on Ice at The Great
      American Melodrama, the scenic design focused on a playable winter environment that could hold broad
      comedy and quiet sincerity at the same time.
    - >-
      Material choices came from Midwestern winter vernacular: worn surfaces, weathered texture, and the
      feeling of local history rather than caricature. The lake needed to feel recognizable as a place where
      ritual and friendship could live.
    - >-
      Grounding the humor in a believable world allowed the production to carry more than jokes. The scenic
      design supported musical comedy, community, and the small emotional truths that sit underneath the
      ice-fishing routine.
