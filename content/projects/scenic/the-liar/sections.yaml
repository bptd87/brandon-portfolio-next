- type: text
  heading: Classical Elegance with Comic Lift
  content:
    - >-
      The Liar was approached as a classical comedy with enough visual elegance to support heightened language, but
      enough playfulness to keep the world active and theatrical. The scenic environment balanced refinement with
      exaggeration, giving the production a setting that could hold both period wit and farcical momentum.
- type: gallery
  mediaIds:
    - liar-prod-1
    - liar-prod-2
- type: text
  heading: A World for Wit and Deception
  content:
    - >-
      Because the play thrives on mistaken identity, verbal agility, and social performance, the design needed to feel
      orderly at first glance while still leaving room for comic disruption. Bold accents and carefully framed
      architecture helped make the environment feel lively rather than museum-like, allowing the comedy to stay buoyant
      and clear.
- type: gallery
  mediaIds:
    - liar-prod-3
    - liar-prod-4
- type: text
  heading: Design Goal
  content:
    - >-
      The goal was to create a setting that honored the classical source while giving the adaptation its own theatrical
      snap. The world needed to feel polished, quick, and welcoming to the audience, supporting the play's wit and charm
      without losing the precision that makes the farce land.
- type: gallery
  mediaIds:
    - liar-prod-5
