- type: text
  content:
    - >-
      The Liar needed a world with elegance, speed, and theatrical lift. At Okoboji Summer Theatre, the scenic
      design balanced classical refinement with enough playfulness to keep the adaptation active and buoyant.
    - >-
      Because the play thrives on mistaken identity, verbal agility, and social performance, the environment
      had to feel orderly at first glance while leaving room for disruption. Bold accents and framed
      architecture helped the setting feel alive rather than museum-like.
    - >-
      The design honored the classical source while giving the production its own snap. It created a polished,
      welcoming world where wit, charm, deception, and comic momentum could move clearly.
