- type: text
  content:
    - >-
      The Birling home in An Inspector Calls had to look composed before it could begin to fracture. At
      Okoboji Summer Theatre, the scenic design projected wealth, order, and social confidence while quietly
      setting up the pressure that the inspector's questions would expose.
    - >-
      Furniture placement, entrances, and sightlines were calibrated around interrogation. The space had to
      support drawing-room realism while gradually feeling less like a protected home and more like a room
      built for accountability.
    - >-
      Period detail was used with restraint so composition could carry the tension. I wanted the audience to
      recognize the comfort of the household, then watch that comfort become part of the trap.
