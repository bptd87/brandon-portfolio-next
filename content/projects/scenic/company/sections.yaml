- type: text
  content:
    - >-
      Company grew out of my own observations of New York: pale exterior walls, layers of old trim, fire
      escapes, stoops, and buildings that felt inhabited by lives just out of reach. At UC Irvine, that sense
      of exterior life became the heart of the scenic design.
    - >-
      Two coupled buildings framed one side of the stage, linked like partnership, while a lone red-brick
      building stood apart to reflect Bobby's solitude. Ladders, stairs, and fire escapes created both
      physical movement and emotional distance.
    - >-
      Backlit windows in purples, pinks, and blues suggested private lives behind the architecture. By
      treating New York as a landscape of longing, the scenic design gave Bobby's isolation a physical shape
      without closing the city down.
