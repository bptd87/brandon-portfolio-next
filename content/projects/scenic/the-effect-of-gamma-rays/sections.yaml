- type: text
  content:
    - >-
      Deterioration, repair, and memory shaped The Effect of Gamma Rays on Man-in-the-Moon Marigolds at
      Okoboji Summer Theatre. Faded yellow wallpaper, sun bleaching, stains, and exposed newspaper layers
      suggested a home worn down by time and strain.
    - >-
      The walls carried a brittle quality through curling edges, uneven seams, and tonal shifts that caught
      the light uneasily. Reclaimed dock lumber from Lake Okoboji added physical authenticity and contrasted
      with the fragile interior surfaces.
    - >-
      Together, distressed paper and weathered timber created a space that felt structurally present and
      emotionally unraveling. The environment gave the characters a world marked by damage, but not without
      endurance.
