- type: text
  content:
    - >-
      I wanted Cole to feel like stepping into a late-night 1920s room: not a museum version of the jazz age,
      but something alive. At Okoboji Summer Theatre, the scenic design centered on a black-and-white tile
      floor, walnut millwork, and a grounded bar that gave the room architectural weight.
    - >-
      The bar defined more than atmosphere. It shaped social hierarchy, created levels for performance, and
      added depth across the proscenium. Keeping the band onstage made the music feel sourced from the room
      rather than placed on top of it.
    - >-
      The layout stayed open enough for choreography and microphone work to breathe, while vertical art deco
      references gave the stage elegance and structure. The design relied on proportion, texture, and
      intention rather than decoration.
