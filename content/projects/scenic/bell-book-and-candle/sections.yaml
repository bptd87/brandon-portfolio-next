- type: text
  content:
    - >-
      Realism was the anchor for Bell, Book and Candle at Okoboji Summer Theatre. Gillian's apartment needed
      to feel fully lived-in and emotionally specific, a room where the characters could behave naturally
      while the play's quiet magic remained just under the surface.
    - >-
      Built-in bookshelves, practical doors, defined wall planes, and carefully placed furniture gave the room
      permanence and weight. The green walls brought warmth and personality without pushing the world into
      overt stylization.
    - >-
      The goal was to let wit, romance, and enchantment emerge from a believable domestic environment. By
      keeping the room human and functional first, the scenic design allowed the supernatural elements to feel
      more intimate.
