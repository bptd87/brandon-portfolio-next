- type: text
  heading: A Room Built for Realism
  content:
    - >-
      The scenic design for Bell, Book and Candle, directed by Richard Biever, was rooted in realism. The goal was to
      create a fully realized apartment interior that felt lived-in, functional, and emotionally specific, an
      environment where the characters could exist naturally and the performances could carry the theatrical weight.
- type: gallery
  mediaIds:
    - bbc-prod-1
    - bbc-prod-2
- type: text
  heading: Domestic Scale and Subtle Magic
  content:
    - >-
      The space was conceived as a complete room rather than a suggestion of one. Built-in bookshelves, practical doors,
      and defined wall planes established permanence and weight, while furniture placement supported blocking and
      sightlines without sacrificing the rhythms of everyday life.
    - >-
      Color shaped the atmosphere in quieter ways. The decision to use green walls gave the apartment warmth and
      personality without pushing it into stylization. That palette helped the set hold the play’s familiar wit and
      slight enchantment at the same time, keeping the world grounded while letting the supernatural elements live just
      beneath the surface.
- type: gallery
  mediaIds:
    - bbc-prod-3
    - bbc-prod-4
- type: text
  heading: Design Goal
  content:
    - >-
      Textures and finishes reinforced the realism of the room. Wood flooring, soft furnishings, framed artwork, and
      practical lighting helped the environment feel curated but not precious. The apartment suggested history and
      routine, allowing the magical undertones of the story to emerge through action and performance rather than through
      overt scenic effects.
    - >-
      Ultimately, the design aimed to disappear into the storytelling. By committing fully to realism, the set created a
      stable world in which humor, relationships, and subtle enchantment could unfold organically.
