- type: text
  heading: A Paris Apartment Built for Farce
  content:
    - >-
      For Boeing, Boeing, I leaned fully into midcentury modernism to evoke the stylish, high-stakes world of Marc
      Camoletti’s French farce. A sleek 1960s Paris apartment, defined by clean geometry, rich wood, warm neutrals, and
      bold accents, became an active comic partner rather than a passive backdrop.
- type: gallery
  mediaIds:
