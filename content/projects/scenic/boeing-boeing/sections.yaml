- type: text
  content:
    - >-
      Midcentury modernism gave Boeing, Boeing the right kind of comic confidence. At Stephens College,
      Bernard's Paris apartment needed to look stylish, controlled, and ready to collapse into farce.
    - >-
      Clean geometry, warm wood, blonde brick, bold accents, and an orange Sputnik chandelier established
      Bernard's curated world. The cobalt-blue front door became a visual and rhythmic focal point as
      entrances, exits, and near-misses drove the play.
    - >-
      The apartment was built around six doors, each placed to support timing and choreography. Every angle
      had to look intentional while functioning with farcical precision, letting the room become an active
      partner in the comedy.
