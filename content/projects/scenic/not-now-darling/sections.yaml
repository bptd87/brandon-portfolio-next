- type: text
  heading: A Boutique Built for Farce
  content:
    - >-
      For Not Now, Darling at Okoboji Summer Theatre, the scenic design centered on a polished British boutique interior
      engineered for comic confusion. The world needed to feel elegant enough to support the play's upper-crust veneer,
      but also clear and nimble enough to sustain the speed, hiding, and rapid reversals that farce demands.
