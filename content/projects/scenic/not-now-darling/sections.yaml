- type: text
  content:
    - >-
      A polished British boutique became the comic engine for Not Now, Darling at Okoboji Summer Theatre. The
      room needed to look elegant enough for the play's upper-crust veneer while functioning with the
      precision required for hiding, reversals, and speed.
    - >-
      The palette leaned into controlled, Wes Anderson-inspired color relationships. That polish sharpened the
      heightened comedy while keeping the retail setting specific and visually legible.
    - >-
      Doors and thresholds were the real engine of the design. The boutique looked refined on the surface, but
      underneath it behaved like a comic machine, built for entrances, near-misses, and escalating confusion.
