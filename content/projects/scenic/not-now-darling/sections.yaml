- type: text
  heading: Color, Precision, and Timing
  content:
    - >-
      The palette leaned into Wes Anderson-inspired color relationships, using controlled contrast and visual polish to
      sharpen the heightened comedy without losing the setting's retail specificity. Doors and thresholds remained
      essential compositional devices, giving actors the clean entrances, exits, and near-misses that make this kind of
      comedy feel effortless when it is actually tightly engineered.
    - >-
      The design goal was to create a world that looked refined on the surface while functioning like a comic machine
      underneath. That balance between elegance and precision gave the production a lively visual rhythm and supported
      the play's escalating misunderstandings with architectural clarity.
