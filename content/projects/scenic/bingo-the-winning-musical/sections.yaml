- type: text
  heading: Okoboji Through a Playful Lens
  content:
    - >-
      For Bingo: The Winning Musical at Okoboji Summer Theatre, the scenic design pulled from the spirit of the Okoboji
      Lakes region rather than treating the world as a generic community-hall comedy. Nautical motifs, cheerful color,
      and a polished sense of playful charm helped the production feel rooted in place while still serving the
      heightened rhythm of musical theatre.
- type: gallery
  mediaIds:
