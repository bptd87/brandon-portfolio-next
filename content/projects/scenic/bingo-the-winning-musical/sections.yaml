- type: text
  heading: Camp, Community, and Pace
  content:
    - >-
      The goal was to support the show's lively pace with a world that was bright, legible, and theatrically generous.
      The design needed enough specificity to evoke the character of the region, but enough clarity and openness to keep
      musical storytelling moving cleanly. That balance between local flavor and compositional simplicity gave the
      production its buoyant comic energy.
