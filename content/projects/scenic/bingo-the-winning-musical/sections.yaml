- type: text
  content:
    - >-
      The Okoboji Lakes region gave Bingo: The Winning Musical its scenic identity. Instead of treating the
      piece as a generic community-hall comedy, I pulled from nautical motifs, cheerful color, and polished
      local charm to root the world in place.
    - >-
      The production needed a bright, legible environment that could support the pace of musical theatre. I
      wanted enough regional specificity for the setting to feel personal, but enough openness for the
      staging, music, and comedy to move easily.
    - >-
      That balance gave the show its scenic identity: playful, buoyant, and community-centered. The design
      became a welcoming frame for a story about friendship, ritual, and the shared joy of gathering around a
      game.
