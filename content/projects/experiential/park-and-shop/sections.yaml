- heading: One Project, Two Asset Types
  paragraphs:
    - >-
      Park & Shop is exactly the kind of work that benefits from a unified project structure. The renderings communicate
      brand tone and customer-facing organization, while the drafting clarifies dimensions, layouts, and fabrication
      logic.
    - >-
      Keeping those assets together makes the portfolio easier to read because the project no longer has to be mentally
      reassembled across separate category pages.
- heading: From Approval to Coordination
  paragraphs:
    - >-
      Renderings support presentation and approval. Technical drawings support execution, coordination, and handoff. The
      strength of the project is the relationship between those layers, not either one in isolation.
    - >-
      That is why the new experiential pages should behave more like articles or scenic project pages, with narrative
      first and categorized media supporting the story underneath.
