- heading: Designed for Scale
  paragraphs:
    - >-
      The project is organized around visibility and audience movement at event scale. The renderings establish spatial
      hierarchy early, giving stakeholders a readable view of how branded elements, circulation, and focal moments fit
      together.
    - >-
      That early clarity matters for approvals because large-format activations need to communicate quickly to both
      creative teams and production partners.
- heading: From Visualization to Experience
  paragraphs:
    - >-
      Live imagery completes the story by showing the work in actual venue conditions. Instead of treating renderings
      and event photos as separate portfolio buckets, the page frames them as parts of the same production arc.
    - >-
      That project-by-project structure makes the experiential work read more like a design case study, which is the
      right lens for clients comparing concept intent with built outcome.
