- heading: Recording Existing Conditions
  paragraphs:
    - >-
      This project centers on clarity of information. Venue documentation supports downstream planning by turning
      existing conditions into something teams can actually work from.
    - >-
      The value of the page comes from pairing that documentation with a concise explanation of what the material is for
      and how it supports production decisions.
- heading: Editorial Framing for Technical Work
  paragraphs:
    - >-
      Grouped inside an article-like project page, the drawings read as part of a process rather than as isolated
      technical artifacts.
    - >-
      That framing aligns the experiential portfolio with the rest of the site, where projects are presented as complete
      stories supported by images, text, and navigation structure.
