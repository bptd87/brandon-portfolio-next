- heading: Concept and Delivery
  paragraphs:
    - >-
      This project is presented as a full experiential case study rather than a single category sample. The visual work
      supports both internal alignment and outward-facing communication, showing how a campaign concept reads before and
      during rollout.
    - >-
      Bringing the rendering and live material together makes the project easier to read as a complete design package:
      one thread of thinking carried from early visualization through public-facing execution.
- heading: Why the Pairing Matters
  paragraphs:
    - >-
      Concept imagery establishes tone, hierarchy, and branded presence. Live documentation shows how those decisions
      hold up once the work meets schedule, audience flow, and production conditions.
    - >-
      Seen together, the assets function less like isolated images and more like an editorial record of how the idea was
      framed, approved, and ultimately experienced.
