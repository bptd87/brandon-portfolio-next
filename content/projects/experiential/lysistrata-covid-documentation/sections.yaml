- heading: Documentation Under Constraint
  paragraphs:
    - >-
      This work is rooted in technical clarity. The drawings serve as communication tools for changing requirements,
      helping teams track layout decisions and production needs in a period where planning conditions were unusually
      fluid.
    - >-
      Framed as a project page, the documentation can carry context and intent rather than appearing as an isolated
      sheet set.
- heading: Why It Belongs Here
  paragraphs:
    - >-
      Technical drawing samples deserve the same editorial framing as rendering or scenic work. The design value is not
      just in the sheet itself, but in the problem it helps a team solve.
    - >-
      Presenting this as a project makes that problem-solving role legible to clients who need coordination, not just
      images.
