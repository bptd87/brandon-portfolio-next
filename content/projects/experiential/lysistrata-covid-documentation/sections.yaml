- heading: Outdoor Theatre Under Constraint
  paragraphs:
    - >-
      Outdoor scenic design for UTEP's first Department of Theatre and Dance production during the COVID pandemic.
    - >-
      The courtyard setting became part of the design problem. The architecture, sunlight, audience movement, and
      pandemic-era planning constraints all shaped how the world of the production could be imagined, drawn, and
      communicated.
- heading: Rendering, Walkthrough, Documentation
  paragraphs:
    - >-
      Renderings and walkthrough video for the Fox Fine Arts courtyard as a performance environment.
    - >-
      The COVID documentation still matters because it records the coordination layer behind the scenic idea. It is
      not separate from the design; it is part of how the design survived the conditions of that production moment.
