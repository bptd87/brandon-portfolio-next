- heading: Merchandising and Movement
  paragraphs:
    - >-
      The renderings are organized around circulation, product visibility, and the relationship between display
      structure and customer movement.
    - >-
      That makes the work especially suited to an editorial project page, where the portfolio can speak to both
      atmosphere and retail logic at the same time.
- heading: Why This Lives as a Project
  paragraphs:
    - >-
      Experiential work like this is clearer when it is grouped by project rather than split into generic gallery
      categories. The design intent, visual language, and stakeholder use case stay connected in one place.
    - >-
      That shift helps the page read more like the rest of the site: a designed story with supporting media, not a
      bucket of disconnected assets.
