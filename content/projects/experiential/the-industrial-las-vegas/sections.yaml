- heading: Walkthrough Documentation
  paragraphs:
    - >-
      The project is presented through two walkthrough videos of The Industrial, an event space in Las Vegas. The videos
      document the venue as a spatial experience rather than a still portfolio object.
    - >-
      Because this came through my work with Adaptive Design Services, the page keeps the credit and context clear while
      letting the walkthroughs carry the project visually.
- heading: Venue Experience
  paragraphs:
    - >-
      The value of the walkthrough format is movement: scale, circulation, lighting, and transitions are easier to
      understand when the viewer can move through the room.
    - >-
      For an experiential portfolio, that makes the project a useful counterpoint to rendering and drafting work because
      it shows how the space reads as a guest-facing environment.
