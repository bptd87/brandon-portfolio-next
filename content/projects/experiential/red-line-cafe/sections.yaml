- heading: Interior Atmosphere
  paragraphs:
    - >-
      This project is framed around how rendering can communicate tone as clearly as layout. The imagery focuses on
      atmosphere, customer orientation, and the way brand character is held inside an everyday hospitality space.
    - >-
      That makes the page function less like a gallery dump and more like a concise editorial presentation of what the
      design is trying to achieve.
- heading: Visualization as Alignment
  paragraphs:
    - >-
      The renderings work as approval tools, helping teams read seating zones, branded millwork, and circulation before
      fabrication or fit-out decisions move forward.
    - >-
      Presented as a project page, the material can carry explanation alongside imagery, which is exactly what the
      current experiential portfolio has been missing.
