learning_objectives:
  - 'Understand the three main symbol types: 2D symbols, 3D symbols, and hybrid symbols'
  - Create symbols from existing geometry using Modify > Create Symbol or Ctrl+K shortcut
  - Differentiate between unit-based symbols and page-based symbols and their appropriate uses
  - Scale symbol instances using the Object Info Palette without affecting the symbol definition
  - Edit symbol definitions to make global changes across all instances
  - Work with grouped symbols that automatically convert to groups upon placement
key_concepts:
  - title: 2D SYMBOL
    content: >-
      A symbol containing only 2D geometry, indicated by a '2' in the Resource Manager. Used for plan views, elevations,
      and 2D documentation elements.
  - title: HYBRID SYMBOL
    content: >-
      A symbol containing both 2D and 3D components, allowing it to display appropriately in both plan views and 3D
      perspectives.
  - title: UNIT-BASED SYMBOL
    content: >-
      A symbol that scales according to world units (inches, feet, meters). The default type for design layer work,
      maintaining consistent real-world dimensions.
  - title: PAGE-BASED SYMBOL
    content: >-
      A symbol that scales according to page scale rather than world units. Indicated by green text in the Resource
      Manager. Used primarily for documentation elements on sheet layers.
  - title: GROUPED SYMBOL
    content: >-
      A symbol that automatically converts from a symbol to a group when placed in the document. Indicated by blue text
      in the Resource Manager. Each instance is independent.
  - title: SYMBOL INSTANCE
    content: >-
      A placed occurrence of a symbol in the document. Can be scaled independently without affecting the symbol
      definition or other instances.
pro_tips:
  - Use Ctrl+K (Control+K) as a quick shortcut to create symbols instead of navigating to Modify > Create Symbol
  - >-
    Check the Resource Manager color coding: black for standard symbols, blue for grouped symbols, green for page-based
    symbols
  - >-
    When scaling symbols, use the Object Info Palette's symmetric/asymmetric options rather than dragging handles to
    maintain precise control
  - >-
    Duplicate a symbol instance before editing its definition to compare before/after changes and ensure the edit
    produces the desired result
  - >-
    Use 'Next Mouse Click' insertion point option when creating symbols to specify custom insertion points for better
    placement control
  - >-
    Create page-based symbols for title blocks, drawing labels, and other documentation elements that should maintain
    consistent print size
  - >-
    Edit symbol definitions (double-click) when you want changes to affect all instances; edit individual instances only
    for grouped symbols
  - Use the Resource Manager to organize symbols into folders by type, project, or discipline for easier navigation
  - Leave the instance in place when creating a symbol to avoid having to re-place it immediately after creation
  - Remember that scaling a symbol instance scales the entire symbol, not the geometry inside the definition
shortcuts:
  - keys: Ctrl+K
    action: Create symbol from selected objects
  - keys: Double-click
    action: Edit symbol definition
  - keys: Right-click
    action: Access symbol editing options
common_pitfalls:
  - >-
    Attempting to scale symbols by dragging handles instead of using the Object Info Palette, which triggers a warning
    dialog
  - >-
    Confusing symbol instance scaling with symbol definition editing—scaling an instance doesn't change the original
    geometry
  - Using unit-based symbols on sheet layers or page-based symbols on design layers, causing unexpected scaling behavior
  - Forgetting that grouped symbols (blue text) create independent groups, so editing one doesn't affect others
  - Placing page-based symbols on design layers where they appear oversized due to scale mismatch
  - Not organizing symbols into folders in the Resource Manager, making them difficult to find in large projects
transcript:
  - text: >-
      Hello, this is Brandon PT Davis, theatrical scenic designer. In this Vectorworks tutorial, we're going to discuss
      symbols. A symbol gives the Vectorworks user the ability to save 2D and 3D objects.
    time: '0:04'
  - text: >-
      In the Resource Manager, you can also access a library of symbols that come standard with the Vectorworks
      software. In Vectorworks, there are three main types of symbols: 2D symbols, 3D symbols, and hybrid symbols. A
      hybrid symbol contains both a 2D and a 3D component. In this tutorial, we're going to talk specifically about 2D
      symbols.
    time: '0:22'
  - text: >-
      Currently in the Resource Manager, I have created three symbols. Each symbol is a two-by-two rectangle with a
      one-by-one rectangle in the center. Note that each of these symbols has a '2' in the bottom-right corner,
      indicating that it is a 2D symbol.
    time: '0:53'
  - text: >-
      I'm going to place the first symbol, 2D Square 1, into the document. By looking in the Object Info Palette, you
      can see that this is labeled as a 2D symbol. The class is currently set to None, on Layer 1, on the Layer Plane.
      The symbol's name is 2D Square 1, and its units are world-based.
    time: '1:22'
  - text: >-
      If I try to drag the handles, a pop-up will appear asking if I'm sure I want to scale the symbol instance. I'm
      going to press No. I'm doing this to illustrate that modifying a 2D symbol cannot be done from the outside. To
      adjust a 2D symbol, you can either right-click or double-click to edit the symbol.
    time: '1:56'
  - text: >-
      Before editing the symbol, I'm going to duplicate it. Now we have two identical 2D Square 1 symbols. If I
      double-click and edit the 2D component, I can modify the component by changing the color, shape, or line weight.
      I'm going to change the inner fill to a yellow square. When I exit, both symbols now have yellow squares.
    time: '2:24'
  - text: >-
      Looking at our two identical symbols named 2D Square 1, I'm going to demonstrate scaling from the Object Info
      Palette. Here, the scaling can be set to symmetric or asymmetric. In this case, I'm going to set it to symmetric
      and scale the symbol by a factor of two. You'll notice that the symbol is now twice as large.
    time: '3:02'
  - text: >-
      Using the tape measure, the scaled symbol measures four inches by four inches, while the unscaled symbol measures
      two inches by two inches. If we double-click and edit the symbol component, we'll see that the original component
      is still two inches by two inches. Scaling a symbol from the Object Info Palette scales the symbol instance
      itself, not the geometry inside the symbol definition.
    time: '3:46'
  - text: >-
      The next symbol we're going to talk about is 2D Square 2. Note that this symbol appears in blue. When a symbol
      name is blue, this indicates that it is a grouped symbol. When added to the document, it automatically converts
      from a symbol into a group. Here is the first 2D Square 1 symbol—in the Object Info Palette, it is labeled as a 2D
      symbol. Now, selecting 2D Square 2, the Object Info Palette shows that it is simply a group.
    time: '4:23'
  - text: >-
      If I place two of these next to each other, we now have two groups, and neither are symbols. If I go inside one
      group and modify the inner square to a red color, it does not affect the second group.
    time: '4:56'
  - text: >-
      The third symbol we're going to look at is 2D Square 3. Note that 2D Square 3 appears in green. A green symbol
      name indicates that it is a page-based symbol. The first two symbols we looked at—the 2D symbol and the grouped
      symbol—are unit-based. A page-based symbol means that the scale of the symbol responds to the page scale rather
      than world units.
    time: '5:22'
  - text: >-
      When dropping a page-based symbol into the design layer, it appears quite large. When accessing a page-based
      symbol on the sheet layer, the symbol appears at its intended size of two inches by two inches. Page-based symbols
      are generally created for documentation on the sheet layer.
    time: '6:00'
  - text: >-
      To create a symbol, first select the objects you want to turn into a symbol, then go to Modify > Create Symbol.
      You can also create a symbol using the shortcut Control + K. When the Create Symbol dialog appears, the first
      thing you need to do is name the symbol. I'm going to name this symbol Circle.
    time: '6:33'
  - text: >-
      Next, choose the insertion point: center, plan projection center, or next mouse click. Next mouse click allows you
      to specify a custom insertion point. Next, select the units: page-based or world-based. World-based units are
      typically used in the design workspace.
    time: '7:02'
  - text: >-
      Story-aware and insert-in-wall options are common in architectural practice and are not covered in this tutorial.
      Other options include leaving the instance in place after creating the symbol, changing the object from Layer
      Plane to Screen Plane, and converting to a group. We discussed converting to a group earlier in this video.
    time: '7:28'
  - text: >-
      I'm going to press OK. The destination folder will be the current document. I'll press OK again. Now I've created
      a symbol. If we look in the Resource Manager, we can see the new 2D symbol. This concludes our Vectorworks
      tutorial on symbols. If you have any questions, please ask. Thank you.
    time: '8:00'
