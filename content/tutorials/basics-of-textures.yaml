overview: >-
  This tutorial introduces Renderworks textures in Vectorworks, covering how to apply pre-made textures, adjust mapping
  types, edit texture parameters, and create custom textures from scratch. You'll learn the differences between OpenGL
  and Renderworks rendering modes, understand texture shaders (color, reflectivity, transparency, bump), and master the
  controls for scaling, rotating, and mapping textures onto 3D objects. The tutorial demonstrates practical workflows
  for wood, stone, glass, and marble textures, showing how to achieve realistic results through proper texture
  configuration and lighting.


  **Note:** In current versions of Vectorworks, OpenGL rendering mode has been renamed to "Shaded." The concepts and
  workflows remain the same.
description: Learn how to apply, edit, and create custom Renderworks textures to bring life to your 3D models in Vectorworks.
