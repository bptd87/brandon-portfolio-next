overview: >-
  This tutorial demonstrates the professional workflow for converting 3D models into production-ready 2D construction
  drawings. You'll learn how to create viewports from hybrid symbols, adjust rendering modes (wireframe, hidden line,
  custom Renderworks) for optimal linework, create section viewports with proper cut lines, generate detail viewports at
  larger scales, adjust line weights for clarity, add dimensions and annotations, organize drawings on sheet layers, and
  publish final PDFs. This workflow is essential for scenic designers who need to communicate 3D designs to carpenters
  and builders through clear, dimensioned construction documents.
description: >-
  Master the complete workflow for generating professional construction drawings from 3D models, including viewports,
  sections, details, and dimensioning.
