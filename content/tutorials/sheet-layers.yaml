learning_objectives:
  - Understand the difference between design layers and sheet layers
  - Create and manage sheet layers for print documentation
  - Add and configure title blocks and borders
  - Create viewports from design layer content
  - Control viewport scales and drawing labels
  - Organize multiple viewports on a single sheet
key_concepts:
  - title: SHEET LAYER
    content: >-
      A layer within Vectorworks used to lay out pages for printing, similar to a physical sheet of paper where you
      arrange your drawings. Sheet layers are the final output format for documentation.
  - title: VIEWPORT
    content: >-
      A window into a design layer that displays specific content on a sheet layer, allowing you to show the same
      drawing at different scales or views. Viewports link design content to print layouts.
  - title: TITLE BLOCK
    content: >-
      A standardized border and information area on a sheet that contains project details, sheet numbers, drawing
      titles, and other documentation metadata. Title blocks provide consistent documentation formatting.
  - title: CROP
    content: >-
      A rectangle that defines which portion of a design layer will be visible in a viewport, allowing you to isolate
      specific drawings or details. Crops control what content appears in each viewport.
  - title: DRAWING LABEL
    content: >-
      Text that identifies a viewport with a drawing number and title, automatically linked to the viewport properties
      for easy updates. Drawing labels maintain consistency across documentation.
  - title: SCALE
    content: >-
      The ratio between the size of the drawing on the sheet and the actual size of the object, such as 1/2" = 1'-0" for
      architectural drawings. Proper scale control ensures accurate documentation.
pro_tips:
  - >-
    Name your viewports descriptively (e.g., 'Wall Front', 'Plan View') in the Object Info palette to easily identify
    them in complex drawing packages.
  - Use the keyboard shortcut Ctrl/Cmd + ' (apostrophe) to quickly create a viewport from a selected crop rectangle.
  - >-
    Sheet layer numbers and titles automatically populate in title blocks through the Title Block Manager - no manual
    text editing needed.
  - >-
    Keep your design layers organized and clean since viewports directly reference that content - changes in design
    layers instantly update on sheets.
  - >-
    Create a standard template with pre-configured sheet layers and title blocks to maintain consistency across all your
    projects.
  - Use the Navigation palette to quickly switch between sheet layers and see all viewports associated with each sheet.
  - >-
    Set viewport scales in the Object Info palette for precise control over how your drawings appear at different sizes
    on the same sheet.
shortcuts:
  - keys: Ctrl/Cmd + '
    action: Create Viewport
    description: Quickly create a viewport from a selected crop rectangle
  - keys: Fit to Page
    action: Zoom to Sheet
    description: View the entire sheet layer in the viewport (use zoom icons)
common_pitfalls:
  - Forgetting to create a crop rectangle before making a viewport - the crop defines what content will be visible.
  - Not naming viewports descriptively, making it difficult to identify them later in complex drawing sets.
  - Manually editing title block text instead of using the sheet layer properties, which breaks automatic updates.
  - Creating viewports at incorrect scales and not checking the Object Info palette scale settings.
  - Placing too many viewports on a single sheet, making the documentation cluttered and hard to read.
