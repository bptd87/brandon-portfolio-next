overview: >-
  This tutorial covers the essential workflow for creating professional print documentation in Vectorworks using sheet
  layers. You'll learn how to set up sheet layers as virtual pages, create viewports that reference your design layer
  content, add title blocks and borders, and manage drawing scales. By the end of this tutorial, you'll understand how
  to organize multiple drawings on a single sheet and create a complete drawing package ready for printing or PDF
  export.


  Sheet layers are fundamental to professional documentation workflow, allowing you to present your design work in a
  standardized format with proper title blocks, drawing numbers, and scales. This tutorial demonstrates the complete
  process from creating a blank sheet to populating it with multiple viewports at different scales.
description: >-
  Learn how to use sheet layers for laying out pages for printing, including creating viewports, adding title blocks,
  and managing drawing scales for professional documentation.
