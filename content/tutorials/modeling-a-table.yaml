overview: >-
  This comprehensive tutorial demonstrates a professional workflow for modeling complex furniture objects in
  Vectorworks. You'll learn how to use reference images effectively, scale them to real-world dimensions, draft accurate
  2D profiles, create swept geometry for curved legs, use solid modeling operations (add solid, edit solid), apply and
  map textures correctly, and convert the final model into a hybrid symbol with clean 2D and 3D representations. This
  tutorial is essential for scenic designers who need to model custom furniture, props, or set pieces with realistic
  detail and efficient workflow practices.
description: >-
