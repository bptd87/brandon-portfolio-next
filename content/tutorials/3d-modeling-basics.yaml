overview: >-
  This comprehensive tutorial introduces essential 3D modeling operations in Vectorworks, covering nine fundamental
  techniques that form the foundation of scenic design modeling. You'll learn how to create 3D geometry from 2D shapes
  using Extrude, combine multiple solids using Add/Subtract/Intersect operations, create complex forms with Section
  Solids, build stepped profiles with Multiple Extrude, generate tapered shapes, create rotational forms with Sweep, and
  apply profiles along custom paths with Extrude Along Path. The tutorial demonstrates practical applications for each
  technique, including creating walls, moldings, organic forms, and architectural details. You'll also learn essential
  concepts like working with the Z-plane, understanding object stacking order, managing profile centerlines, and using
  the Split tool on 3D objects. This tutorial provides the complete toolkit needed to begin creating professional 3D
  scenic elements in Vectorworks.
