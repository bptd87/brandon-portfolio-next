overview: >-
  This comprehensive tutorial covers the complete annotation and dimensioning workflow in Vectorworks, from creating
  viewports on sheet layers to publishing final PDF documents. You'll learn how to create viewports from design layer
  content, add drawing labels with custom styles, dimension drawings using constrained linear and chain dimensioning
  modes, add section elevation markers that reference other drawings, create callouts for material specifications, and
  generate detail viewports at larger scales for intricate elements like molding profiles. The tutorial demonstrates
  professional sheet layout techniques including grid snapping, viewport alignment, and maintaining clean dimension
  lines. You'll also learn how to publish your completed sheets to PDF with proper export settings, creating a complete
  documentation workflow from design layer to final deliverable.
description: >-
  Master the complete workflow for creating viewports, dimensioning drawings, adding drawing labels, section markers,
  callouts, detail viewports, and publishing to PDF.
