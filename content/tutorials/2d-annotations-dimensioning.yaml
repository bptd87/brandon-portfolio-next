learning_objectives:
  - Create viewports from design layer content using the Create Viewport command with custom crops
  - Add and customize drawing labels with sheet numbers, drawing numbers, titles, and scale information
  - Dimension drawings using constrained linear and constrained chain dimensioning modes
  - Add section elevation markers that reference other drawings on the sheet with proper numbering
  - Create detail viewports at larger scales to show intricate elements like molding profiles
  - Use callouts to label materials and specifications on drawings
  - Lay out multiple viewports on a sheet using grid snap for professional alignment
  - Publish completed sheets to PDF with proper export settings and folder organization
key_concepts:
  - title: VIEWPORT
    content: >-
      A window into design layer content that displays on a sheet layer. Viewports can be cropped, scaled, and annotated
      independently without affecting the source geometry.
  - title: DRAWING LABEL
    content: >-
      A standardized title block element that displays drawing number, sheet number, title, and scale. Can be customized
      with different styles and label length modes (Fixed or Control Point).
  - title: CONSTRAINED LINEAR DIMENSION
    content: >-
      A dimension tool that constrains measurements to horizontal or vertical directions only. Essential for
      architectural and scenic design documentation.
  - title: CONSTRAINED CHAIN MODE
    content: >-
      A dimensioning mode that allows continuous dimensioning after the first dimension is placed, enabling efficient
      string dimensioning without restarting the tool.
  - title: SECTION ELEVATION MARKER
    content: >-
      A reference marker that indicates where a section or elevation is taken from and which drawing number it
      references. Includes sheet number and drawing number.
  - title: DETAIL VIEWPORT
    content: >-
      A viewport created from a circular or rectangular crop at a larger scale than the parent drawing. Used to show
      intricate details like molding profiles, connections, or hardware.
  - title: ANNOTATION VIEWPORT
    content: >-
      The editing mode for adding dimensions, callouts, and notes to a viewport. Annotations are scale-aware and display
      correctly at the viewport's scale.
  - title: GRID SNAP
    content: >-
      A layout tool that snaps objects to a regular grid pattern (e.g., half-inch by half-inch) for precise alignment
      and professional sheet organization.
pro_tips:
  - >-
    Name viewports with sheet number + drawing number + brief description (e.g., '1.1 Wall Plan') for easy
    identification
  - Turn on Grid Snap and set it to half-inch by half-inch for professional viewport alignment on sheet layers
  - Use Control Point label length mode instead of Fixed to adjust drawing label width to emphasize important drawings
  - >-
    Change dimensioning mode from Constrained Linear to Constrained Chain before starting to enable continuous
    dimensioning
  - Press hotkey 'N' while using the Dimension tool to access keyboard shortcuts for faster dimensioning
  - Lower drawing labels below the drawing by about 14 inches to avoid conflicts with bottom dimension strings
  - Use hotkey 'D' to regenerate drawing labels if they're accidentally deleted or need to be recreated
  - >-
    Create a white-filled rectangle (1 inch by 1 inch) to clean up crossing dimension lines by placing it behind
    dimensions
  - Reduce section marker scale factor to about half size (0.5) for cleaner appearance on drawings
  - Draw reference lines first when placing section markers to ensure correct direction and alignment
  - Place section markers about 1 foot on either side of the section cut for proper visual indication
  - Create detail viewports on the section line class so the crop circle displays with dashed lines
  - Save publish sets with descriptive names (e.g., 'Elevations') for frequently updated documentation packages
  - Use File Export Options to create folders for each file type when publishing multiple sheets
shortcuts:
  - keys: 'N'
    action: Show Dimension tool keyboard shortcuts
  - keys: D
    action: Regenerate drawing label
  - keys: Ctrl+Shift+Click
    action: Click through viewport to access underlying geometry
  - keys: Double-click viewport
    action: Access viewport edit options (annotations, crop, design layer, camera)
common_pitfalls:
  - >-
    Forgetting to change from Constrained Linear mode to Constrained Chain mode, causing dimensioning to stop after the
    first dimension
  - >-
    Dimensioning in the wrong scale context—annotations must be added inside the viewport annotation mode to display at
    correct scale
  - Placing drawing labels too close to dimension strings, causing visual conflicts and overlapping text
  - Not using grid snap for viewport layout, resulting in misaligned drawings and unprofessional appearance
  - Creating section markers in the wrong direction, requiring deletion and recreation instead of simple adjustment
  - Forgetting to link section markers to the correct drawing number and sheet number, causing incorrect references
  - Creating detail viewports at the same scale as the parent drawing, defeating the purpose of showing detail
  - Not organizing detail viewports linearly on the sheet, making the drawing harder to read and navigate
  - Publishing PDFs without checking File Export Options, resulting in disorganized output files
  - Not saving publish sets for frequently updated documentation, requiring manual sheet selection every time
transcript:
  - text: >-
      Hello, this is Brandon PT Davis, theatrical scenic designer. In this Vectorworks tutorial video, we are going to
      cover the basics of 2D annotations and dimensioning.
    time: '0:05'
  - text: If you aren't familiar with working in sheet layers and viewports, please watch the previous tutorial below.
    time: '0:20'
  - text: >-
      Prior to this tutorial, I have drawn the plan view, front elevation, and two sections of a wall in the design
      layer.
    time: '0:28'
  - text: >-
      We need to take the information from the design layer and place it in the sheet layer. I've already named this
      Sheet Layer 1: Elevations.
    time: '0:35'
  - text: >-
      In order to work with the drawing that we created in the design layer in the sheet layer, we need to create
      viewports that reference the drawing.
    time: '0:46'
  - text: >-
      To do this, I'm going to use the Rectangle tool and create a crop. The crop is simply drawing a rectangle over the
      viewport area that you're trying to create.
    time: '0:54'
  - text: >-
      I will then go to View and select Create Viewport. The Create Viewport dialog pops up, and the first thing you
      want to do is name the viewport.
    time: '1:07'
  - text: >-
      I recommend naming the viewport with the sheet number, which is 1, and the drawing number, which in this case will
      be 1, plus a brief description.
    time: '1:21'
  - text: >-
      The next option asks if you want to create a drawing label. I have this checked, and then you can select a style.
      I have the UTEP drawing number and sheet number style that I created selected.
    time: '1:38'
  - text: 'It will ask for the drawing number, which will be 1, and then a title: Wall Plan.'
    time: '1:56'
  - text: >-
      We can also modify the information that we are going to see in the viewport. Since this is a relatively simple
      file, the only design layer we have to select is Elevations, and we're going to use all the classes that are in
      the file.
    time: '2:07'
  - text: >-
      We can modify the scale here. We want our drawing to be at half-inch scale. In this particular case, I'm going to
      press OK.
    time: '2:28'
  - text: 'Now in the sheet layer, I have the first drawing: Wall Plan 1.'
    time: '2:37'
  - text: I'm now going to create the other viewports on the sheet layer.
    time: '2:49'
  - text: >-
      Now that I have created all of the viewports for my sheet layer, I need to lay out each viewport. One thing you
      can do is turn on Grid Snap. Currently, I have the Grid Snap reference set to half-inch by half-inch. I think this
      is pretty good.
    time: '3:31'
  - text: >-
      I'm going to click Show the Grid and press OK. Grabbing the wall, I'm going to snap to the grid, making sure that
      the bottom of the walls are all aligned.
    time: '3:51'
  - text: >-
      Once the drawing is laid out roughly how you plan on having it, we can modify the first elevation. I'm going to
      double-click, and we have viewport edit options.
    time: '4:38'
  - text: >-
      Here we can edit annotations, change the crop of the viewport, use the design layer to go back and modify elements
      of the design layer from where the viewport was created, or change the camera.
    time: '4:57'
  - text: >-
      Changing the camera view is really only for 3D objects, so this isn't effective for our workflow. I'm going to
      press OK and go into annotations.
    time: '5:10'
  - text: >-
      What you should note is that when we're in the annotation viewport, the scale is half-inch scale. If I quickly
      take the Line tool and draw a parallel line, it says ten feet zero.
    time: '5:25'
  - text: If I go outside of the annotation and do the same line, it says five inches, because we're in half-inch scale.
    time: '5:44'
  - text: >-
      Now I'm going to go back to the annotation viewport. The first thing we need to do is move the drawing label,
      because it typically gets in the way of your bottom dimension. I'm going to lower it to about here.
    time: '5:54'
  - text: >-
      With the drawing label, if you don't have one, you can always go back to the tool set and regenerate the drawing
      label. You can also hit the hotkey D to generate the drawing label.
    time: '6:26'
  - text: >-
      The drawing label is already named, and we basically named it when we created the viewport. When we go to the
      Object Info Palette, we can change the drawing title and the drawing number here.
    time: '6:43'
  - text: >-
      We have Display Scale set to architectural, so half-inch equals one foot zero in the bottom corner. You can also
      change the label length mode. I have this set to Control Point. If it was set to Fixed, all the labels would look
      the exact same.
    time: '6:56'
  - text: >-
      I like Control Point because it gives me the ability to adjust the label so it can extend all the way across the
      drawing, emphasizing what the drawing is.
    time: '7:16'
  - text: >-
      Now we're going to start dimensioning this drawing. We have two basic dimension tools here: the constrained linear
      dimension, which you'll use the most, and the unconstrained linear dimension.
    time: '7:30'
  - text: >-
      If you're working with angular dimensions, arc length, or looking for the radius of a circle, we also have those
      dimensions, but with this wall we won't really use them.
    time: '7:47'
  - text: >-
      The unconstrained linear dimension means I could draw a dimension at a 45-degree angle and still get a
      measurement. With the constrained linear dimension, we can only dimension things vertically or horizontally.
    time: '8:12'
  - text: >-
      Before we start, I'm going to show you that your document will probably default to constrained linear mode. That
      means when I draw the first dimension, it will stop, but we want to keep going.
    time: '8:33'
  - text: >-
      So we'll go back to the constrained linear dimension tool and change it from constrained linear mode to
      constrained chain mode. This will allow us to continue after the first dimension.
    time: '8:56'
  - text: >-
      I'm going to draw from the edge of the wall—not the edge of the molding, but the edge of the wall. Then I can find
      the point for the edge of the other wall from the drawing.
    time: '9:11'
  - text: >-
      I'm going to drop this down so I can access the grid. I want this to go down about a foot. I'm going to type 1' 0"
      and press Enter.
    time: '9:24'
  - text: >-
      So edge to edge, down a foot, and here we are. Now you can keep going. I'm going to dimension each mark, including
      the door opening, the edge of the flat, and then the edge of the full wall.
    time: '10:02'
  - text: Then we want to dimension the overall length so we can see the total length of the wall—22 feet.
    time: '10:29'
  - text: >-
      I'm going to continue dimensioning this drawing, and then we'll come back. Hotkey N will give you the hotkeys for
      the Dimension tool.
    time: '10:47'
  - text: >-
      Now that I have all of the viewports dimensioned, I'm going to go back to the front wall elevation and add a few
      features that we need. Double-clicking in, the first thing we need is a human figure in our drawing.
    time: '11:53'
  - text: >-
      I'm going to go to my Resource Manager. If I go into the Common folder, under 2D Figures, I have a set of 2D
      people. Vectorworks also has a set if you want to search for those, but I like the people that I have.
    time: '12:10'
  - text: >-
      I'm going to place this figure in the corner, holding Shift and pushing into the side, so this is referencing the
      drawing. I'll exit the viewport and adjust spacing as I go as I add different elements.
    time: '12:28'
  - text: >-
      We have these two sections here, but we can add a reference marker. So we're going to go back into the annotations
      of our wall front elevation. In the tool palette, here is the Section Elevation Line tool.
    time: '12:51'
  - text: >-
      I already have classes set up for these elements in the sheet layer, so I'm going to turn on my section line class
      and select the tool. The first tool is the Wall Section tool. I'm going to take a section from this wall.
    time: '13:09'
  - text: >-
      I'm going to double-click. It's going in the same direction as the drawing. I messed that up. What you probably
      want to do is draw a reference line first. Then what I usually do is, from the center, add about a foot on both
      sides so it's a little bit taller.
    time: '13:33'
  - text: >-
      That means we may need to move our dimension line, which is fine. So I'll go back to the Wall Section tool and
      draw it in the correct direction. Now we have our first label.
    time: '14:03'
  - text: >-
      This red broken chain indicates it's not linked. If you're working in 3D, you can link drawings together. We'll go
      over that in another tutorial. I'm going to delete that reference line quickly.
    time: '14:20'
  - text: >-
      Now I'm going to modify a few things. For the marker scale factor, I like to have it about half the size. Right
      now it's referencing a drawing number and a sheet number, which we don't want.
    time: '14:34'
  - text: >-
      We want it to reference drawing 3. So I'm going to change the drawing number to 3. We only have one sheet, which
      is 1, so it's referencing 3/1. That's good. Now I'm going to lower this.
    time: '14:50'
  - text: >-
      Right now it's about nine and a half. I'm going to take it to negative 14 inches so we can bring this down. We may
      need a little bit more adjustment, and I'll adjust the labels for the other drawings as well.
    time: '15:12'
  - text: >-
      Now I'm going to hold Control + Shift and click through the door. We need to tell it that it's referencing Sheet
      4. We'll press OK. Aside from notes, which I'll show you how to do, we have everything we need.
    time: '15:40'
  - text: >-
      Here is where the Callout tool is located. What you want to do is select first where the callout starts, and then
      where it's going. I'm going to label it Painted Wall.
    time: '16:08'
  - text: >-
      We also want to change the class to our General Label class. Make sure it's listening to our classes in the
      Attributes Palette, which it is. Then we're going to press Exit Viewport. So now we have this first drawing done.
    time: '16:27'
  - text: I'm going to quickly edit these elements.
    time: '16:51'
  - text: >-
      The last tool I want to cover in this tutorial is that we have all of our molding, but it's very small right now.
      We can't really dimension this in half-inch scale, so what we can do is reference elements in the 2D drawing.
    time: '17:09'
  - text: >-
      I'm going to use the Circle tool and draw over the crown molding. I'm going to keep this in the section line
      class. With this selected around our crown molding, I'm going to go to View and create a Detail Viewport.
    time: '17:30'
  - text: >-
      This will be our fifth drawing, so 1/5 Crown. We're going to use the same drawing label. I'm going to call this
      Crown Detail. I'm going to change the scale to half-inch to three-inch scale. I'm going to press OK.
    time: '18:07'
  - text: >-
      Here is our detail viewport. It's much larger. I'm happy with this. I just want to make sure the labels are lined
      up so everything looks clean.
    time: '18:37'
  - text: >-
      My goal is to keep everything in a rectangle within the page, so I'm going to adjust everything a little bit to
      give us more room. Then I'm going to double-click and go into the annotations.
    time: '18:54'
  - text: >-
      I'm going to do general dimensions of our crown molding, taking the height and the width. Here's a trick: if you
      notice we have dimension lines crossing, which you never want.
    time: '19:14'
  - text: >-
      I'm going to create a square, make it one inch by one inch, and press Enter. I'm going to override it so it has a
      solid white fill and no pen. I'm going to place it in the center, then bring the dimension to the front.
    time: '19:39'
  - text: >-
      Now we have a gap to clean up the dimension. This looks good. All I need to do now is create the rest of the
      detail viewports.
    time: '20:01'
  - text: >-
      Before we do that, I'm going to show you one more thing. I'm going to go back and edit the annotations. I think
      the scale factor could be reduced by half to clean that up.
    time: '20:20'
  - text: >-
      Because I created this on the section line class, we have the dashed line, which I think looks really good. What I
      want to do is move this. I like to keep things pretty linear in my drawings.
    time: '20:36'
  - text: >-
      I think we'll need to space these out so that when we add the other viewports, everything lines up. Now I'm going
      to go through and create the other detail viewports.
    time: '21:02'
  - text: >-
      Now that I've completed the drawing, I need to publish this to a PDF. To publish to a PDF, go to File, then
      Publish. We're going to add our sheet layer. This one is already selected.
    time: '25:26'
  - text: >-
      Go back to the elevation sheet layer and add that. Make sure it's added as a PDF, and go to File Export Options.
      This will create a folder for each type. I'm happy with these settings.
    time: '25:44'
  - text: >-
      Double-check options. Make sure it's set to All Pages. If you want to omit pages, you can, but we're going to do
      All Pages. Press OK, and then press Publish.
    time: '26:16'
  - text: >-
      It asks if I want to save a set. We could say yes and call the set Elevations. This feature is really helpful if
      you're creating a large document and you have to update it frequently.
    time: '26:33'
  - text: >-
      I'm going to press OK, leave it with the document name, and press Save. Now on my second screen, I have my
      published PDF.
    time: '26:58'
  - text: >-
      That's it. This completes the Vectorworks tutorial. Thank you for watching, and if you have any questions, please
      feel free to ask. Thank you.
    time: '27:11'
