overview: >-
  This tutorial introduces the Vectorworks user interface specifically for scenic designers. You'll learn how to
  navigate the workspace, understand the coordinate system, and configure palettes for theatrical drafting and 3D
  modeling.


  The walkthrough covers the menu bar, tool palettes, and the critical Object Info and Navigation palettes that control
  your drawing organization. You'll also learn the X/Y/Z axis system and why keeping your model near the origin (0,0) is
  essential for rendering.


  Finally, the tutorial explores view controls, zoom functions, and workspace customization—showing how to set up an
  efficient environment for scenic design work.
description: Master the Vectorworks workspace, palettes, and coordinate system to build an efficient scenic design workflow.
