overview: >-
  This tutorial demonstrates how to create hybrid symbols that combine 2D and 3D representations in a single symbol.
  You'll learn the complete workflow for converting a 3D symbol into a hybrid symbol, including creating custom 2D
  components for Top/Plan views through manual tracing or auto-generation. The tutorial covers practical techniques for
  creating clean 2D graphics, managing component edit modes, and understanding the trade-offs between manual tracing and
  automatic generation methods. This skill is essential for creating efficient symbols that display appropriately in
  both 2D documentation and 3D visualization contexts.
