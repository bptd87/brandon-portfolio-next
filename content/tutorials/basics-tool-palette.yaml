overview: >-
  This comprehensive tutorial introduces the Basics Tool Palette, located in the top left corner of the Vectorworks
  workspace. You'll learn how to access each tool using both icon clicks and keyboard shortcuts, understand the
  different modes available for each tool, and apply these tools to 2D drafting workflows.


  The tutorial covers 15+ essential tools organized into categories: navigation tools (Selection, Pan, Zoom), annotation
  tools (Text, 2D Locus), basic shape tools (Line, Rectangle, Circle), advanced shape tools (Polyline, Polygon), and
  modification tools (Fillet, Chamfer). Each tool section explains multiple drawing modes and practical applications for
  scenic design.
description: >-
  Master the essential 2D drawing tools in the Basics Tool Palette, including selection, drawing, and modification tools
  that form the foundation of scenic design drafting in Vectorworks.
