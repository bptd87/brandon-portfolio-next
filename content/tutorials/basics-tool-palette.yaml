common_pitfalls:
  - >-
    Forgetting to switch back to Selection tool (X) after drawing—you can't modify objects while a drawing tool is
    active
  - Not understanding that snapping points only appear when Selection tool is active and an object is selected
  - Drawing with the wrong mode active (e.g., Rectangle corner-to-corner when you meant three-point mode)
  - Confusing Polyline (open/closed editable paths) with Polygon (closed shapes with special combining modes)
  - Not setting the Double Line separation before drawing walls, resulting in incorrect wall thickness
  - Trying to print 2D Locus points—they're reference-only and won't appear on printed sheets
transcript:
  - text: >-
      Hello, this is Brandon PT Davis, theatrical scenic designer. This Vectorworks tutorial is going to cover the
      Basics Tool Palette and how it's applied to two-dimensional drawing.
    time: '0:00'
  - text: >-
      The Basics Tool Palette is located in the top left corner of my Vectorworks workspace. If you aren't familiar with
      the Vectorworks icon, you can hover over each icon and a text button will pop up. You can also click the down
      arrow and change from icons to icons and text. In this tutorial, I'm going to use Vectorworks view tools as icons.
    time: '0:20'
  - text: >-
      The first tool we will talk about is the Selection tool. The Selection tool is what allows users to move or modify
      objects on the screen. You can access this by clicking on the icon or hitting the letter X. Now that I have the
      Selection icon, I can hover over this object and note that it will highlight around the perimeter. By clicking
      once, I now have access to the snapping points. Because I have the snapping highlight point turned on, with the
      snapping points I can modify the shape.
    time: '0:50'
  - text: >-
      The next tool we will cover is the Pan tool. By clicking on the Pan tool, you are able to pan throughout your work
      area. Note the hotkey for the Pan tool is the letter H—think letter H for hand. In the icon of the Pan tool, you
      will notice a black arrow in the corner. If you click and hold on any of the icons with the black arrow, you can
      have additional features. This additional feature in this example is Move Page. In our workspace we do not have an
      active page, so we will not worry about this feature.
    time: '1:43'
  - text: >-
      The Zoom tool is the magnifying glass icon. When clicking on this, you can zoom with or with the Zoom Marquee mode
      by making a selection and click once. You can also access the Zoom tool with a three-button mouse. A hotkey for
      the Zoom tool is the letter C.
    time: '2:25'
  - text: >-
      When adding text to your document, you can access the Text tool by hitting the number 1 or clicking on the icon.
      You can apply the text just by clicking and starting and typing your text. To change the text style, font, or
      size, you can access these items in the Object Info Palette. You can also change the text in the Text dropdown
      menu.
    time: '2:51'
  - text: >-
      A 2D Locus tool, which is the icon that looks like the letter X, is located here. A 2D Locus is simply a reference
      point that can be used in Vectorworks when drawing. This document contains a red 2D Locus at 0,0, as this
      reference is very common when working in theatrical practice. The benefit of a 2D Locus is it allows you to have a
      point that's viewable on the screen but not printable on the page. The hotkey for the 2D Locus is the letter zero.
    time: '3:32'
  - text: >-
      One of the most common tools you will use in Vectorworks is the Line tool. The Line tool simply draws a 2D line.
      You can access the Line tool by clicking the icon or pressing the number 2 on the keyboard.
    time: '4:11'
  - text: >-
      In addition to the 2D Line tool, you also have the Double Line tool. You can access the Double Line tool by
      clicking on the icon or hitting Alt+2. A Double Line tool allows the user to draw two lines with a separation.
      This separation is currently set to one inch. I can click and change the separation to four inches. You also have
      the ability to click on the Preferences and change the options from creating polygons (which is a four-sided
      shape) to creating simply just lines. You can also change the mode of the 2D Line tool. Currently it's on the top
      control line mode. Additionally, you can change this tool from top to accessing through the center. A hotkey to
      quickly adjust which mode you're working in is by hitting the letter I.
    time: '4:26'
  - text: >-
      The next tool is the Rectangle tool. The Rectangle tool will draw a four-sided shape with 90-degree angles. The
      hotkey for the Rectangle tool is the number 4—think four sides. The Rectangle tool also has a series of modes. The
      primary mode is corner to corner. You can also change it to corner to middle, midpoint to midpoint mode, and my
      second favorite, the three-point rectangle mode.
    time: '5:49'
  - text: >-
      The next tool that's related to the Rectangle tool is the Rounded Rectangle tool. This is the icon of the
      rectangle with the rounded edges. This mode allows you to draw a four-sided shape with an eased edge. By clicking
      on the Preferences, you can change the proportional corners to symmetrical corners, as well as adjust the diameter
      of the quarter corners in which you are drawing.
    time: '6:38'
  - text: >-
      A Circle tool, which is the icon of the circle, allows you to draw a circle. The current mode for the circle is
      the radius mode, which is center point to the outer edge. You can also adjust to diameter mode, three-point mode,
      circle from three lines mode (requires that you have drawn three lines—once you select the circle with hotkey 6,
      you can select your three points and a circle will be drawn to fit within those three points), point to center
      mode, and tangent and center mode. Please note you can adjust the modes by hitting the letter U.
    time: '7:14'
  - text: >-
      Next to the Circle tool icon, you will find the Oval tool. The Oval tool allows the user to draw an oval. Box mode
      is the first mode—the box mode is similar to drawing a rectangle with an oval inside. Following the box mode is
      the height and width mode—I can draw the width and then the height to create the oval. And the third mode is from
      the center mode. The hotkey for the Oval tool is Alt+6.
    time: '8:21'
  - text: >-
      Next to the Oval tool is the Arc tool. Arc tool allows you to draw an arc. The most common arc tool mode that I
      use is the arc radius mode. This mode allows you to draw two points and then create the arc from the first point
      as the center. I use this tool when drawing the graphic for a door swing. Other modes in the Arc tool are
      three-point mode, tangent to line mode, sensor mode, as well as specified radius mode where you can manually enter
      the radius.
    time: '9:06'
  - text: >-
      The Freehand tool, hotkey Alt+5, allows the user to draw an organic shape. With one click, the shape will be
      smoothed.
    time: '10:13'
  - text: >-
      A tool that's more common for drawing organic shapes is the Polyline tool. The Polyline tool has many different
      modes when it comes to drawing a polyline. The first mode is the corner vertex mode—this mode will keep all the
      lines within the shape you're creating at 3. You can also draw in the Bezier vertex mode, the cubic vertex mode,
      the tangent arc mode, point on arc mode. The last mode in Polyline tools is the arc vertex fillet mode. You can
      adjust the arc by clicking on the fillet settings and changing the radius. Now when I draw, each corner will be a
      six-inch radius fillet. You can access the Polyline tool by hitting hotkey 5. Please note that when drawing a
      polyline, you can actually change the modes while you're drawing by hitting the hotkey letter U. This is how you
      can create a more organic shape but with having control within the software.
    time: '10:25'
  - text: >-
      Next to the Polyline tool, you will find the 2D Polygon tool. The 2D Polygon tool has a similar mode as the
      Polyline tool, where you can draw a shape using straight lines. A Polygon tool can be accessed by hitting the
      hotkey 8. The 2D Polygon mode has some interesting features. In order to show you how they function, I have drawn
      two identical clusters of rectangles. If I click where these two rectangles intersect, it will create another
      shape. By holding Shift, I can continue to create upon that shape. And the outer boundary mode, I can make the
      selection around this cluster of squares, and you'll see that it's in a way grouped them together. But if I have
      to move them, you will see that the original shapes are behind the new shape.
    time: '12:14'
  - text: >-
      The Double Line Polygon tool is very similar in function to the Double Line tool. The difference is that we have a
      separation between the two lines. This tool is great if you are trying to create walls in a 2D application. The
      hotkey for the 2D Double Line Polygon tool is Alt+8. We can modify the separation as well as go into the
      Preferences and change the options to create lines, create polygons, and create lines and polygons.
    time: '13:24'
  - text: >-
      The Fillet tool, which is located here, allows you to take a right angle and soften the edges with a fillet. You
      can adjust the fillet with the fillet radius here. There's a number of modes of the fillet—there's standard mode,
      split mode, and trim mode. The hotkey for the fillet mode is 7.
    time: '14:07'
  - text: Similar to the Fillet mode is Chamfer mode. Chamfer mode allows you to take two right angles and create a chamfer.
    time: '14:37'
