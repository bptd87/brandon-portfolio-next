learning_objectives:
  - Navigate and use the Selection tool to modify objects
  - Use Pan and Zoom tools to navigate your workspace
  - Create text annotations with the Text tool
  - Place reference points with the 2D Locus tool
  - Draw lines, rectangles, circles, and polygons
  - Create organic shapes with Polyline and Freehand tools
  - Apply Fillet and Chamfer modifications to corners
key_concepts:
  - title: SELECTION TOOL (X)
    content: >-
      The Selection tool is your primary interface for interacting with drawn objects. It allows you to move, modify,
      and access snapping points on shapes. Without the Selection tool active, you cannot manipulate existing geometry.
  - title: DRAWING MODES
    content: >-
      Most drawing tools in Vectorworks offer multiple modes that change how the tool behaves. For example, the
      Rectangle tool can draw corner-to-corner, corner-to-middle, midpoint-to-midpoint, or using three points. Learning
      to switch between modes (hotkey: U) dramatically increases efficiency.
  - title: POLYLINE VS POLYGON
    content: >-
      Polylines create open or closed paths with editable vertices, ideal for organic shapes that may need modification.
      Polygons create closed shapes and offer special modes like 'Intersecting' and 'Outer Boundary' that can combine or
      trace around multiple objects.
  - title: 2D LOCUS
    content: >-
      A 2D Locus is a reference point that appears on screen but doesn't print. Scenic designers commonly place a red
      locus at 0,0 (centerline) as a visual reference point for the entire drawing.
pro_tips:
  - >-
    Learn the keyboard shortcuts for your most-used tools. Hitting 'X' for Selection, '2' for Line, '4' for Rectangle,
    and '5' for Polyline will dramatically speed up your workflow compared to clicking icons.
  - >-
    When drawing with the Polyline tool, you can change modes mid-drawing by hitting 'U'. This lets you combine straight
    lines, curves, and arcs in a single continuous shape without switching tools.
  - >-
    The Double Line Polygon tool (Alt+8) is perfect for quickly drafting walls in floor plans. Set the separation to
    your wall thickness and draw the entire floor plan outline in one continuous operation.
  - >-
    Use the 'I' hotkey to quickly cycle through drawing modes for any tool. This is faster than clicking the mode
    dropdown in the Object Info Palette.
