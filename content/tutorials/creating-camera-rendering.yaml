overview: >-
  This tutorial demonstrates the essential workflow for creating presentation-quality renderings in Vectorworks. You'll
  learn how to add and configure spotlights and point lights for dramatic effects, create and adjust cameras with proper
  aspect ratios (16:9), use the walkthrough tool to frame your shot, create viewports from cameras, apply Renderworks
  styles, enhance scenes with colored lighting, and export high-resolution images. This workflow is critical for scenic
  designers who need to create compelling visualizations of their designs for clients, directors, and production teams.
description: >-
  Learn the complete workflow for creating cameras, setting up dramatic lighting, configuring viewports, and exporting
  high-quality renderings in Vectorworks.
