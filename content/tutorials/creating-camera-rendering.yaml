learning_objectives:
  - Add and configure spotlights and point lights with proper tilt and positioning
  - Create and organize lighting classes for easy visibility control
  - Set up cameras with 16:9 aspect ratio for film/screen-standard renderings
  - Use the walkthrough tool to frame and compose camera views effectively
  - Create linked viewports from cameras on dedicated rendering sheet layers
  - Apply Renderworks styles (Realistic Final/Fast) for high-quality output
  - Enhance scenes with dramatic colored lighting (pink, blue) for visual impact
  - Export high-resolution image files with proper settings (120 DPI, single page)
key_concepts:
  - title: LIGHTING SETUP
    content: >-
      Start by adding lights to your scene using the Light tool from the Visualization palette (lightbulb icon). Use
      spotlights for directional lighting (like stage lights) and point lights for ambient fill (like lamps). Configure
      spotlight tilt to 90 degrees for top-down lighting, and position additional spotlights as side/front lights to
      reveal form. Always create a dedicated 's light' class and assign all lights to it so you can toggle visibility
      easily. White lights provide realistic illumination, while colored lights (saturated pink, blue) create dramatic
      theatrical effects.
  - title: CAMERA CONFIGURATION
    content: >-
      Use the Camera tool (looks like a 35mm DSLR, NOT the video camera icon) to create a camera object. The most
      important setting is aspect ratio: change it to 16:9 (1.7869) to match film and computer screen standards. This
      ensures your renderings display correctly in presentations and on screens. After placing the camera, double-click
      it to enter camera view, then use the Walkthrough tool (NOT Flyover) to adjust the framing. Walk backwards to zoom
      out, use elevated mode to adjust height, and zoom in to compose your shot.
  - title: VIEWPORT WORKFLOW
    content: >-
      Create a viewport from your camera by going to View > Create Viewport. Choose 'Link the camera' so the camera
      moves from the design layer to the viewport—this keeps your design layer clean and makes the camera easier to
      manage. Place the viewport on a dedicated rendering sheet layer (16:9 format). Uncheck 'Show title' and give the
      viewport a descriptive name (e.g., 'Rendering'). This viewport-based workflow allows you to update renderings
      without re-exporting, and keeps all presentation views organized on sheet layers.
  - title: RENDERWORKS STYLES
    content: >-
      Apply Renderworks styles from the viewport's Object Info Palette. Use 'Realistic Final' for highest quality
      (slower) or 'Realistic Fast' for quick previews. These styles calculate realistic lighting, shadows, reflections,
      and textures. After changing lights or materials, click 'Update' in the viewport to re-render. The UTEP template
      includes black backgrounds by default, which creates dramatic high-contrast renderings perfect for theatrical
      presentations.
  - title: DRAMATIC LIGHTING
    content: >-
      Enhance your renderings with colored point lights for theatrical drama. Add a saturated pink light and a saturated
      blue light in addition to your white key light. Position these colored lights to create rim lighting or accent
      specific areas. This technique—borrowed from stage lighting—helps viewers 'read the object quickly' by creating
      visual separation and depth. The contrast between warm (pink) and cool (blue) lights adds professional polish to
      your renderings.
  - title: IMAGE EXPORT
    content: >-
      Export your rendering by going to File > Export > Image File. Set resolution to 120 pixels (DPI) for high-quality
      prints and presentations. Choose 'All pages as a single page' to export the entire sheet layer as one image. Use
      wireframe preview to verify the export area matches your viewport. Save as PNG or JPEG depending on your needs
      (PNG for transparency, JPEG for smaller file size). This creates a standalone image file you can use in
      portfolios, presentations, or client deliverables.
pro_tips:
  - >-
    Always create a dedicated 's light' class for all lights—makes it easy to toggle visibility when modeling vs.
    rendering
  - >-
    Use spotlights (not point lights) for directional lighting—they're more controllable and realistic for stage-style
    lighting
  - Set spotlight tilt to exactly 90 degrees for top-down lighting—prevents unwanted shadows or light spill
  - Check your lighting in perspective view with Fast Renderworks before finalizing—saves time vs. full renders
  - Change camera aspect ratio to 16:9 immediately after creating the camera—this matches film/screen standards
  - Use the Walkthrough tool (not Flyover) to adjust camera framing—it's more intuitive for architectural/scenic views
  - Link the camera to the viewport when creating it—keeps your design layer clean and camera management simple
  - Place viewports on dedicated rendering sheet layers (16:9 format)—keeps all presentation views organized
  - Use 'Realistic Fast' for testing lighting, 'Realistic Final' for final exports—saves rendering time during iteration
  - Add colored lights (pink, blue) after establishing white key lighting—builds drama without losing readability
  - Position colored lights as rim/accent lights—creates visual separation and depth in your renderings
  - Export at 120 DPI for presentations and portfolios—balances file size with print quality
  - Use 'All pages as a single page' export option—ensures the entire sheet layer exports as one image
  - Check wireframe preview before exporting—verifies the export area matches your intended frame
shortcuts:
  - keys: Double-click camera
    action: Enter camera view
  - keys: Cmd/Ctrl + U
    action: Update viewport rendering
common_pitfalls:
  - Using point lights instead of spotlights for directional lighting—results in unfocused, unrealistic illumination
  - Forgetting to tilt spotlights 90 degrees—causes lights to shine horizontally instead of down
  - Not creating a dedicated light class—makes it hard to toggle lights on/off during modeling
  - Forgetting to change camera aspect ratio to 16:9—results in distorted renderings that don't match screen formats
  - Using Flyover tool instead of Walkthrough tool—less intuitive for framing architectural/scenic views
  - Not linking the camera to the viewport—leaves camera objects cluttering your design layer
  - Placing viewports on design layers instead of sheet layers—makes presentation organization messy
  - Using 'Realistic Final' for every test render—wastes time; use 'Realistic Fast' for iteration
  - Adding colored lights before establishing white key lighting—makes scenes unreadable and chaotic
  - Exporting at low resolution (72 DPI)—results in pixelated images unsuitable for presentations
  - Forgetting to select 'All pages as a single page'—exports multiple tiled images instead of one complete image
  - Not checking wireframe preview before exporting—may export wrong area or cropped frame
transcript:
  - text: >-
      Hello, this is Brandon PT Davis, theatrical scenic designer. In this Vectorworks quick tip tutorial I'm going to
      show you how to create a camera and render a model.
    time: '0:06'
  - text: >-
      Let's start with we have this table model that we've created. The first thing I think we need to do is drop some
      lights.
    time: '0:17'
  - text: >-
      Go to the tools palette and the visualization palette (the one with the little light bulb). Select the light tool,
      choose a spotlight.
    time: '0:40'
  - text: >-
      Drop a spotlight in the center of the model, keep it a white light. Go down to tilt, tilt the light 90 degrees so
      it's pointing straight down.
    time: '0:55'
  - text: If I go to front view we have our light. Position it where you want, make sure tilt stays 90 degrees.
    time: '1:16'
  - text: >-
      Now I want to check this in perspective. Change the view from orthogonal to normal perspective. That gives us a
      little bit of perspective. Then do a Fast Renderworks just to see how the light affects the object.
    time: '1:45'
  - text: >-
      I think I want a little bit of a front light, so I'll drop another light. I accidentally dropped a point
      light—point light is like a lamp in your living room. I want a spotlight so it's directional.
    time: '2:13'
  - text: >-
      Go into right view, select the light, drag it about here, and point the light at the table. Maybe make it more of
      a side light. Now we have two lights, we should be good to go.
    time: '2:46'
  - text: 'We need to class the lights so we can turn them on and off. Create a new class: ''s light.'' Press OK.'
    time: '3:19'
  - text: >-
      Next step is to drop a camera. The camera tool is located here in the tool sets. It looks like the 35 millimeter
      DSLR camera—that is the camera tool, not the video camera.
    time: '3:37'
  - text: >-
      Start with the camera, drag it about center, double click. The main thing you need to change is aspect ratio.
      Change it to 16:9. 16:9 is the same aspect ratio used in film or your computer screen. It's 1.7869. We won't worry
      about other settings yet. Press OK.
    time: '3:52'
  - text: >-
      To see what the camera sees, hover over the camera and double click. I don't like what the camera sees at first.
      You can use the flyover tool, but I recommend using the walkthrough tool.
    time: '4:30'
  - text: >-
      Use walk mode, walk backwards. These blue lines are the picture frame. Use elevated mode to slide it down, zoom
      in, slide down a little, and zoom in again. That's probably pretty good.
    time: '4:50'
  - text: >-
      Next step is create a viewport out of this camera. Go to View > Create Viewport. It says create a viewport from
      camera. Choose to link the camera, so the camera is moved from the design layer to the viewport.
    time: '5:29'
  - text: >-
      You can also keep the original camera in the drawing, but the best plan is link the camera in the viewport.
      Uncheck the title. You can give it a name: rendering name 'rendering.' Put this on the rendering sheet layer. The
      rendering sheet layer is a 16:9 image. Press OK.
    time: '5:57'
  - text: Now we have our rendering, and it's on the sheet layer perfectly. That's why we have that layer in the document.
    time: '6:48'
  - text: >-
      Now choose a render mode. Go to Renderworks styles, use UTEP Realistic Final, or Realistic Fast depending on your
      computer. Press update. It creates the image.
    time: '7:05'
  - text: >-
      In our UTEP file we have black backgrounds. It's a little dark, but it's pretty cool. If we add a point light we
      can get more response.
    time: '7:31'
  - text: >-
      Go back to the design layer, then back to the sheet layer. Go into your lights, add a light. Add a point light. I
      want more dramatic lighting. Change the colors.
    time: '7:47'
  - text: >-
      Make this light a saturated pink, make another one blue, keep the main light white. Now go back to the rendering
      sheet layer, update.
    time: '8:30'
  - text: >-
      Now you can see the added light created a good effect. It helps you read the object quickly, and the dramatic
      lighting looks good.
    time: '9:09'
  - text: >-
      Now we want to create an image file. Go to File > Export > Image File. Change the resolution to 120 pixels. Change
      the area to all pages as a single page.
    time: '9:25'
  - text: >-
      Wireframe preview shows the export area—that's the image. Keep print size the same, press save. The name is good.
      And there's your image.
    time: '10:01'
  - text: That concludes this Vectorworks tutorial. If you have any questions please let me know. Thank you.
    time: '10:32'
