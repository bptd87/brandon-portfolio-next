overview: >-
  This tutorial introduces classes as one of the most important organizational tools in Vectorworks. You'll learn how
  classes control graphic attributes, textures, and visibility—allowing you to show or hide specific elements of a
  drawing as needed for drafting and documentation.


  The walkthrough covers how classes are structured, how class hierarchies work, and why standard classes like None and
  Dimension are critical to a clean workflow. You'll also see the difference between manually overriding attributes and
  allowing classes to control appearance using Use at Creation settings.


  Finally, the tutorial explores how grouping objects interacts with class visibility—showing how multiple classed
  objects can live inside a group while still responding independently to class-based control. This approach becomes
  especially useful in complex scenic drawings.
description: >-
  Master the organization system that controls graphic attributes, textures, and visibility in Vectorworks using classes
  and hierarchies.
