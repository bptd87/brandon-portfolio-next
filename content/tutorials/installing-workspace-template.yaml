overview: >-
  This tutorial walks you through the complete process of installing a custom Vectorworks workspace and template
  provided by an organization. Workspaces and templates are essential tools for standardizing communication when working
  as part of a company or design team.


  The tutorial covers copying the Vectorworks User Folder to your documents, accessing and modifying Vectorworks
  preferences, removing default workspaces from the application folder, and opening organizational templates. This setup
  process ensures that all team members work with consistent tools, palettes, and document standards.
description: >-
  Learn how to properly install and configure a Vectorworks workspace and template provided by your organization or
  company to ensure standardized communication and workflow.
