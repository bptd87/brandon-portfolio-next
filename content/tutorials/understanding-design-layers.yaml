learning_objectives:
  - Understand what design layers are and how they organize drawing information
  - Navigate and manage design layers using the Navigation palette
  - Create, duplicate, and edit design layers with proper naming conventions
  - Control layer stacking order and visibility
  - Use layer viewing options (Gray/Snap Others, Show Others, Show/Snap Others)
  - Apply design layer concepts to real scenic design workflows
key_concepts:
  - title: DESIGN LAYERS
    content: >-
      Design layers organize drawing information conceptually similar to stacked sheets of paper or vellum. Each layer
      can contain different elements (architecture, scenery, lighting) that can be shown or hidden independently.
  - title: STACKING ORDER
    content: >-
      The vertical arrangement of design layers determines which elements appear on top when layers overlap. Higher
      layers in the stack appear in front of lower layers—critical for controlling visibility in both 2D and 3D views.
  - title: LAYER VIEWING OPTIONS
    content: >-
      Gray/Snap Others: See inactive layers in gray, can snap to them. Show Others: See inactive layers in full color,
      cannot snap. Show/Snap Others: See and snap to inactive layers. Show/Snap/Modify Others: Full access (not
      recommended).
pro_tips:
  - >-
    Keep all design layers at the same scale (typically 1/4" = 1'-0" for theatrical work) to ensure files work in
    unison.
  - >-
    Use consistent naming conventions: S-Ground Plan (scenic), L-Ground Plan (lighting), Arch-Ground Plan
    (architecture).
  - >-
    Place architectural elements on the bottom layer, scenic elements in the middle, and lighting on top for logical
    stacking.
  - >-
    Use 'Gray/Snap Others' as your default viewing mode—it provides visual hierarchy while maintaining snap
    functionality.
shortcuts:
  - keys: Right-click layer name
    action: Quick access to Edit menu
  - keys: Double-click layer name
    action: Open Design Layer Organization dialog
common_pitfalls:
  - Creating layers at different scales, causing dimensional conflicts
  - Not understanding stacking order, leading to elements appearing behind others unexpectedly
  - Using 'Show/Snap/Modify Others' and accidentally editing the wrong layer
  - Forgetting to check which layer is active before drawing new objects
  - Not using consistent naming conventions across projects
transcript:
  - text: >-
      Hello, this is Brandon PT Davis, theatrical scenic designer, and in this Vectorworks tutorial I'm going to talk to
      you about classes and design layers.
    time: '0:01'
  - text: Design layers are another method in which Vectorworks users can organize the information in their drawing.
    time: '0:12'
  - text: >-
      Conceptually, the design layer is similar to traditional drafting standards. A designer could use sheets of paper
      or vellum to draw elements of their design on specific pages—such as the base layer being the architectural
      drafting, and on top have the scenic ground plan, and stacked on top of that there could be the lighting plot.
    time: '0:20'
  - text: >-
      In order to illustrate the function of the design layers, I'm going to show you the production file from
      University of California Irvine's production of The Pajama Game.
    time: '0:47'
  - text: >-
      Within the file you will find the drafted out ground plan. This ground plan is a 3D hybrid symbol, meaning it has
      2D and 3D elements tied to it.
    time: '1:05'
  - text: >-
      To find the layers, you will go to the Navigation palette. The second tab with the three pieces of paper stacked
      is the navigation tablet.
    time: '1:20'
  - text: >-
      In the navigation tablet you will find the design layer names in the center, and to the right you will find the
      stacking order.
    time: '1:31'
  - text: To the left, similar to classes, you can adjust the visibility.
    time: '1:42'
  - text: >-
      In this file we have Set Ground Plan, Architectural Stage Ground Plan, Architectural House Ground Plan. There are
      a few other layers, but in this example these are the ones that really matter.
    time: '1:50'
  - text: I'm going to now adjust this into a Right Isometric view.
    time: '2:05'
  - text: As you can see, we have the set in three dimensions.
    time: '2:08'
  - text: >-
      We can now alter the visibility of the House Ground Plan from visible to off. We can now easily see the inside of
      the proscenium arch.
    time: '2:13'
  - text: >-
      If you wanted to work on the ground plan without having the hindrance of the architecture, we can also turn this
      element off as well.
    time: '2:28'
  - text: These elements here are the scenic design elements that were used within the production.
    time: '2:41'
  - text: >-
      To further explain how visibilities can continue to work, I will now go and show you the class system within the
      file. We can toggle through the different scenes by clicking on the visibility, and we will be able to see the
      different scenes within the production.
    time: '2:50'
  - text: I have now opened a blank file to show you how the design layers work when opening a new project.
    time: '3:10'
  - text: The design layers, as mentioned before, are in the Navigation Design Layers tab.
    time: '3:18'
  - text: Typically when you start a new file, the standard for Vectorworks is to name the design layer 'Design Layer-1.'
    time: '3:24'
  - text: If I were to duplicate this Design Layer-1, it will auto-name itself Design Layer-2.
    time: '3:35'
  - text: >-
      In order to edit or modify the current Design Layer 1, there's a number of ways we can accomplish this. First, we
      can right-click to edit. We can also double-click on the design layer organization and view the design layers
      within the file from there.
    time: '3:48'
  - text: >-
      Similar to the palette, the Organization palette has visibility, design layer name, stacking order, and scale.
      Again, these elements beyond are more tied towards architecture and not going to be covered in this video.
    time: '4:12'
  - text: In order to edit the design layer, we simply have to click Edit.
    time: '4:31'
  - text: 'Design layer—we can name Scenic Ground Plan: S for scenic and GP as an abbreviation for ground plane.'
    time: '4:40'
  - text: >-
      You can also modify the scale of the design layer. In order for your files to work in unison, it is important that
      all design layers are the same scale.
    time: '4:50'
  - text: >-
      Typically we work in quarter-inch or 1:48 scale. Stacking order can then be modified manually in the Edit Design
      Layers palette.
    time: '5:02'
  - text: Below are the architectural elements which we will not be covering.
    time: '5:15'
  - text: Now the Set Ground Plane layer has been created.
    time: '5:24'
  - text: I'm now going to create a new design layer. I'm going to call this one L-Ground Plan, or the Lighting Ground Plan.
    time: '5:27'
  - text: >-
      I'm going to press OK. As we can see, without going to edit, the attributes of the design layers are similar, and
      they are both the same scale. The name and visibility are the same. The stacking order has the Ground Plan layer
      on top and the Scenic Ground Plane layer on bottom.
    time: '5:39'
  - text: >-
      We can shuffle this by sliding the Ground Plan order, so now the Scenic Ground Plane is on top and the Lighting
      Ground Plane is on the bottom.
    time: '5:59'
  - text: In order to show you how these ground plan layers work within stacking, I'm going to draw a couple of circles.
    time: '6:14'
  - text: >-
      The first circle I'm drawing on the Lighting Ground Plan layer. We know this because the Lighting Ground Plan
      layer is currently checked.
    time: '6:21'
  - text: Now I'm going to draw a smaller circle on the Scenic Ground Plan layer.
    time: '6:29'
  - text: >-
      If we change the stacking order of the ground plane layers, we now see that the Lighting Ground Plan is now on top
      with the larger circle.
    time: '6:40'
  - text: >-
      We can modify how we view the design layers through the Layer Options. Currently, 'Gray/Snap Others' is turned on.
      This function can be changed to 'Show Others,' so now we can see both, but we cannot snap to the layers below.
    time: '7:02'
  - text: If you want to show and snap onto the layers, simply change the layer options to 'Show/Snap Others.'
    time: '7:23'
  - text: >-
      We can also adjust this with 'Show/Snap/Modify Others,' though I do not recommend this as it can make your file
      confusing.
    time: '7:35'
  - text: >-
      This concludes the Vectorworks tutorial session on classes and design layers. If you have any questions, please
      feel free to ask. Thank you.
    time: '7:43'
