overview: >-
  This tutorial introduces the Resource Manager, Vectorworks' central hub for creating, applying, and managing resources
  such as textures, symbols, and custom libraries. You'll learn how to navigate the File Browser and Resource Viewer
  panes, access hundreds of built-in libraries, create custom resources, organize resources into folders, and search
  across all available libraries. The tutorial demonstrates how to create new Renderworks textures, manage resource
  folders, and import cloud-based resources from Vectorworks libraries. You'll also learn how to modify downloaded
  resources for your specific project needs while preserving the original library versions.
description: >-
  Learn how to create, apply, and manage resources in Vectorworks using the Resource Manager, including textures,
  symbols, and custom libraries.
