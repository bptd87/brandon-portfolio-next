common_pitfalls:
  - >-
    Forgetting to select objects before activating Mirror, Offset, or Split tools—tools require active selection to
    function.
  - >-
    Using Offset Tool in 'Offset Original' mode when you meant to keep the original—always check the mode before
    clicking.
  - >-
    Not closing polylines after using Split Tool in Trim mode, leaving open shapes that won't fill with hatches or
    textures.
  - Attempting to use Connect/Combine Tool on shapes instead of line segments—tool works on lines, not closed polygons.
  - >-
    Forgetting to select the path object in Duplicate Along Path dialog—must click 'Next' to designate which object is
    the path.
  - >-
    Using 'Duplicate by Number' in Duplicate Along Path without considering path length, resulting in overlapping or
    sparse distributions.
  - >-
    Not understanding the difference between Dual Object Connect (keeps separate lines) and Dual Object Combine (creates
    single polygon).
  - >-
    Applying Boolean operations (Add/Clip/Intersect) to objects on different layers or classes, which can produce
    unexpected results.
transcript:
  - text: >-
      Hello, this is Brandon PT Davis, theatrical scenic designer. This Vectorworks tutorial is going to cover 2D Edit
      and Modify tricks and tools.
    time: '0:04'
  - text: >-
      The first tool I'm going to show you in this tutorial is the Mirror Tool. The Mirror Tool can be accessed in the
      Basics Tool Palette. In order to use the tool, you first need to select an object. I'm going to hit X for the
      Select tool, and now I'm going to select the Mirror Tool.
    time: '0:17'
  - text: >-
      There are two modes in the Mirror Tool: Standard mode and Duplicate mode. The Standard mode will mirror the item
      on the other side from which you have indicated the mirror. The Duplicate mode will mirror and duplicate the item.
    time: '0:41'
  - text: >-
      The next tool is the Reshape Tool. It can be found in the Tools Palette, and it can also be activated by
      double-clicking on a 2D shape. There are a few modes within the Reshape Tool.
    time: '1:01'
  - text: >-
      The Reshape Tool has the Move Polygon Handles mode, which allows you to select the polygon handle and move it
      individually. The Move Edges Parallel mode allows you to move the active edge. We can also further modify a shape
      by adding vertex points in Vertex mode.
    time: '1:17'
  - text: >-
      I can add a radius by clicking on one of the handles and pulling out. I can also add a corner point. The Delete
      Vertex mode allows you to delete the vertices.
    time: '1:41'
  - text: >-
      The Offset Tool allows you to offset an object. Before you can offset, you first have to select the object and
      then go into the Offset Tool. You can also access the Offset Tool by pressing the letter O.
    time: '2:09'
  - text: >-
      The Offset Tool is currently set at a distance of 6 inches, and the mode is Offset Distance Mode and Duplicate.
      Here I have duplicated the offset. I can now lower the offset to 1 inch, and I'm going to change from Duplicate
      and Offset mode to Offset Original mode. You can also offset by points—select the object and then you can move to
      where you want to offset the object.
    time: '2:29'
  - text: >-
      The Split Tool, with the icon located here, is a powerful tool that can be used in both 2D and 3D applications.
      Before you can use the Split Tool, you first must select the shape. Now that the shape is selected, I'm going to
      go to the Split Tool.
    time: '3:10'
  - text: >-
      There are three modes in the Split Tool. The first mode is the Line Split mode. I'm going to select a point and
      then a second point, creating a line. Now when I go to select, I have two separate objects.
    time: '3:34'
  - text: >-
      Going back to the Split Tool, I can change the mode to Point Split mode, in which case I will pick a point. Now
      I've split the object with the Split Point mode.
    time: '3:54'
  - text: >-
      The last mode in the Split Tool is the Trim mode. I will draw a line and then indicate the direction in which I
      want to keep the object. This polyline is now an open shape as it doesn't have a line on all sides. In
      Vectorworks, if you go to the Object Info Palette, you can select 'Close' to close the shape.
    time: '4:12'
  - text: >-
      The Connect/Combine Tool allows you to connect or combine line segments. The first mode is the Single Object
      Connect mode. I'm going to select the object that I want connected and then the point to which I want it to be
      connected to. Now the line has been extended to this line. The hotkey for the Connect/Combine Tool is the letter
      L.
    time: '4:40'
  - text: >-
      The next mode is the Dual Object Connect mode. In this mode, I will select two objects and they will connect with
      each other at a point, but they are two separate entities.
    time: '5:11'
  - text: >-
      If you want to combine these objects, you can choose the Dual Object Combine mode. In this mode, it creates a
      polygon.
    time: '5:25'
  - text: >-
      The last mode in the Connect/Combine Tool is the Multiple Object Connect mode. First, you must select the
      destination to which you want your objects to connect, then select the objects. Now all these line segments are
      connected to this line segment.
    time: '5:43'
  - text: >-
      The next portion of this tutorial, I'm going to talk to you about the Modify drop-down menu. The Modify menu has
      many commands that are useful in your 2D drafting.
    time: '6:04'
  - text: >-
      The Modify > Move command at the top of the menu will allow you to move an object. First select the object and go
      Modify > Move. You can also use hotkeys Control or Command+M. Doing so, the Move Selection dialog box will pop up.
      I have an X offset of 3 inches and the Y offset of minus 2. You can modify the dialog as needed and press OK. Now
      this rectangle has moved.
    time: '6:15'
  - text: >-
      If you ever have a series of objects that you need aligned, you can go to Modify > Align, and there's Align to
      Grid, Align/Distribute, and there's also some 3D commands. You can also right-click on the objects and go to
      Align/Distribute and make your decision from here. I'm going to align all these objects to the top.
    time: '6:58'
  - text: >-
      The Modify menu bar also allows you to rotate objects. We have hotkeys Command+R and Command+L as well. If you
      have a complex 2D object or model, you can select the item and go to Modify > Scale.
    time: '7:28'
  - text: >-
      You can scale by factor symmetrically, symmetric by distance, or asymmetrically. Choosing Symmetric in the Modify
      Scale will scale the object in X, Y, Z directions proportionally. You can also choose to scale the object by
      Symmetric by Distance. Here I will select the current distance and then input the new distance and press OK.
    time: '7:52'
  - text: >-
      Another important Modify command are the Add/Subtract commands. I'm going to take these two objects, select both,
      go to Modify and Add Surface. Now these two objects are a single polyline.
    time: '8:34'
  - text: I can also take two objects, right-click, and Clip the Surface. Now the square is cut out of the circle.
    time: '8:54'
  - text: >-
      The third Modify option is to go to Modify and Intersect the Surface. Now where the surface is intersecting is its
      own independent shape.
    time: '9:12'
  - text: >-
      From the Modify command, you can select an object and go to Convert to Lines. Now the shape is a series of lines.
      You can also take a series of lines and go to Modify > Compose. The 2D lines have now been converted to a polygon.
      You can also right-click and find the same functions: Compose, Decompose, or return the lines back to lines.
    time: '9:26'
  - text: >-
      The next feature I'm going to show you in the Vectorworks software is Duplicate. You can duplicate an object by
      holding the Option or Alt key and selecting the object. As you see now, there is a plus sign above the cursor. As
      I pull, I will then have a duplicate object. You can also click and duplicate in place. Now there are two objects.
    time: '10:06'
  - text: >-
      The last feature I'm going to share with you in this tutorial is the Edit > Duplicate Along Path function. In
      order to duplicate along a path, we need an object (which will be the circle) and a path. I'm going to use the
      Polyline Tool to draw a path.
    time: '10:34'
  - text: >-
      I'm going to select both the object and the path and go to Edit > Duplicate Along Path. The Duplicate Along Path
      dialog will pop up. The first item says 'Select a path object.' Currently the object is selected and the path is
      not. To select the path, press Next.
    time: '11:02'
  - text: >-
      Under the Duplicate Placement items, you have two options: either Duplicate by Number of Duplicates or Duplicate
      by Fixed Distance. When choosing the Fixed Distance, we can offset the start point by a number indicated.
    time: '11:30'
  - text: >-
      I'm going to choose to duplicate the path by 1 foot and will offset the path by 6 inches. By selecting 'Center
      Object to Path,' the circle will be duplicated from its center. If you have an object like a square, you can
      select 'Tangent to Path' to keep the objects tangent to the path. I'm going to press OK.
    time: '11:49'
  - text: >-
      I have three circles that are evenly spaced by 1 foot along the path. The first object is 6 inches offset from the
      start. This concludes the Vectorworks tutorial. If you have any questions, please feel free to ask. Thank you.
    time: '12:22'
