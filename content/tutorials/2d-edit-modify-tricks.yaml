learning_objectives:
  - Master Mirror Tool in both standard and duplicate modes for creating symmetrical designs
  - Use Reshape Tool to modify polygon geometry including moving handles, edges, and adding/deleting vertices
  - Apply Offset Tool with distance and point modes to create parallel geometry at precise distances
  - Utilize Split Tool in line, point, and trim modes to divide and separate 2D shapes
  - Connect and combine multiple line segments using single, dual, and multiple object modes
  - Apply Modify menu commands including Move, Align, Rotate, and Scale with precise numerical control
  - 'Create complex shapes using Boolean operations: Add Surface, Clip Surface, and Intersect Surface'
  - Convert between lines and polygons using Compose and Decompose commands
  - Duplicate objects along paths with control over spacing, offset, and tangency options
key_concepts:
  - title: MIRROR TOOL
    content: >-
      A transformation tool that creates mirrored copies of objects across a user-defined axis. Standard mode moves the
      object to the mirrored position, while Duplicate mode creates a copy and leaves the original in place. Essential
      for creating symmetrical scenic elements.
  - title: RESHAPE TOOL
    content: >-
      An editing tool that allows direct manipulation of polygon geometry through multiple modes: Move Polygon Handles
      adjusts individual vertices, Move Edges Parallel shifts entire edges, Add Vertex creates new points (with corner
      or radius options), and Delete Vertex removes points. Activated by double-clicking 2D shapes.
  - title: OFFSET TOOL
    content: >-
      Creates parallel copies of objects at specified distances. Offset Distance Mode duplicates or moves geometry by a
      numerical value, while Offset by Points Mode allows visual placement. Hotkey 'O' provides quick access. Essential
      for creating wall thicknesses, borders, and parallel elements.
  - title: SPLIT TOOL
    content: >-
      Divides 2D and 3D objects into separate pieces using three modes: Line Split cuts along a drawn line, Point Split
      divides at a single location, and Trim Mode removes portions of geometry based on directional indication. Critical
      for breaking complex shapes into manageable components.
  - title: CONNECT/COMBINE TOOL
    content: >-
      Joins line segments and shapes using multiple modes: Single Object Connect extends one line to another, Dual
      Object Connect joins two lines at a point (keeping them separate), Dual Object Combine merges two lines into a
      single polygon, and Multiple Object Connect joins many lines to a destination point. Hotkey 'L'.
  - title: BOOLEAN OPERATIONS
    content: >-
      Geometric operations that combine or subtract shapes: Add Surface merges multiple shapes into one polygon, Clip
      Surface subtracts one shape from another, and Intersect Surface creates a new shape from overlapping areas. Found
      in Modify menu and right-click context menu.
  - title: DUPLICATE ALONG PATH
    content: >-
      An advanced feature (Edit > Duplicate Along Path) that distributes copies of an object along a curved or straight
      path. Options include duplicate by number or fixed distance, start offset, and tangency control. Center Object to
      Path places object centers on the path, while Tangent to Path rotates objects to follow path direction.
pro_tips:
  - >-
    Access Mirror Tool from Basics Tool Palette; always select the object first, then activate the tool to see mode
    options.
  - Double-click any 2D shape to instantly enter Reshape Tool mode without navigating through menus.
  - Use hotkey 'O' for Offset Tool and hotkey 'L' for Connect/Combine Tool to speed up repetitive drafting tasks.
  - >-
    In Reshape Tool, press 'U' to toggle between corner vertex and radius arc modes while adding vertices for smooth
    curves.
  - >-
    Close open polylines by selecting the shape and checking 'Closed' in the Object Info Palette—essential after using
    Split Tool in Trim mode.
  - >-
    Right-click on selected objects to access Align/Distribute, Compose/Decompose, and Boolean operations without
    opening the Modify menu.
  - Use Modify > Move (Cmd/Ctrl+M) with numerical X/Y offsets for precise object positioning instead of dragging by eye.
  - >-
    Hold Ctrl (Windows) or Option (Mac) while dragging objects to duplicate them in place—watch for the plus sign cursor
    indicator.
  - >-
    In Duplicate Along Path, use 'Center Object to Path' for circular objects and 'Tangent to Path' for directional
    objects like arrows or posts.
  - >-
    Combine Boolean operations (Add, Clip, Intersect) with Reshape Tool to create complex architectural trim profiles
    and scenic details efficiently.
