overview: >-
  This comprehensive tutorial covers the essential 2D editing and modification tools that form the foundation of
  efficient drafting workflows in Vectorworks. The tutorial systematically demonstrates ten powerful tools and commands:
  Mirror Tool (standard and duplicate modes), Reshape Tool (move polygon handles, move edges parallel, add/delete
  vertex), Offset Tool (distance and point modes), Split Tool (line, point, and trim modes), Connect/Combine Tool
  (single, dual, and multiple object modes), and key Modify menu commands including Move, Align/Distribute, Rotate,
  Scale, Add/Subtract surfaces, Convert to Lines, and Compose/Decompose.


  The tutorial emphasizes practical workflows for each tool, showing how to access them via tool palettes, hotkeys, and
  right-click context menus. Each tool section demonstrates multiple modes and options, helping users understand when to
  use standard versus duplicate modes, symmetric versus asymmetric scaling, and single versus multiple object
  operations. The tutorial also covers essential shape manipulation techniques like closing open polylines, converting
  between lines and polygons, and using Boolean operations (add, subtract, intersect) to create complex shapes from
  simple primitives.


  The final section introduces the powerful Duplicate Along Path feature, which allows users to distribute objects
  evenly along curved or straight paths with precise control over spacing, offset, and tangency. This advanced technique
  is essential for creating repeating elements like fence posts, lighting fixtures, or decorative patterns in scenic
  design documentation.
