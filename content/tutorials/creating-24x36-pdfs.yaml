learning_objectives:
  - Create a new sheet layer and configure it for 24x36 output
  - Access and configure Page Setup for large format sheets without a plotter
  - Understand how Vectorworks displays page breaks for standard printers
  - Use the 'Export the whole printable area to one page' option in Publish settings
  - Successfully export a single 24x36 PDF from multiple letter-size pages
  - Avoid common pitfalls that result in multi-page PDFs instead of single sheets
key_concepts:
  - title: PAGE SETUP WITHOUT A PLOTTER
    content: >-
      When you don't have Adobe PDF or a plotter connected, Vectorworks defaults to letter-size (8.5x11) pages. Access
      Edit > Page Setup, select your default PDF writer (e.g., Microsoft Print to PDF), and uncheck 'Choose available
      print sizes.' Then select Arch D (24x36) from the Pages section. Vectorworks will show the sheet as 3.272 pages
      horizontally and 2.8235 pages vertically—this represents how many letter-size pages would tile to cover your 24x36
      sheet.
  - title: UNDERSTANDING PAGE BREAKS
    content: >-
      Enable 'Show page breaks' in Page Setup to visualize how Vectorworks divides your 24x36 sheet into letter-size
      pages. Gray dashed lines represent individual 8.5x11 pages arranged in a grid. This helps you understand what
      Vectorworks sees as the 'auto page' layout. Turn off page breaks before publishing to avoid confusion during
      layout work.
  - title: PUBLISH TO PDF WORKFLOW
    content: >-
      Go to File > Publish, add your sheet layer, and ensure output format is set to PDF (not DWG or image). In Options,
      the critical setting is 'Export the whole printable area to one page'—this merges all letter-size tiles into a
      single 24x36 PDF. If you select 'Pages' or 'All pages' instead, Vectorworks will export individual letter-size
      pages, resulting in a multi-page PDF instead of one large sheet.
  - title: LAYOUT WORKFLOW
    content: >-
      After configuring page setup, lay out your viewports, add your title block, and build your sheet content as
      normal. The page setup configuration only affects how Vectorworks exports the final PDF—it doesn't change how you
      work on the sheet. Think of it as a 'print driver workaround' that tells Vectorworks to treat multiple letter
      pages as one large sheet during export.
pro_tips:
  - >-
    Always uncheck 'Choose available print sizes' in Page Setup when working without a plotter—this unlocks larger
    format options
  - >-
    Use 'Show page breaks' temporarily to verify your sheet is correctly divided, then turn it off to avoid visual
    clutter
  - >-
    The 'Export the whole printable area to one page' option is the key setting—memorize this to avoid multi-page
    exports
  - >-
    You can use this technique for any large format size (30x42, 36x48, etc.), not just 24x36—just select the
    appropriate Arch size
  - Save your Publish settings as a named set if you export sheets regularly—this saves time on future exports
  - >-
    If your PDF comes out as multiple pages, you likely forgot to select 'Export the whole printable area to one
    page'—go back and check Options
  - This workflow works with any PDF writer (Microsoft Print to PDF, CutePDF, etc.)—you don't need Adobe Acrobat
  - >-
    The page count display (3.272 x 2.8235) is normal—it's just Vectorworks calculating how many letter pages fit in
    24x36
shortcuts:
  - keys: File > Publish
    action: Open Publish dialog to export sheets to PDF
  - keys: Edit > Page Setup
    action: Configure page size and print settings
common_pitfalls:
  - Forgetting to uncheck 'Choose available print sizes'—results in only letter-size options being available
  - Selecting 'Pages' or 'All pages' instead of 'Export the whole printable area to one page'—creates multi-page PDFs
  - Not verifying the Arch D (24x36) selection in Page Setup—may result in incorrect sheet dimensions
  - Leaving 'Show page breaks' enabled during layout work—creates visual confusion with dashed lines everywhere
  - Assuming you need Adobe Acrobat or a plotter to export large format sheets—this workaround works with any PDF writer
  - Not saving Publish settings as a named set—wastes time reconfiguring options for every export
  - Confusing the page count display (3.272 x 2.8235) with an error—this is normal and represents letter-page tiling
transcript:
  - text: >-
      Hello, this is Brandon PT Davis. I'm just going to quickly show you how to create a 24 by 36 page if you don't
      have Adobe PDF or if you are not connected to a plotter on your computer.
    time: '0:06'
  - text: >-
      So what I'm going to do is I'm going to start with the sheet layer. I'm going to create a new sheet layer. I'm
      just going to leave it as sheet layer one, sheet title for the example.
    time: '0:26'
  - text: >-
      So currently I have a 24 by 36 page because I do have Adobe, but a way around this if you don't is we're going to
      go to Edit and then Page Setup.
    time: '0:37'
  - text: >-
      If we're on Microsoft Print to PDF or whatever default PDF writer you have, and it's set to letter size, it
      doesn't really matter.
    time: '0:50'
  - text: >-
      Then we're going to uncheck 'Choose available print sizes.' Right now Vectorworks is showing the page as one
      sheet. You can select Arch D, which is 24 by 36.
    time: '1:05'
  - text: >-
      In the pages section, horizontally it's 3.272 and vertically it's 2.8235. To show you what that means, I'm going
      to turn on 'Show page breaks.'
    time: '1:23'
  - text: >-
      I'll press OK and press OK again. Each gray dashed line represents the pages from what Vectorworks thinks your
      auto page is.
    time: '1:37'
  - text: So these are a series of 8.5 by 11 pages and how they're lined up on the grid.
    time: '1:52'
  - text: Now I'm going to go back to Edit, Page Setup, and uncheck 'Show page breaks' and press OK.
    time: '1:59'
  - text: >-
      Now I'm just going to draw an X through the center as an example, but normally you would lay out your viewports,
      add your title block, and build everything you want on the page.
    time: '2:04'
  - text: Then we go to File and Publish. I'm going to add the new page that we just created.
    time: '2:20'
  - text: And right now it's publishing to PDF. You can change it to DWG or an image, but we want PDF.
    time: '2:31'
  - text: Select Options. Make sure 'Export the whole printable area to one page' is selected.
    time: '2:40'
  - text: If you select 'Pages' or 'All pages,' it may export individual pages instead.
    time: '2:49'
  - text: So select 'Export the whole printable area,' press OK, and then press Publish.
    time: '2:57'
  - text: I'm not going to save the set for this example. I'll leave it as untitled two.
    time: '3:04'
  - text: And what you'll see is one singular 24 by 36 page.
    time: '3:11'
  - text: >-
      So if you're having issues with printing your RD plates, that's basically the Vectorworks solution. If you have
      any other questions, let me know. Thank you.
    time: '3:18'
