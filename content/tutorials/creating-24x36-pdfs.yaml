overview: >-
  This quick tutorial demonstrates the essential workflow for exporting large format sheets to PDF without requiring
  Adobe PDF or a physical plotter connection. You'll learn how to configure page setup to recognize 24x36 dimensions,
  understand how Vectorworks handles page breaks for standard letter-size printers, and use the Publish command with the
  correct settings to export your entire sheet as a single PDF page. This technique is critical for students and
  professionals who need to submit or share large format drawings but don't have access to professional printing
  equipment.
description: >-
  Learn how to export large format sheets (24x36) to PDF when you don't have Adobe PDF or a plotter connected to your
  computer.
