overview: >-
  This comprehensive tutorial covers the complete 3D modeling toolkit in Vectorworks. You'll learn how to create
  primitive objects (sphere, hemisphere, cone, pyramid, ellipsoidal), use the push/pull tool for quick extrusions,
  extract surfaces and curves from complex objects, add fillets and chamfers to edges, taper faces at specific angles,
  deform solids with twist/bend/bulge modes, and create hollow objects with the shell solid tool. Each tool is
  demonstrated with practical examples showing how to adjust parameters, select faces and edges, and combine tools for
  complex modeling workflows.
description: >-
  Master the essential 3D modeling tools in Vectorworks including primitive objects, push/pull, extract, fillet,
  chamfer, taper, deform, and shell solid.
