learning_objectives:
  - 'Create primitive 3D objects: sphere, hemisphere, cone, pyramid, and ellipsoidal shapes'
  - Use push/pull tool to extrude and move faces in different modes
  - Extract surfaces and curves from complex 3D objects for texture application
  - Apply fillets and chamfers to edges and faces with precise radius control
  - Taper faces using tangent and picked face modes
  - Deform solids using twist, bend (finite/symmetric), and bulge modes
  - Create hollow objects with shell solid tool by selecting faces and setting thickness
  - Understand the difference between extrude face mode and move face mode
  - Modify 3D objects using the Object Info Palette after creation
key_concepts:
  - title: PRIMITIVE OBJECTS
    content: >-
      Vectorworks provides tools to create basic 3D shapes without manual modeling: Sphere (Shift+3), Hemisphere (half
      sphere), Cone (with radius/height or radius/tip modes), Pyramid (adjustable sides, regular or frustrum), and
      Ellipsoidal (adjustable height/width/length). These primitives use familiar circle-tool modes (radius, diameter,
      center-radius) and can be modified in the Object Info Palette after creation.
  - title: PUSH/PULL TOOL
    content: >-
      Press P to access push/pull for quick face manipulation. Extrude Face Mode follows the angle of the selected face
      (useful for tapered objects). Move Face Mode moves the face perpendicular to the object regardless of face angle.
      Both modes work on closed faces and can be applied to multiple areas of the same object. This is the fastest way
      to add height variations to extruded shapes.
  - title: EXTRACT TOOL
    content: >-
      Extract (Shift+E) pulls surfaces or curves from complex 3D objects. Extract Surface Mode isolates individual faces
      for separate texturing—extracted surfaces sit on top of the original. Extract Curve Mode pulls edge curves that
      can be combined with Connect/Combine tool and used for extrude-along-path operations. Use Shift+arrow keys to
      nudge extracted surfaces away from the original object.
  - title: FILLET & CHAMFER EDGES
    content: >-
      Fillet Edge Tool (Ctrl+F) rounds edges with adjustable radius. Chamfer Tool creates angled cuts instead of curves.
      Both tools let you select individual edges (Shift+click), entire faces, or all faces at once. Fillets and chamfers
      remain editable in the Object Info Palette. Use Ctrl+U to ungroup and return to the original shape. Fillet is
      essential for realistic product modeling and architectural details.
  - title: TAPER FACE TOOL
    content: >-
      Taper Face has two modes: Tangent Face Mode (select anchor face first, then the face to taper) and Picked Face
      Mode (pick two faces to taper between them). Press Tab to enter specific angles numerically. Tapering is useful
      for creating sloped walls, angled surfaces, and architectural features without manual vertex manipulation.
  - title: DEFORM TOOL
    content: >-
      Deform Tool offers three modes: Twist Solid (rotate object around center point—keep angles moderate to avoid
      computation issues), Bend Solid (finite mode bends from one point, symmetric mode bends from both sides), and
      Bulge Mode (select point and bulge outward). Extreme deformations require more processing power. Deformed objects
      remain editable in Object Info Palette.
  - title: SHELL SOLID TOOL
    content: >-
      Shell Solid (Shift+S) hollows out 3D objects by adding thickness to selected faces. Select a face, set thickness
      (e.g., 0.5"), and check to create a hollow object like a vase or container. Works on both complex organic shapes
      and simple extrudes. Essential for creating objects that need interior volume, such as vessels, boxes, and
      architectural elements.
pro_tips:
  - Work in a rotated 3D view when using cone, pyramid, and deform tools—it's easier to visualize the results
  - Use Shift+click to select multiple edges for fillet or chamfer operations, then adjust radius uniformly
  - Extract surfaces to apply different textures to specific faces without affecting the entire object
  - Press Tab while using taper, fillet, or deform tools to enter precise numeric values instead of dragging
  - Keep twist deformations under 180 degrees to avoid excessive processing time and visual artifacts
  - Use symmetric bend mode for creating arches and curved structures that need to be balanced
  - >-
    Shell solid works on any face—select the top of an extrude to create a box, or the side of an organic shape for a
    vase
  - >-
    Combine extract curve with extrude-along-path to create pipes, railings, and decorative elements that follow complex
    surfaces
  - Use Ctrl+U to ungroup filleted or chamfered objects and return to the original shape if you need to start over
  - Modify primitive objects in the Object Info Palette after creation—you can adjust radius, height, sides, and more
  - Use push/pull's move face mode when you need to adjust depth without following the object's angle
  - Create a library of primitive objects with common dimensions to speed up your modeling workflow
shortcuts:
  - keys: Shift + 3
    action: Activate Sphere tool
  - keys: P
    action: Activate Push/Pull tool
  - keys: Shift + E
    action: Activate Extract tool
  - keys: Ctrl + F
    action: Activate Fillet Edge tool
  - keys: Shift + S
    action: Activate Shell Solid tool
  - keys: Tab
    action: Enter numeric value while using tools
  - keys: Shift + Arrow
    action: Nudge extracted surfaces
  - keys: Ctrl + U
    action: Ungroup object to return to original shape
common_pitfalls:
  - Forgetting to work in 3D view when using cone or pyramid tools—results are hard to visualize in top/plan view
  - Selecting the wrong face when using shell solid—always verify which face is highlighted before confirming
  - Using extreme twist angles (over 180°) that cause long processing times and potential crashes
  - Not using Shift+click to select multiple edges for fillet/chamfer—results in inconsistent edge treatments
  - Confusing extrude face mode with move face mode in push/pull—leads to unexpected angles on tapered objects
  - Forgetting to press Tab to enter numeric values—dragging is less precise than typing exact measurements
  - Not extracting surfaces before applying textures to specific faces—results in entire object being textured
  - Attempting to fillet or chamfer edges on objects with complex geometry—simplify first or select edges carefully
  - Not checking Object Info Palette after creating primitives—missing opportunities to adjust parameters precisely
  - Using bend solid without understanding finite vs symmetric modes—creates unbalanced or unexpected curves
transcript:
  - text: >-
      Hello, this is Brandon PT Davis, theatrical scenic designer, and in this Vectorworks tutorial video we're going to
      be going over the 3D modeling tools in the tool palette.
    time: '0:06'
  - text: >-
      The 3D modeling tools are located here in the tool palette. You'll see a variety of tools which you can use for 3D
      modeling.
    time: '0:18'
  - text: >-
      The first set of tools I'm going to show you are probably the more simple tools. These are ways to create
      primitive objects in Vectorworks without a lot of effort.
    time: '0:29'
  - text: As you've probably recognized from the last video, creating a cube is relatively easy with the extrude function.
    time: '0:43'
  - text: But creating a sphere may be more difficult, so here is the sphere tool.
    time: '0:50'
  - text: You can access the sphere tool by hitting Shift+3.
    time: '0:56'
  - text: >-
      It's like using the circle tool—you pick the radius, in this case a radius of 6 inches, and it will create a
      sphere.
    time: '1:01'
  - text: As we fly over, we'll see this is a sphere.
    time: '1:15'
  - text: >-
      You can also use radius mode, diameter mode, and center radius mode—all modes you're familiar with using the
      circle tool.
    time: '1:22'
  - text: Going back into the top plan, we'll next look at the hemisphere.
    time: '1:32'
  - text: >-
      A hemisphere is essentially a half circle. The hemisphere works exactly like the sphere tool, only when you look
      in 3D mode it will be the half sphere.
    time: '1:37'
  - text: The next primitive object you can find in the 3D modeling tools palette is the cone tool.
    time: '1:52'
  - text: The cone tool is best to have in a rotated view. Selecting the cone tool, I can use the radius and height mode.
    time: '2:02'
  - text: >-
      First I'll select the center point, then select the radius just as you would with the circle tool, then one click
      and we pick the height.
    time: '2:10'
  - text: In this case I'm going to make the height 12 inches, and now we have a cone.
    time: '2:25'
  - text: >-
      You can also create a cone using radius and tip mode. Here we select the radius and then adjust the angle of the
      tip for a more organic shape.
    time: '2:34'
  - text: Another primitive we can create is the pyramid object tool.
    time: '2:52'
  - text: >-
      To adjust the pyramid object, we can change the number of sides, decide if it's regular or frustrum, change the
      mode—inscribed or circumscribed—and adjust the base radius, top, and the height.
    time: '3:00'
  - text: I'm going to go with the defaults and place our pyramid. Now we have our three-sided pyramid.
    time: '3:22'
  - text: You can go to the Object Info Palette and adjust the settings there as well.
    time: '3:34'
  - text: The last primitive object tool I'm going to be showing you is the ellipsoidal object tool.
    time: '3:56'
  - text: >-
      After selecting this object, we can manage its attributes in the ellipsoidal object palette and place the object
      in the document.
    time: '4:03'
  - text: We can also go to the Object Info Palette and further change the height, width, and length of the object.
    time: '4:17'
  - text: The next tool I'm going to show you is the push/pull tool.
    time: '4:28'
  - text: You can access push/pull by pressing P. I'm going to start with a rectangle and press P for push/pull.
    time: '4:35'
  - text: >-
      We start in extrude face mode. This allows you to select a closed face, click once, and adjust the height of the
      face.
    time: '4:46'
  - text: You can do this in multiple areas.
    time: '4:56'
  - text: With this tapered object, I'll show you the difference between extrude face mode and move face mode.
    time: '5:02'
  - text: In extrude face mode, when we extrude the face it follows the angle of the object.
    time: '5:11'
  - text: >-
      But if I go back to the extruded object and select move face mode, you'll see we move the face perpendicular to
      the object.
    time: '5:20'
  - text: This is different than extrude face mode, where we extrude the face in the direction the face is oriented.
    time: '5:36'
  - text: >-
      Next I'm going to show you the extract tool. The extract tool is located here and can also be accessed by hitting
      Shift+E.
    time: '5:48'
  - text: >-
      To show you how it works, I have this odd shape with a wood grain texture. Imagine I want just one face—this
      face—and I want it to be blue.
    time: '6:00'
  - text: Because this is a complex object, Vectorworks doesn't always know what to define as the top or sides.
    time: '6:17'
  - text: >-
      So using the extract tool, I can choose different modes. There's extract by point, extract curve, extract iso
      parametric curve, and extract surface mode.
    time: '6:42'
  - text: I'm going to select extract surface mode, I click this surface, and hit the check mark.
    time: '7:09'
  - text: Now we've created another surface on top, so now I can go to my Resource Manager and apply a blue texture.
    time: '7:16'
  - text: >-
      We can't see it yet, so a trick is to go into a front, left, or right view, hold Shift and nudge it with the arrow
      key one time.
    time: '7:28'
  - text: Now it looks like we have our texture. If I go to a fast Renderworks mode, we can see the texture sitting on top.
    time: '7:45'
  - text: Another useful mode is extract curve mode. I can select any number of curves, then check this.
    time: '8:04'
  - text: Now I have these curves in a group. I can click into the group and modify them.
    time: '8:24'
  - text: Using the connect/combine tool, I can combine these in 3D. We'll use position matching and connect.
    time: '8:28'
  - text: Make sure you're in the right mode, then I could draw a circle on the bottom and extrude along path.
    time: '8:50'
  - text: Press OK. Now I have a cylinder that runs along the object.
    time: '9:15'
  - text: The next tool I'm going to show you is the fillet edge tool. This is a tool you'll use often.
    time: '9:25'
  - text: It's similar to the fillet tool in the basic tool palette, but for 3D objects.
    time: '9:30'
  - text: >-
      I have a 10 inch by 10 inch by 10 inch cube. I'm going to select the fillet tool—you can also access it with
      Ctrl+F.
    time: '9:43'
  - text: >-
      We can adjust the radius. I'll start with a half inch, then I can select edges by holding Shift and clicking the
      lines.
    time: '9:52'
  - text: When I hit the check box, the fillet is created.
    time: '10:08'
  - text: You can adjust the fillet in the Object Info Palette, and there we are.
    time: '10:16'
  - text: >-
      To remove the fillet, I can select remove and they're all gone, or I can modify which edges are selected and
      recheck the box.
    time: '10:31'
  - text: You can also unselect edges with Shift and then hit the check box again.
    time: '10:51'
  - text: >-
      In tool preferences you can also select faces instead of edges. Here's a face selected, and it selects the entire
      face.
    time: '11:00'
  - text: You can also choose all faces and hit the check box. Now the entire object has a half-inch fillet.
    time: '11:16'
  - text: You can also hit Ctrl+U to ungroup and return to the original shape.
    time: '11:31'
  - text: Next I'll show you the chamfer tool. This is similar to what you're used to in the basic tool palette.
    time: '11:38'
  - text: I have the chamfer set to 1. I select the edges and hit the check box.
    time: '11:47'
  - text: >-
      Now instead of a fillet, we have a chamfer. You'll see similar options as fillet, and you can modify chamfers in
      the Object Info Palette as well.
    time: '11:57'
  - text: The next tool is the taper face tool.
    time: '12:17'
  - text: >-
      In tangent face mode, first select the anchor face—the face you will not modify—then select the second face and
      taper it at an angle.
    time: '12:21'
  - text: By hitting Tab, I can type a specific angle. Here I'll set it to 15 degrees.
    time: '12:46'
  - text: With picked face mode, you pick one face, then the other face, and it tapers the face like that.
    time: '12:55'
  - text: The next tool I'm showing you is the deform tool. It's located here and it has several modes.
    time: '13:25'
  - text: I'm going to take this rectangle and show a few. First is twist solid mode.
    time: '13:40'
  - text: Select the mode, then select the object, choose a point—I'll pick the center—then I can rotate the object.
    time: '13:48'
  - text: Here it's at 90 degrees.
    time: '14:04'
  - text: >-
      Keep in mind the more extreme the twist, the harder it can be for your computer to compute, so I'll keep it at 90
      degrees.
    time: '14:17'
  - text: Now we've twisted the rectangle to create this shape. I can still modify the height in the Object Info Palette.
    time: '14:36'
  - text: I'll set this to six feet, then I'll go to front view and adjust it closer to zero.
    time: '14:57'
  - text: Next, I'll show bend solid mode. With bend solid, we can use finite mode where you bend from a point, like this.
    time: '15:13'
  - text: Or symmetric mode, where it bends from both sides.
    time: '15:44'
  - text: The last mode I'll share is bulge mode. Select the object, pick a point, and bulge it out like that.
    time: '16:03'
  - text: The last 3D modeling tool I'm going to show you is the shell solid tool. You can access it by hitting Shift+S.
    time: '16:50'
  - text: With this organic shape we created, let's say we want to make it like a vase.
    time: '17:02'
  - text: I'll select the shell tool, choose this face, and set the thickness to a half inch.
    time: '17:18'
  - text: With the face selected, hit the check mark. Now it's added thickness and hollowed out the object.
    time: '17:29'
  - text: You can also do this with a simple extrude—select the face and shell it to add thickness.
    time: '17:48'
  - text: This concludes our Vectorworks tutorial. If you have any questions, please feel free to ask. Thank you.
    time: '18:14'
