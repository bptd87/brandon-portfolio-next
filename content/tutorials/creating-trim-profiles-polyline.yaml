overview: >-
  This quick-tip tutorial demonstrates a practical workflow for creating accurate architectural trim and molding
  profiles in Vectorworks. The tutorial walks through the complete process: sourcing reference images with real-world
  dimensions from manufacturer websites, importing images into Vectorworks, tracing profiles using the polyline tool
  with multiple vertex modes, scaling traced geometry to match actual dimensions, and converting finished profiles into
  reusable 2D symbols.


  The workflow emphasizes efficiency by showing how to trace profiles directly without pre-scaling the reference image,
  then applying accurate dimensions after tracing is complete. This approach saves time and reduces complexity compared
  to traditional scaling methods. The tutorial covers essential polyline techniques including corner vertex mode, radius
  point arc mode, and polygon point editing for achieving smooth curves that match the reference profile.


  Finally, the tutorial demonstrates how to convert the finished profile into a 2D symbol stored in the Resource
  Manager, making it instantly available for reuse across multiple drawings. This symbol workflow ensures consistency
  across documentation and eliminates the need to redraw common trim profiles repeatedly.
description: >-
  Learn how to quickly create accurate trim and molding profiles by tracing reference images using the polyline tool and
  converting them to reusable 2D symbols.
