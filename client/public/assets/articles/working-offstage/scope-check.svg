  <text x="140" y="98" fill="#9CA3B4" font-family="Arial, sans-serif" font-size="18" letter-spacing="5">SCOPE CHECK</text>
  <text x="140" y="152" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="68" font-weight="700">Before you estimate anything</text>
  <text x="140" y="205" fill="#A7ADBA" font-family="Arial, sans-serif" font-size="26">What sounds quick is often a full pass hiding behind soft language.</text>

