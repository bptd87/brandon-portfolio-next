      <circle cx="44" cy="44" r="18" fill="#181B23" stroke="#3A404F"/>
      <path d="M35 44L41 50L54 36" stroke="#EFD9B9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="106" fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700">Review PDFs</text>
      <text x="28" y="138" fill="#A6ADBA" font-family="Arial, sans-serif" font-size="22">Drawings reveal scope.</text>
    </g>

    <g transform="translate(660 44)">
      <rect width="286" height="170" rx="24" fill="#11131A" stroke="#262A36"/>
      <circle cx="44" cy="44" r="18" fill="#181B23" stroke="#3A404F"/>
      <path d="M35 44L41 50L54 36" stroke="#EFD9B9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="106" fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700">Reference images</text>
      <text x="28" y="138" fill="#A6ADBA" font-family="Arial, sans-serif" font-size="22">Mood changes labor.</text>
    </g>

    <g transform="translate(968 44)">
