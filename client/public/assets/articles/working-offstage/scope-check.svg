      <text x="28" y="106" fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700">Open the files</text>
      <text x="28" y="138" fill="#A6ADBA" font-family="Arial, sans-serif" font-size="22">Do not bid blind.</text>
    </g>

    <g transform="translate(352 44)">
