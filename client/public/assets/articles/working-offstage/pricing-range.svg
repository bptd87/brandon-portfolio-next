<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="220" y1="120" x2="1380" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101218"/>
      <stop offset="1" stop-color="#06070C"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(780 630) rotate(90) scale(280 280)">
      <stop stop-color="#CA7D45" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#CA7D45" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg3)"/>
  <circle cx="780" cy="630" r="280" fill="url(#glow3)"/>

  <text x="140" y="98" fill="#9CA3B4" font-family="Arial, sans-serif" font-size="18" letter-spacing="5">FREELANCE PRICING</text>
  <text x="140" y="152" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="68" font-weight="700">Start with the market. Quote a range.</text>
  <text x="140" y="205" fill="#A7ADBA" font-family="Arial, sans-serif" font-size="26">A useful baseline beats a guess. A range protects the project.</text>

  <g transform="translate(140 310)">
    <rect width="1320" height="368" rx="30" fill="#0C0D12" stroke="#222631"/>

    <g transform="translate(48 52)">
      <rect width="272" height="170" rx="24" fill="#11131A" stroke="#262A36"/>
      <text x="28" y="42" fill="#D2AF87" font-family="Arial, sans-serif" font-size="16" letter-spacing="3">STEP 01</text>
      <text x="28" y="96" fill="#F5F7FA" font-family="Arial, sans-serif" font-size="38" font-weight="700">Check salary</text>
      <text x="28" y="132" fill="#A6ADBA" font-family="Arial, sans-serif" font-size="22">Look at real roles in your market.</text>
    </g>

    <g transform="translate(360 52)">
      <rect width="272" height="170" rx="24" fill="#11131A" stroke="#262A36"/>
      <text x="28" y="42" fill="#D2AF87" font-family="Arial, sans-serif" font-size="16" letter-spacing="3">STEP 02</text>
      <text x="28" y="96" fill="#F5F7FA" font-family="Arial, sans-serif" font-size="38" font-weight="700">Convert hourly</text>
      <text x="28" y="132" fill="#A6ADBA" font-family="Arial, sans-serif" font-size="22">That becomes your baseline.</text>
    </g>

    <g transform="translate(672 52)">
      <rect width="272" height="170" rx="24" fill="#11131A" stroke="#262A36"/>
      <text x="28" y="42" fill="#D2AF87" font-family="Arial, sans-serif" font-size="16" letter-spacing="3">STEP 03</text>
      <text x="28" y="96" fill="#F5F7FA" font-family="Arial, sans-serif" font-size="38" font-weight="700">Add 20%</text>
      <text x="28" y="132" fill="#A6ADBA" font-family="Arial, sans-serif" font-size="22">Account for freelance realities.</text>
    </g>

    <g transform="translate(984 52)">
      <rect width="288" height="170" rx="24" fill="#14161E" stroke="#54432F"/>
      <text x="28" y="42" fill="#E4C093" font-family="Arial, sans-serif" font-size="16" letter-spacing="3">STEP 04</text>
      <text x="28" y="92" fill="#FFF7ED" font-family="Arial, sans-serif" font-size="34" font-weight="700">Quote a range</text>
      <text x="28" y="130" fill="#E3D0BC" font-family="Arial, sans-serif" font-size="22">20–40 hours, not one hard number.</text>
    </g>

    <path d="M320 137H360" stroke="#3B404E" stroke-width="2"/>
    <path d="M632 137H672" stroke="#3B404E" stroke-width="2"/>
    <path d="M944 137H984" stroke="#3B404E" stroke-width="2"/>

    <g transform="translate(48 258)">
      <rect width="1224" height="62" rx="18" fill="#12141B" stroke="#262A36"/>
      <text x="28" y="40" fill="#F6F8FA" font-family="Arial, sans-serif" font-size="28" font-weight="700">Why it works:</text>
      <text x="206" y="40" fill="#A6ADBA" font-family="Arial, sans-serif" font-size="28">it protects your time, sets expectations early, and reduces renegotiation.</text>
    </g>
  </g>

  <text x="140" y="806" fill="#959CAB" font-family="Arial, sans-serif" font-size="24">The range often matters more than the rate.</text>
</svg>
