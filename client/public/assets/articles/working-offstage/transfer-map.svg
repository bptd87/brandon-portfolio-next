  <text x="138" y="142" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="68" font-weight="700">The skill set already transfers</text>
  <text x="138" y="790" fill="#959CAB" font-family="Arial, sans-serif" font-size="24">The tools may shift. The core process stays the same.</text>
