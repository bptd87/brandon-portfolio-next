    <text x="28" y="84" fill="#F3F4F6" font-family="Arial, sans-serif" font-size="40" font-weight="700">Drafting</text>
    <text x="28" y="124" fill="#F3F4F6" font-family="Arial, sans-serif" font-size="40" font-weight="700">&amp; Visualization</text>
  </g>

