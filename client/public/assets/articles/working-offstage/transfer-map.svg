<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="220" y1="120" x2="1380" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111218"/>
      <stop offset="1" stop-color="#08090E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(802 430) rotate(90) scale(170 170)">
      <stop stop-color="#F2D2A3" stop-opacity="0.95"/>
      <stop offset="0.32" stop-color="#C88A4B" stop-opacity="0.48"/>
      <stop offset="0.72" stop-color="#7A4B28" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7A4B28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="420" y1="220" x2="1180" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="802" cy="430" r="170" fill="url(#glow)"/>
  <circle cx="802" cy="430" r="78" fill="#EFE7D7" fill-opacity="0.92" filter="url(#soft)"/>

