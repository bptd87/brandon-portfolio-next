    <text x="28" y="84" fill="#F3F4F6" font-family="Arial, sans-serif" font-size="40" font-weight="700">Themed</text>
    <text x="28" y="124" fill="#F3F4F6" font-family="Arial, sans-serif" font-size="40" font-weight="700">Entertainment</text>
  </g>

  <g transform="translate(1120 190)">
    <rect width="300" height="164" rx="24" fill="#0D0E13" stroke="#242732"/>
    <text x="28" y="42" fill="#D1B28A" font-family="Arial, sans-serif" font-size="16" letter-spacing="3">LANE 02</text>
    <text x="28" y="84" fill="#F3F4F6" font-family="Arial, sans-serif" font-size="40" font-weight="700">Architectural</text>
    <text x="28" y="124" fill="#F3F4F6" font-family="Arial, sans-serif" font-size="40" font-weight="700">Visualization</text>
